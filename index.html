const SIGHTS=[{id:"g-daltvila",ico:"ti-building-castle",col:"ico-bl",nm:"Dalt Vila — Ibiza Town",sub:"UNESCO World Heritage Site",badge:null,pills:[{t:"Free",c:"free"},{t:"All day",c:"time"},{t:"20 mins from villa",c:"info"}],desc:"The walled hilltop town that has stood here since the 16th century — a UNESCO World Heritage Site and the most historically significant place on the island. The Renaissance fortification walls, the cathedral, the narrow cobbled streets and the panoramic views make this a full-day destination.",sections:[{title:"What to See",items:[{key:"The ramparts",val:"Walk the full circuit of the 16th-century fortification walls. The views across the marina, the island and out to Formentera are extraordinary at any time of day."},{key:"Dalt Vila streets",val:"Narrow cobbled streets winding up through layers of history — medieval, Arab, Roman origins visible in the architecture. Small galleries, boutiques and restaurants tucked into ancient buildings."},{key:"The cathedral",val:"At the highest point. The terrace in front of it is one of the best viewpoints on the island. Worth climbing to even if the cathedral itself is closed."},{key:"The evening light",val:"The stone walls in the evening light are extraordinary — the whole place turns golden. Come late afternoon and stay as long as the light lasts."}]},{title:"Practical Details",items:[{key:"Free to enter",val:"The walls and streets are free. Some specific sites have small entry fees."},{key:"Hours",val:"The area is open all day. The cathedral has specific opening hours."},{key:"Getting there",val:"20 minutes from the villa. Park outside the walls and walk in — cars cannot access most of Dalt Vila."},{key:"Best approach",val:"Morning for a quiet wander, late afternoon for the light, evening for dinner in the old town."}]}],note:null,maps:"https://www.google.com/maps/search/Dalt+Vila+Ibiza+Town"},
{id:"g-esvedra",ico:"ti-mountain",col:"ico-gn",nm:"Es Vedra and Cala d'Hort",sub:"Southwest Ibiza · 30 mins from villa",badge:null,pills:[{t:"Free",c:"free"},{t:"Sunset essential",c:"time"}],desc:"The island's most dramatic natural sight — a 382-metre rocky island rising from the sea, uninhabited and protected. Various legends attach to it including connections to Ulysses and the Sirens. Best viewed from the cliff paths above Cala d'Hort at sunset.",sections:[{title:"The Experience",items:[{key:"The legend",val:"Es Vedra is supposedly where Homer placed the island of the Sirens in the Odyssey. It is also claimed to be one of the world's most magnetic spots after the North and South Poles. The legends are part of the experience."},{key:"Best viewpoint",val:"The cliff paths above Cala d'Hort (see the walk entry). The view looking directly at the rock with the sea below is one of the defining images of Ibiza."},{key:"Sunset timing",val:"In September the sun sets slightly north of west — it drops behind or very near Es Vedra. The timing is approximately 8:15pm in early September. Being in position by 7:30pm is sensible."}]},{title:"Practical Details",items:[{key:"Access",val:"Drive to Cala d'Hort and walk the cliff paths. 30 minutes from the villa."},{key:"The beach restaurant",val:"The restaurant at Cala d'Hort beach has direct views. A natural combination — walk the cliffs at sunset, dinner at the restaurant afterwards."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJs7iAo69MmRIRJJzqAkHqgeQ"},
{id:"g-sessalines",ico:"ti-leaf",col:"ico-gn",nm:"Ses Salines natural park",sub:"South · 35 mins from villa",badge:null,pills:[{t:"Free",c:"free"},{t:"Close to airport",c:"info"},{t:"Flamingos possible",c:"free"}],desc:"UNESCO-protected salt flats, dunes and pine forest. Flamingos are possible in September as they gather before winter migration. A completely different landscape from anywhere else on the island. Close to the airport — ideal for a gentle last morning.",sections:[{title:"What to See",items:[{key:"The salt pans",val:"Pink and white crystalline flats producing salt since Phoenician times. The colour intensifies toward sunset."},{key:"Wildlife",val:"Flamingos in September, wading birds, raptors. The transition between the salt flat ecosystem and the pine dune ecosystem supports unusual biodiversity."},{key:"Es Cavallet beach",val:"One of the most beautiful beaches on the island — long, natural, backed by dunes and pine. Adjacent to the park."}]},{title:"Practical Details",items:[{key:"Free entry",val:"Open access. No ticket required."},{key:"Best timing",val:"Morning for wildlife. Combine with Experimental Beach (Cavallet area) for a final sundowner."},{key:"Airport proximity",val:"5 minutes from the runway — useful for a last-morning activity."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJa9fB0nNFmRIRIy2Yk7wr0H0"},
{id:"g-benirras",ico:"ti-wave-sine",col:"ico-bl",nm:"Cala Benirras",sub:"North Ibiza",badge:null,pills:[{t:"Free",c:"free"},{t:"Best at sunset",c:"time"},{t:"Bus on Sundays",c:"warn"}],desc:"Dramatic northern beach famous for the drum circles and hippie market. A beautiful curved bay with the characteristic God's Finger islet rising from the sea at the western end. The sunset here on a Sunday is one of the unmissable Ibiza experiences.",sections:[{title:"The Experience",items:[{key:"Sunday drum circles",val:"Drummers of all ages gather on the beach and rocks as the sun drops behind God's Finger. Organic, building, genuinely moving. One of the most authentic Ibiza experiences and entirely free."},{key:"Friday and Tuesday hippie market",val:"A market of artisan stalls and food around the bay at sunset. Less intense than the drum circles but a lovely early evening."}]},{title:"Practical Details",items:[{key:"Sunday logistics",val:"Traffic is impossible on Sundays. Park at Sant Joan car park and take the shuttle bus. Not optional."},{key:"Friday and Tuesday",val:"Drive and park at the beach. Much easier."},{key:"Timing in September",val:"Sunset around 8:15pm early September. Arrive 45 minutes before for the best position."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJMarVGW48mRIRzA5PaaR-b48"},
{id:"g-calabassa",ico:"ti-wave-sine",col:"ico-bl",nm:"Cala Bassa",sub:"West coast · 20 mins from villa",badge:null,pills:[{t:"Free beach",c:"free"},{t:"Crystal water",c:"info"},{t:"Walk starting point",c:"time"}],desc:"One of the most beautiful west coast beaches on the island — a horseshoe bay with clear turquoise water, pine trees and the Torre den Rovira watchtower above. Starting point for the coastal loop walk that links three beaches.",sections:[{title:"The Beach",items:[{key:"Water quality",val:"Consistently clear and clean. The shallow entry makes it good for swimming at any pace."},{key:"Setting",val:"Backed by pine trees with the watchtower visible above. More protected and less developed than many Ibiza beaches."},{key:"Beach club",val:"There is a beach club on the beach but the public section is accessible without minimum spend."}]},{title:"Practical Details",items:[{key:"Getting there",val:"20 minutes from the villa. Summer bus service from Sant Antoni if you prefer."},{key:"The walk",val:"Starting point for the Torre den Rovira coastal loop linking Cala Bassa, Torre den Rovira and Cala Conta."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJBxfkK45KmRIRxSB6XOTHhik"},
{id:"g-puntagalera",ico:"ti-wave-sine",col:"ico-bl",nm:"Punta Galera stone platform",sub:"Near Cala Salada · 20 mins",badge:null,pills:[{t:"Free",c:"free"},{t:"Very local",c:"free"},{t:"Best at sunset",c:"time"}],desc:"A unique geological feature — flat limestone terraces descending in steps into crystal clear water. Very popular with locals, almost completely unknown to tourists. The rock formations are unlike anything else on the island.",sections:[{title:"What to Expect",items:[{key:"The geology",val:"Layered flat limestone descending into the sea. Natural hollows and pools form in the rock. People lay out on the flat sections and swim from the edges."},{key:"Swimming",val:"Excellent — clear, calm, accessible. The natural rock pools are sheltered even when there is some swell on the open sections."},{key:"Sunset",val:"The flat terraces face west. Watching the sunset from here with your feet in the water is one of the simple pleasures of staying near the villa."}]},{title:"Practical Details",items:[{key:"Getting there",val:"Park at Cala Salada and take the coastal path north. The platform is approximately 15 minutes from the car park."},{key:"What to bring",val:"Swimming things, water shoes or sandals for the rocky approach, snacks and water."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ-QZYi3Q2mRIRc_lCgzzCtfw"},
{id:"g-xarraca",ico:"ti-wave-sine",col:"ico-bl",nm:"Cala Xarraca",sub:"North · Near Portinatx",badge:null,pills:[{t:"Free",c:"free"},{t:"Mud bath",c:"free"},{t:"Sheltered cove",c:"info"}],desc:"A sheltered northern cove with something genuinely unusual — a natural mud bath in a crevice to the left of the bay. The reddish clay emerges from the cliff face, people cover themselves and wash off in the clear water. Quiet and local.",sections:[{title:"What to Do",items:[{key:"The mud bath",val:"In the crevice to the left when facing the sea. Reddish clay, traditionally held to have therapeutic properties. Apply, wait, wash off. A genuinely unusual experience."},{key:"Swimming",val:"The cove is sheltered and exceptionally clear. Good snorkelling off the rocks."},{key:"Extension",val:"Continue east along the coast toward isolated coves if you want more walking."}]},{title:"Practical Details",items:[{key:"Getting there",val:"Follow signs to Portinatx then Cala Xarraca. Small car park."},{key:"Best time",val:"Morning. Quiet and shaded at the eastern end of the bay."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ-ZREWqE9mRIRJI9KyDMTKi8"},
{id:"g-santagertrudis",ico:"ti-home",col:"ico-am",nm:"Santa Gertrudis",sub:"Interior village · 15 mins from villa",badge:null,pills:[{t:"15 mins from villa",c:"info"},{t:"Bar Costa + Can Mimosa",c:"free"}],desc:"The most charming of the interior villages — a whitewashed cluster around a simple church with Bar Costa on one side and Can Mimosa tucked just behind. The village square is unhurried and entirely local. Worth arriving in time for an early evening drink before dinner.",sections:[{title:"What to Do",items:[{key:"Bar Costa",val:"The institution. Hanging hams, famous bocadillos, cold beer in the square. Arrive around 6:30pm."},{key:"Can Mimosa",val:"200m from Bar Costa — the farmhouse garden restaurant. Move there at 7:30pm for dinner."},{key:"The square",val:"Simply sit in the square and let the village evening happen around you. The pace is different from the coast."}]},{title:"Practical Details",items:[{key:"Getting there",val:"15 minutes from the villa. Easy drive."},{key:"Best timing",val:"6pm to 10pm — the perfect village evening."}]}],note:null,maps:"https://www.google.com/maps/search/Santa+Gertrudis+de+Fruitera+Ibiza"},
{id:"g-santjoan",ico:"ti-home",col:"ico-am",nm:"Sant Joan de Labritja",sub:"North Ibiza village",badge:null,pills:[{t:"45 mins from villa",c:"info"},{t:"Prettiest north village",c:"free"}],desc:"The prettiest village in the north of the island — a simple church square, a handful of houses, a bar, an atmosphere entirely removed from tourist Ibiza. Lunch here is one of the great simple pleasures of a north day.",sections:[{title:"What to Do",items:[{key:"Lunch at the local bar",val:"Menú del día at around €14. Fresh, simple, very Spanish. The bar has been here for decades."},{key:"The square",val:"Sit in the square, have a coffee, watch the village. Nothing happens quickly."},{key:"Combine with",val:"The Port Sant Miquel coastal walk (40 minutes south), Cala Benirras sunset (20 minutes east)."}]},{title:"Practical Details",items:[{key:"Getting there",val:"45 minutes from the villa through the beautiful interior."},{key:"Best approach",val:"Lunch here on any north day. No reservation needed."}]}],note:null,maps:"https://www.google.com/maps/search/Sant+Joan+de+Labritja+Ibiza"},
{id:"g-kumharas",ico:"ti-sun",col:"ico-am",nm:"Kumharas",sub:"Sant Antoni sunset strip · 15 mins",badge:null,pills:[{t:"£",c:"price"},{t:"From 5pm",c:"time"},{t:"Locals favourite",c:"free"}],desc:"The locals' answer to Cafe del Mar — faces west for the full sunset, drinks at around €5, food from street van vendors. A relaxed bohemian atmosphere that the commercial strips entirely lack. 15 minutes from the villa.",sections:[{title:"What to Expect",items:[{key:"The sunset",val:"Same western orientation as Cafe del Mar and Cafe Mambo. The sunset is identical. The atmosphere is completely different — relaxed, unpretentious, predominantly local."},{key:"Drinks prices",val:"Around €5 — a fraction of Cafe del Mar prices for the same sunset view."},{key:"Food",val:"Street food vans set up in the evenings with varied international food. Eat from the van, drink at the bar, watch the sunset."},{key:"Music",val:"Ambient, chilled electronic music at a volume that allows conversation. Nothing intrusive."}]},{title:"Practical Details",items:[{key:"Hours",val:"Opens from 5pm. The golden hour 7-8:30pm is the sweet spot."},{key:"Getting there",val:"15 minutes from the villa. On the Sant Antoni sunset promenade, past Cafe del Mar."},{key:"The alternative",val:"Cafe del Mar is worth experiencing once for the spectacle. But for a regular sunset spot, Kumharas is the choice."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ0cIx9wRKmRIRUkWCxX0xJro"},
{id:"g-formentera",ico:"ti-ship",col:"ico-pur",nm:"Formentera day trip",sub:"Ferry from Ibiza Town port",badge:null,pills:[{t:"££ ferry",c:"price"},{t:"Full day",c:"time"},{t:"Book ferry ahead",c:"warn"}],desc:"Fast ferry 30 minutes from Ibiza Town port. The water at Formentera is widely regarded as the clearest in the Mediterranean — a genuinely extraordinary turquoise that photographs cannot do justice to. Flat, quiet, almost no commercial development.",sections:[{title:"The Day",items:[{key:"The water",val:"Multiple beaches along the main strip of the island have the characteristic Formentera turquoise. Illetes beach at the northern tip is the most famous but any beach is exceptional."},{key:"Transport",val:"Hire bikes or mopeds at the port to explore the island. It is flat — cycling is easy. The lighthouse at the southern tip is a good destination."},{key:"Lunch",val:"Simple chiringuito beach restaurants serve fresh fish at good prices. The local ensaimada pastries are excellent."}]},{title:"Practical Details",items:[{key:"Ferry",val:"Fast ferry approximately 30 minutes each way. Multiple companies operate. Book in advance especially for September."},{key:"Cost",val:"Ferry return approximately €35-50 per person. Budget ££ for the day including transport and food."},{key:"Ferry port",val:"In Ibiza Town — 20 minutes from the villa. Early morning ferries are worth it to reach Formentera before it gets busy."},{key:"Duration",val:"A full day trip. Take the first ferry and the last one back."}]}],note:null,maps:"https://www.google.com/maps/search/Ibiza+ferry+terminal"}];

// ── Expand/collapse ───────────────────────────────────────────────────────────

function toggleCard(id) {
  const card = document.getElementById(id);
  const body = card.querySelector('.card-body');
  if (card.classList.contains('open')) {
    body.style.height = body.scrollHeight + 'px';
    requestAnimationFrame(() => requestAnimationFrame(() => { body.style.height = '0'; }));
    card.classList.remove('open');
  } else {
    card.classList.add('open');
    body.style.height = body.scrollHeight + 'px';
    body.addEventListener('transitionend', () => { body.style.height = 'auto'; }, {once:true});
  }
}

function expandCard(id) {
  const card = document.getElementById(id);
  if (!card || card.classList.contains('open')) return;
  const body = card.querySelector('.card-body');
  card.classList.add('open');
  body.style.height = body.scrollHeight + 'px';
  body.addEventListener('transitionend', () => { body.style.height = 'auto'; }, {once:true});
}

// ── Deep links ────────────────────────────────────────────────────────────────

function copyWLLink(cat, id) {
  const url = window.location.href.split('#')[0] + '#' + cat + '/' + id;
  const btn = document.getElementById('wl-' + id);
  navigator.clipboard.writeText(url).then(() => {
    if (btn) {
      btn.classList.add('copied');
      btn.innerHTML = '<i class="ti ti-check"></i> Copied — paste into Wanderlog notes';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = '<i class="ti ti-link"></i> Copy link for Wanderlog';
      }, 2500);
    }
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = window.location.href.split('#')[0] + '#' + cat + '/' + id;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}

function readHash() {
  const hash = window.location.hash.slice(1);
  if (!hash || !hash.includes('/')) return;
  const [cat, id] = hash.split('/');
  const TAB_MAP = {clubs:'clubs', eat:'eat', walks:'walks', shops:'shops', sights:'sights'};
  if (!TAB_MAP[cat]) return;

  // Switch to correct tab
  const btn = document.querySelector(`[data-tab="${cat}"]`);
  if (btn) showTab(cat, btn);

  // Expand card and scroll to it
  setTimeout(() => {
    const el = document.getElementById(id);
    if (!el) return;
    expandCard(id);
    setTimeout(() => {
      const offset = el.getBoundingClientRect().top + window.pageYOffset - 52;
      window.scrollTo({top: offset, behavior: 'smooth'});
    }, 360);
  }, 80);
}

window.addEventListener('hashchange', readHash);

// ── Rendering ─────────────────────────────────────────────────────────────────

function bdgHtml(b) {
  if (!b) return '';
  return `<span class="badge ${b.c==='g'?'bdg-g':b.c==='w'?'bdg-w':'bdg-n'}">${b.t}</span>`;
}

function buildBody(r) {
  // Rich format: desc + sections[]
  if (r.desc || r.sections) {
    let out = '';
    if (r.desc) out += `<p class="card-desc">${r.desc}</p>`;
    if (r.sections) {
      r.sections.forEach(sec => {
        const items = sec.items.map(it =>
          `<li><span class="section-key">${it.key}:</span> ${it.val}</li>`
        ).join('');
        out += `<div class="card-section"><div class="section-title">${sec.title}</div><ul class="section-list">${items}</ul></div>`;
      });
    }
    return out;
  }
  // Simple format: note
  return r.note ? `<p class="card-note">${r.note}</p>` : '';
}

function renderCard(r, cat, extraBody='') {
  const wlBtn = `<button id="wl-${r.id}" class="cl cl-wl" onclick="copyWLLink('${cat}','${r.id}')"><i class="ti ti-link"></i> Copy link for Wanderlog</button>`;
  const mapsBtn = r.maps ? `<a class="cl cl-maps" href="${r.maps}" target="_blank"><i class="ti ti-map-pin"></i> Google Maps</a>` : '';
  const atBtn = cat==='walks' ? `<a class="cl cl-at" href="https://www.alltrails.com/explore/spain/balearic-islands/ibiza" target="_blank"><i class="ti ti-route"></i> AllTrails</a>` : '';

  return `<div class="card" id="${r.id}">
    <div class="card-hdr" onclick="toggleCard('${r.id}')">
      <div class="card-ico ${r.col}"><i class="ti ${r.ico}"></i></div>
      <div class="card-meta">
        <div class="card-top">
          <span class="card-name">${r.nm}</span>
          ${bdgHtml(r.badge)}
        </div>
        <div class="card-sub">${r.sub||r.hrs||''}</div>
        ${r.pills?`<div class="pills-row">${r.pills.map(p=>`<span class="pill pill-${p.c}">${p.t}</span>`).join('')}</div>`:''}
      </div>
      <div class="chevron"><i class="ti ti-chevron-down"></i></div>
    </div>
    <div class="card-body" style="height:0;overflow:hidden;transition:height .32s ease">
      <div class="card-divider"></div>
      <div class="card-body-inner">
        ${extraBody}
        ${buildBody(r)}
        <div class="card-links">${mapsBtn}${atBtn}${wlBtn}</div>
      </div>
    </div>
  </div>`;
}

function renderClubs() {
  let h = `<div class="summary">${CLUBS_SUM}</div>`;
  CLUBS.forEach(r => { h += renderCard(r, 'clubs'); });
  document.getElementById('clubs').innerHTML = h;
}

function renderEats() {
  let h = '';
  EATS.forEach(r => { h += renderCard(r, 'eat'); });
  document.getElementById('eat').innerHTML = h;
}

function renderWalks() {
  let h = '';
  WALKS.forEach(r => {
    const dc = r.diff==='Easy'?'chip-e':'chip-m';
    const chips = `<div class="chip-row">
      <span class="chip"><i class="ti ti-arrows-horizontal"></i> ${r.dist}</span>
      <span class="chip ${dc}">${r.diff}</span>
      <span class="chip"><i class="ti ti-clock"></i> ${r.time}</span>
    </div>`;
    h += renderCard(r, 'walks', chips);
  });
  document.getElementById('walks').innerHTML = h;
}

function renderShops() {
  let h = '';
  SHOPS.forEach(r => { h += renderCard(r, 'shops'); });
  document.getElementById('shops').innerHTML = h;
}

let sightFilter = 'all';
function renderSights(f) {
  sightFilter = f || sightFilter;
  const btns = SIGHT_CATS.map(c =>
    `<button class="sf-btn${sightFilter===c?' on':''}" onclick="renderSights('${c}')">${c==='all'?'All':c}</button>`
  ).join('');
  let h = `<div class="sf-row">${btns}</div>`;
  SIGHTS.filter(r => sightFilter==='all' || r.cat===sightFilter).forEach(r => {
    const cc = r.cat.replace(/[\/\s]+/g,'-');
    const catBadge = `<span class="catb cat-${cc}" style="margin-bottom:4px;display:inline-block">${r.cat}</span>`;
    h += renderCard(r, 'sights', catBadge);
  });
  document.getElementById('sights').innerHTML = h;
}

function renderPlan() {
  let h = `<div class="summary" style="margin-bottom:12px">Six suggested day shapes — tap any underlined item to jump to the full entry in the relevant tab. Mix and match freely; these are starting points.</div>`;
  ITINS.forEach(it => {
    const slotsHtml = it.slots.map((sl,i) => {
      const nm = sl.tab
        ? `<span class="slot-name slot-link" onclick="goTo('${sl.tab}','${sl.id}')">${sl.nm}</span>`
        : `<span class="slot-name">${sl.nm}</span>`;
      const border = i < it.slots.length-1 ? '' : 'border:none;padding-bottom:0';
      return `<div class="slot" style="${border}"><div class="slot-time">${sl.time}</div><div>${nm}</div></div>`;
    }).join('');
    const fake = {id:`itn-${it.id}`, ico:'ti-calendar', col:'ico-bl', nm:it.title, sub:it.theme, badge:null, maps:null, note:null};
    const wlBtn = `<button id="wl-itn-${it.id}" class="cl cl-wl" onclick="copyWLLink('plan','itn-${it.id}')"><i class="ti ti-link"></i> Copy link for Wanderlog</button>`;
    h += `<div class="card" id="itn-${it.id}">
      <div class="card-hdr" onclick="toggleCard('itn-${it.id}')">
        <div class="card-ico ico-bl"><i class="ti ti-calendar"></i></div>
        <div class="card-meta">
          <div class="card-name">${it.title}</div>
          <div class="card-sub">${it.theme}</div>
        </div>
        <div class="chevron"><i class="ti ti-chevron-down"></i></div>
      </div>
      <div class="card-body" style="height:0;overflow:hidden;transition:height .32s ease">
        <div class="card-divider"></div>
        <div class="itn-slots">${slotsHtml}</div>
        <div style="padding:0 12px 14px 56px"><div class="card-links">${wlBtn}</div></div>
      </div>
    </div>`;
  });
  document.getElementById('plan').innerHTML = h;
}

// ── Navigation ────────────────────────────────────────────────────────────────

function showTab(id, btn) {
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  btn.classList.add('on');
  window.scrollTo(0, 0);
}

function goTo(tab, id) {
  const btn = document.querySelector(`[data-tab="${tab}"]`);
  if (btn) showTab(tab, btn);
  setTimeout(() => {
    const el = document.getElementById(id);
    if (!el) return;
    expandCard(id);
    setTimeout(() => {
      const offset = el.getBoundingClientRect().top + window.pageYOffset - 52;
      window.scrollTo({top: offset, behavior: 'smooth'});
    }, 360);
  }, 80);
}

// ── Init ──────────────────────────────────────────────────────────────────────

renderClubs();
renderEats();
renderWalks();
renderShops();
renderSights('all');
renderPlan();

// Read deep link on load
setTimeout(readHash, 50);
</script>
</body>
</html>
