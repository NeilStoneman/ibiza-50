<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ibiza 50th — Sep 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sand:#F5EDD8;--bg:#FAFAF7;--surface:#FFFFFF;--border:#E4D8C4;
  --text:#1A2332;--sec:#6B5E50;--muted:#9A8878;
  --accent:#1870A8;--acbg:#EBF5FC;--acbd:#B5D4F4;
  --amber:#854F0B;--ambbg:#FAEEDA;--ambd:#F5C070;
  --green:#3B6D11;--grnbg:#EAF3DE;--grnbd:#C0DD97;
  --blue:#0C447C;--blubg:#E6F1FB;
  --pur:#3C3489;--purbg:#EEEDFE;
}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);padding-bottom:3rem}
/* Hero */
.hero{background:var(--sand);border-bottom:1px solid var(--border);padding:1rem 1rem .75rem}
.hero-eye{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.hero-title{font-family:Georgia,serif;font-size:30px;font-weight:400;line-height:1;margin-bottom:3px}
.hero-sub{font-size:12px;color:var(--sec)}
/* Tabs */
.tab-bar{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{display:inline-flex;align-items:center;gap:4px;padding:10px 13px;font-size:12px;font-weight:500;color:var(--sec);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;transition:color .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn i{font-size:14px}
/* Panes */
.pane{display:none;padding:10px 12px}
.pane.on{display:block}
/* Summary banner */
.summary{background:var(--acbg);border:1px solid var(--acbd);border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:12px;line-height:1.65;color:var(--text)}
/* Sight filter */
.sf-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.sf-btn{font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--sec);cursor:pointer;transition:all .15s}
.sf-btn.on{background:var(--acbg);color:var(--accent);border-color:var(--acbd)}
.sf-group{margin-bottom:8px}
.sf-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);display:block;margin-bottom:5px}
.tab-map{height:280px;border-radius:14px;overflow:hidden;margin-bottom:12px;background:var(--sand);border:1px solid var(--border)}
/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;overflow:hidden;transition:box-shadow .2s}
.card.open{box-shadow:0 2px 12px rgba(0,0,0,.07)}
.card-hdr{display:flex;align-items:flex-start;gap:10px;padding:12px 12px 11px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.card-hdr:hover{background:#FDFAF5}






.card-meta{flex:1;min-width:0}
.card-top{display:flex;align-items:flex-start;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.card-name{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.3}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;flex-shrink:0}
.bdg-g{background:#DCFCE7;color:#166534}
.bdg-w{background:var(--ambbg);color:var(--amber)}
.bdg-n{background:var(--bg);color:var(--sec);border:1px solid var(--border)}
.card-sub{font-size:11.5px;color:var(--muted)}
.catb{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;display:inline-block}
.cat-Beach{background:var(--blubg);color:var(--blue)}
.cat-Natural-sight,.cat-Nature{background:var(--grnbg);color:var(--green)}
.cat-Village{background:var(--bg);color:var(--sec);border:1px solid var(--border)}
.cat-Culture,.cat-Restaurant,.cat-Bar-Sunset{background:var(--ambbg);color:var(--amber)}
.cat-Day-trip{background:var(--purbg);color:var(--pur)}

/* Card body */
.card-body{height:0;overflow:hidden;transition:height .32s ease}
.card-body-inner{padding:0 12px 14px 43px}
.card-divider{height:1px;background:var(--border);margin:0 12px 12px}
.card-note{font-size:12.5px;color:var(--text);line-height:1.65;margin-bottom:12px}
/* Chips */
.chip-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--sec);border:1px solid var(--border)}
.chip i{font-size:12px}
.chip-e{background:var(--grnbg);color:var(--green);border-color:var(--grnbd)}
.chip-m{background:var(--ambbg);color:var(--amber);border-color:var(--ambd)}
/* Links inside card */
.card-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.cl{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;text-decoration:none;padding:5px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.cl-maps{background:var(--acbg);color:var(--accent);border-color:var(--acbd)}
.cl-at{background:var(--grnbg);color:var(--green);border-color:var(--grnbd)}
.cl-wl{background:var(--sand);color:var(--sec);border-color:var(--border);transition:all .2s}
.cl-wl.copied{background:var(--grnbg);color:var(--green);border-color:var(--grnbd)}
/* Itineraries */
.itn-slots{padding:0 12px 14px 43px}
.slot{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #F0E8D8}
.slot:last-child{border:none;padding-bottom:0}
.slot-time{font-size:10px;font-weight:600;color:var(--accent);min-width:72px;flex-shrink:0;padding-top:2px;text-transform:uppercase;letter-spacing:.06em}
.slot-name{font-size:12.5px;font-weight:500;color:var(--text)}
.slot-link{cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.slot-link:hover{color:var(--blue)}

.pills-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.pill-price{background:#FAEEDA;color:#854F0B;border:1px solid #F5C070}
.pill-free{background:#DCFCE7;color:#166534;border:1px solid #A0D4B0}
.pill-info{background:#EBF5FC;color:#1870A8;border:1px solid #B5D4F4}
.pill-warn{background:#FEF3C7;color:#92400E;border:1px solid #FBD87A}
.pill-time{background:#EAF3DE;color:#3B6D11;border:1px solid #C0DD97}
.pill-genre{background:var(--purbg);color:var(--pur);border:1px solid #C8C4F0}


.card-desc{font-size:12.5px;color:var(--text);line-height:1.65;margin-bottom:14px}
.card-section{margin-bottom:14px}
.section-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.section-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.section-list li{font-size:12.5px;color:var(--text);line-height:1.6;padding-left:12px;position:relative}
.section-list li::before{content:"·";position:absolute;left:0;color:var(--accent);font-weight:700}
.section-key{font-weight:600;color:var(--text)}


.ex{display:flex;flex-direction:column;align-items:center;flex-shrink:0;user-select:none;align-self:stretch}
.ex-c{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);transition:all .25s;line-height:1}
.ex-arr{width:11px;height:11px;border-right:2px solid var(--border);border-bottom:2px solid var(--border);transform:rotate(45deg);transition:transform .3s ease;margin-top:auto;margin-bottom:6px;flex-shrink:0}
.card-hdr:hover .ex-c{border-color:var(--accent);color:var(--accent)}


.card.open .ex-c{background:var(--accent);border-color:var(--accent);color:#fff}
.card.open .ex-arr{transform:rotate(-135deg)}

.cl-web{background:#F5F0E8;color:var(--sec);border:1px solid var(--border)}
.cl-web:hover{color:var(--text)}
.cl-tix{background:var(--purbg);color:var(--pur);border:1px solid #C8C4F0}
.section-link{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
</style>
</head>

<div class="hero">
  <div class="hero-eye">50th birthday trip</div>
  <div class="hero-title">Ibiza</div>
  <div class="hero-sub">September 2–9, 2026 &nbsp;·&nbsp; San Rafael villa</div>
</div>

<nav class="tab-bar">
  <button class="tab-btn on" data-tab="clubs" onclick="showTab('clubs',this)"><i class="ti ti-music"></i> Clubs</button>
  <button class="tab-btn" data-tab="eat"   onclick="showTab('eat',this)"><i class="ti ti-tools-kitchen-2"></i> Eat</button>
  <button class="tab-btn" data-tab="walks" onclick="showTab('walks',this)"><i class="ti ti-route"></i> Walks</button>
  <button class="tab-btn" data-tab="shops" onclick="showTab('shops',this)"><i class="ti ti-shopping-bag"></i> Shops</button>
  <button class="tab-btn" data-tab="sights" onclick="showTab('sights',this)"><i class="ti ti-binoculars"></i> Sights</button>

</nav>

<div id="clubs" class="pane on"><div id="clubs-map" class="tab-map"></div><div id="clubs-list"></div></div>
<div id="eat"   class="pane"><div id="eat-map" class="tab-map"></div><div id="eat-list"></div></div>
<div id="walks" class="pane"><div id="walks-map" class="tab-map"></div><div id="walks-list"></div></div>
<div id="shops" class="pane"><div id="shops-map" class="tab-map"></div><div id="shops-list"></div></div>
<div id="sights" class="pane"><div id="sights-map" class="tab-map"></div><div id="sights-list"></div></div>
<div id="plan"  class="pane"></div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────

const CLUBS_SUM = "Fifteen venues. The first nine are the priority list in recommended order — Ushuaia (booked), Akasha, Kasbah, Cafe Mambo, Cafe del Mar, Pikes, Pacha, Cova Santa and Cala Benirras. The remainder are good-to-know alternatives.";

const CLUBS=[
{id:"c-ushuaia",lat:38.8854287,lng:1.4047374,ico:"ti-music",col:"ico-pu",nm:"Ushuaia — Calvin Harris",sub:"Playa den Bossa · Sep 4, doors 5pm–11pm · Already booked",badge:{t:"Booked",c:"g"},pills:[{t:"Entry from €120",c:"price"},{t:"Drinks €20-25",c:"price"},{t:"Sep 4 Fri",c:"time"},{t:"18+",c:"info"}],desc:"The most iconic open-air club in the world — a 4,000-capacity arena on Playa den Bossa beach where daylight parties have redefined what a club night can be. Calvin Harris holds one of Ibizas most prestigious residencies here, playing Fridays through the season. September 4th is your night.",sections:[{title:"The Experience",items:[{key:"Format",val:"Open-air arena built around a pool. Events run from late afternoon through to midnight — you get the full arc from afternoon sun, through the golden-hour sunset, into the evening. Not a 4am experience."},{key:"Calvin Harris",val:"Grammy-winning producer with over 56 billion streams. His Ibiza residency is one of the tightest-run spectacles on the island. Expect guests DJs in support. The production values — sound, lighting, staging — are exceptional for an outdoor space."},{key:"Crowd",val:"Around 4,000 at capacity. International, mixed-age, there for the spectacle. Less of a dancing-in-a-room experience, more of a festival atmosphere."}]},{title:"Practical Details",items:[{key:"Entry",val:"Tickets from €120 online (already purchased). Door prices are significantly higher. No re-entry once you leave."},{key:"Drinks",val:"Budget €20-25 per drink. Beer is the cheaper option. Hydrate well at the villa before going — free tap water is available by law on request."},{key:"Dress code",val:"No flip-flops, shorts, swimwear or sports shirts. They turn people away at the door for this."},{key:"Getting there",val:"Free disco buses for ticket holders run from Playa den Bossa, Ibiza Port and San Antonio. Taxi from San Antonio around €25-35 depending on time. Two taxis needed for the group."},{key:"Transport note",val:"San Antonio to Ushuaia is around 25 minutes by taxi."}]}],website:"https://www.theushuaiaexperience.com",tickets:"https://www.clubtickets.com/clubbing/ushuaia-ibiza/calvin-harris",maps:"https://www.google.com/maps/search/Ushuaia+Ibiza+Beach+Hotel"},
{id:"c-akasha",lat:39.0282328,lng:1.5579156,ico:"ti-music",col:"ico-pu",nm:"Akasha at Las Dalias",sub:"Ctra San Carlos km 12 · Garden from 7pm · Club from 11pm · 25+",badge:null,pills:[{t:"Entry €15–45",c:"price"},{t:"Drinks: beer ~€8",c:"price"},{t:"Garden from 7pm",c:"time"},{t:"25+ recommended",c:"info"}],desc:"An intimate club of 300-400 capacity within the Las Dalias complex, operated since 2020 and now established as one of the islands most credible underground venues. The garden opens from 7pm alongside the Las Dalias market, so the transition from market to club can happen without moving from the site. Ibiza Spotlight is the exclusive online ticket partner — always €5 cheaper online than on the door.",sections:[{title:"The Music and Atmosphere",items:[{key:"Sound",val:"Deep house, organic electronic and melodic sounds. The DJ booth sits in the centre of the dancefloor, not at the front — a Boiler Room-style setup that makes the whole room feel part of the music rather than an audience facing a stage. A genuine listening and dancing experience."},{key:"Residencies 2026",val:"Peace N'Music on Mondays, Namaste on Wednesdays (25+ years running), Tales Of The Unexpected one Friday a month, Supernova on Saturdays, Nest on Sundays. Thursday alternates between Sven Vath and others."},{key:"No phones",val:"Enforced. Creates a completely different atmosphere — people are present."},{key:"Capacity",val:"300 people. Intimate by any standard."}]},{title:"Practical Details",items:[{key:"Entry",val:"Ranges from free (Supernova garden 6pm-11pm) to €45 for headline nights. Most nights €15-30. Buy online via ibiza-spotlight.com — always €5 cheaper than door."},{key:"When to arrive — garden events",val:"For Namaste, Supernova and other garden-to-club nights: arrive 7:30–8:30pm to catch the outdoor sunset set under the bougainvillea. The outdoor sound cuts off around 11pm and the move inside happens naturally. Arriving after 10pm means missing the best of the garden."},
          {key:"When to arrive — club-only nights",val:"For late club-only programming: arrive 11–11:30pm. Doors open around 11pm and early entry guarantees space before the main act takes over around 1am. The small capacity means the room fills quickly."},
          {key:"Drinks",val:"Beer ~€8, long drinks ~€20 at bar. Drink packages available at checkout when buying tickets (3x long drinks €33.60 — 20% off bar price)."},{key:"Age",val:"25+ recommended. Enforced on some nights."},{key:"Dress",val:"No beach attire, no swimwear, no shorts. Smart-casual minimum."},{key:"Getting there",val:"Ctra San Carlos km 12. Taxi from San Antonio €43-48, from Ibiza Town €32-37. On-site car park ~€4. Taxi rank at the main entrance for the return."}]}],website:"https://www.akashaibiza.com",tickets:"https://www.ibiza-spotlight.com/night/venue/akasha",maps:"https://www.google.com/maps/place/?q=place_id:ChIJwSN3CAEVmRIRV_ZTtz28e70"},
{id:"c-kasbah",lat:38.9843357,lng:1.2959822,ico:"ti-music",col:"ico-pu",nm:"Kasbah Ibiza Sunset",sub:"Calo des Moro, Sant Antoni sunset strip · 11am–11pm daily",badge:null,pills:[{t:"Free entry",c:"free"},{t:"30% off cocktails pre-sunset",c:"free"},{t:"Live music",c:"genre"},{t:"Restaurant prices",c:"price"}],desc:"Spanish tapas and cocktails with live music at Calo des Moro on the Sant Antoni sunset strip. No entry charge, no minimum spend for tables. 30 percent off cocktails before sunset. Live music on Tuesdays, Thursdays and Saturdays from 7:30pm. Voted Tripadvisors Excellence Award.",sections:[{title:"What to Expect",items:[{key:"Food",val:"Mediterranean tapas and classic selections. Reviewers consistently describe excellent quality and good value compared to the surrounding strip. Roast chicken and tapas especially recommended."},{key:"Drinks",val:"Cocktail programme is strong — the strawberry daiquiri is specifically praised. 30% discount on cocktails before sunset time."},{key:"Sunset position",val:"Faces directly west for the full sunset over the sea. Arrive by 7:30pm to secure a position. The best tables are reserved so arrive early or book."},{key:"Live music",val:"Tuesdays, Thursdays and Saturdays from 7:30pm."}]},{title:"Practical Details",items:[{key:"Entry",val:"No charge. No minimum spend."},{key:"Getting there",val:"On the sunset strip in Sant Antoni. 15 minutes from the villa. Bus Line 1 from Sant Antoni bus station, two stops to Calo des Moro."},{key:"Bottomless brunch",val:"Available 11am-2pm daily for €30/head (1 hour unlimited selected drinks + one dish)."},{key:"Website",val:"kasbahibiza.com"}]}],website:"https://www.kasbahibiza.com",tickets:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJj2OpvQM2mRIRYlXQwcvleEM"},
{id:"c-cafemambo",lat:38.9808666,lng:1.2962745,ico:"ti-music",col:"ico-pu",nm:"Cafe Mambo",sub:"Sant Antoni sunset strip · 10am–3am · Sunset sessions from 7pm",badge:null,pills:[{t:"Min spend €80-150pp",c:"warn"},{t:"Book ahead",c:"warn"},{t:"Cocktails €15-20",c:"price"},{t:"Pre-party DJs",c:"genre"}],desc:"Founded in 1994 on a small dilapidated finca on the coastal rocks of San Antonio, Cafe Mambo has grown into one of the most iconic sunset venues in the world. Every evening the island's biggest DJs drop in to play a warm-up set before their headline shows at the superclubs — Solomun, Armin van Buuren, Bob Sinclar, Camelphat and many others have played here. Not a nightclub — a bar, restaurant and sunset experience that defines what the Ibiza evening feels like before the night begins.",sections:[{title:"The Experience",items:[{key:"Sunset sessions",val:"Daily from 7pm throughout the season. The energy builds as the sun drops, DJs take over from the resident playlist, and by 9:30pm the pre-party atmosphere is in full swing."},{key:"The DJs",val:"Superclub DJs stop in to play a set before heading to their own nights — this means you can catch a world-class set in a relaxed outdoor setting rather than inside a 10,000-person arena. The set list is more accessible here than at the clubs."},{key:"Setting",val:"Three tiers of seating: seafront (closest to the water and the most sought-after), main terrace, and cocktail bar area. The DJ booth overlooks the walkway. The whole promenade gets involved."},{key:"Food",val:"Full restaurant menu throughout the day and into the evening. Breakfast, lunch and dinner. Gourmet burgers, seafood, Mexican-influenced dishes, sharing plates. The food is seriously considered."}]},{title:"Minimum Spend — Read This First",items:[{key:"Table reservations 6pm–10pm",val:"Seafront table: €150 per person. Terrace table: €100 per person. Cocktail bar area: €80 per person. DJ booth area: €200 per person. For a group of 5, the cocktail bar area minimum is €400 total."},{key:"Table reservations after 10pm",val:"€80 per person everywhere. For a group of 5, €400 total minimum."},{key:"Walk-ins",val:"Free to enter without a reservation when space allows — but no guaranteed seating at sunset hours. Standing at the bar with no minimum is possible."},{key:"What this means in practice",val:"At €15-20 per cocktail, hitting the €80 minimum means around 4-5 drinks per person over the evening. Achievable over 2-3 hours but budget accordingly."},{key:"Book ahead",val:"Sunset tables sell out days in advance in September. Book at cafemamboibiza.com."}]},{title:"Practical Details",items:[{key:"Hours",val:"10am to 3am daily. Sunset session from 7pm."},{key:"Location",val:"Sunset strip, Sant Antoni — 15 minutes from the villa."},{key:"Drinks",val:"Cocktails and spirit + mixer €15-20. Craft beers and fine wines available."},{key:"Dress code",val:"Casual during the day. Smart-casual for the evening — no swimwear or beach attire after 6pm."}]},{title:"How to visit without the big spend",items:[{key:"Arrive before 6pm",val:"The minimum spend only applies after 6pm. Arrive at 5pm-5:30pm in September — sunset is at 8pm-8:20pm so you get a full 2+ hours at any table you like with no minimum obligation. Order what you want, no pressure. Leave or stay as the 6pm threshold approaches."},{key:"The bar — no minimum, no table",val:"Walk straight to the bar, buy a drink (€15-20), stand or find space. No minimum spend required if you are not sitting at a reserved table. You can see and hear everything from the bar area."},{key:"The promenade is free",val:"The entire Sunset Strip is a public walkway. Both Mambo and Cafe del Mar's music carries clearly across the promenade. Sit on the wall, the benches or the rocks just outside — free. Many people grab a beer from the Spar or a kiosk at the end of the strip and enjoy the full sunset and DJ set from the promenade. You lose nothing of the atmosphere."},{key:"Quieter days",val:"Monday to Thursday is noticeably less crowded than Friday-Sunday. September is considerably quieter than July and August — tables are easier to walk into, the promenade is more relaxed, and the vibe is better for it."},{key:"The sweet spot timing",val:"Arrive 5pm-5:30pm. The DJ builds from 7pm. The crowd fills the promenade from 7:30pm. Arriving early gives you the full arc — relaxed build, sunset, DJ peak — without the chaos of peak hour. Stay as long as it feels right."}]}],website:"https://www.cafemamboibiza.com",tickets:null,maps:"https://www.google.com/maps/search/Cafe+Mambo+Ibiza+Sant+Antoni"},
{id:"c-cafedelmar",lat:38.9804098,lng:1.296303,ico:"ti-music",col:"ico-pu",nm:"Cafe del Mar",sub:"Sant Antoni sunset strip · The original since 1980",badge:null,pills:[{t:"Table min spend",c:"warn"},{t:"Book ahead",c:"warn"},{t:"Ambient/chillout",c:"genre"},{t:"The original",c:"free"}],desc:"The original sunset bar of Ibiza, open since 1980 and the venue that pioneered the chillout music genre — DJ Jose Padilla's sunset sessions here in the late 1980s and 90s influenced an entire generation of ambient and electronic music, and the annual Cafe del Mar chillout compilation albums (released since 1994) became a global phenomenon. The place that started it all. Less energetic and DJ-focused than Cafe Mambo next door, more atmospheric and historically significant.",sections:[{title:"The Experience",items:[{key:"What it is",val:"A bar and restaurant directly by the sea, built around the ritual of watching the sunset. More ambient, chilled and contemplative than the louder energy of Cafe Mambo. The music is carefully curated and lower-key."},{key:"History",val:"Jose Padilla's sunset sets here defined what Ibiza could sound like when the beats slowed down. The original chillout compilations from 1994 onwards were recorded here and sold millions worldwide. This is a place of genuine musical history."},{key:"Food",val:"Mediterranean dishes, seafood, tapas, salads and cocktails. Considered food rather than afterthought. Lunch and dinner available."},{key:"Setting",val:"Directly by the sea, the closest tables to the water anywhere on the strip. Terrace overlooking the promenade also available."}]},{title:"Practical Details",items:[{key:"Entry",val:"No entry fee. Minimum spend applies for table reservations — the amount is shown during the booking process and varies by table location."},{key:"Booking",val:"Reservations strongly recommended for sunset. Book directly at cafedelmar.com. Cancellations must be made 48+ hours before — no-shows are charged. Arriving 20+ minutes late = automatic cancellation."},{key:"No time limit",val:"Once you arrive, the table is yours for the duration of your stay."},{key:"Dress code",val:"No formal code. No shirtless, shoeless or swimwear inside the venue."},{key:"vs Cafe Mambo",val:"Cafe del Mar: more ambient, more historical, slightly easier on the wallet. Cafe Mambo: louder, more pre-party energy, bigger DJ names. Visit both on the same evening if you want to compare."}]},{title:"How to visit without paying for a table",items:[{key:"Walk in and use the bar",val:"Cafe del Mar does not require a table or a minimum spend to enter. Walk in, go to the bar, buy a drink and stand or sit wherever you find space. The bar area and the terrace edges are free if you are not at a reserved table."},{key:"The promenade — completely free",val:"Cafe del Mar is right on the public promenade. The music carries directly across the strip. Sit on the low wall or the rocks directly in front of the venue — many people do exactly this. The sunset view from the promenade is essentially the same as from a paid table."},{key:"No minimum on walk-in bar service",val:"The minimum spend only applies to table reservations. If you are not sitting at a reserved table, you simply pay for what you order. A single cocktail (€10-15 at del Mar, slightly less than Mambo) gets you the full experience with no other commitment."},{key:"Best times",val:"Arrive around 5:30pm for the quietest, most atmospheric experience. By 7:30pm the strip is busy but manageable in September. Del Mar is noticeably calmer and more contemplative than Mambo — less pre-party energy, more chilled."},{key:"The honest comparison",val:"Between the two: Cafe del Mar is the more relaxed, historically significant experience. Cafe Mambo is louder, more energetic, with bigger DJ names. Do both on the same evening — walk the 200 metres between them, buy a drink at each bar, compare the atmospheres. The whole strip is walkable in 10 minutes."}]}],website:"https://cafedelmar.com/ibiza/",tickets:null,maps:"https://www.google.com/maps/search/Cafe+del+Mar+Ibiza+Sant+Antoni"},
{id:"c-pikes",lat:38.9912849,lng:1.320158,ico:"ti-music",col:"ico-pu",nm:"Pikes Hotel",sub:"Cami de Sa Vorera s/n, San Antonio · 27+ only · From 8pm",badge:null,pills:[{t:"Free entry (guestlist)",c:"free"},{t:"27+ only",c:"warn"},{t:"Drinks ££",c:"price"},{t:"Register online first",c:"warn"}],desc:"A 500-year-old Ibicencan finca that has been running legendary parties since the late 1970s. Freddie Mercury celebrated his 41st birthday here. Wham filmed Club Tropicana at the pool. Under current ownership of the Ibiza Rocks Group, it continues to honour that legacy. Entry is free — but only if you register for the guestlist on their website first. You cannot simply turn up.",sections:[{title:"The Experience",items:[{key:"Atmosphere",val:"Intimate, eccentric and layered — small interconnected rooms, bars in unexpected places, a garden, the famous pool. The 27+ age policy and no-phones-on-the-dancefloor rule are strictly enforced and create an entirely different energy from the superclubs. Capacity is 800."},{key:"Music",val:"Saturday nights: Pikes House Party with the Pikes House Band — live vocals, trumpet, saxophone, keys and a DJ. The music policy varies throughout the week (house, disco, funk, Balearic) — check the specific night."},{key:"The history",val:"Founded in 1978 by Tony Pike. Freddie Mercury, Grace Jones, Julio Iglesias and virtually every major artist of the 1980s-90s came here. The Freddie Mercury Suite is still bookable as a hotel room."}]},{title:"Practical Details",items:[{key:"Entry",val:"Free — but ONLY if you register for the guestlist on pikesibiza.com before you arrive. This is mandatory. You cannot pay at the door."},{key:"Guestlist",val:"Apply directly at pikesibiza.com well in advance. The list fills up and can close before the night."},{key:"Drinks",val:"Beer €8-10, spirit + mixer €16-19, cocktail ~€16, water ~€8. More moderate than the superclubs."},{key:"Getting there",val:"5-10 minutes from San Antonio by taxi (~€10). Around 10-15 minutes from the villa. €35 from Ibiza Town."},{key:"Dress",val:"Stylish, eccentric, expressive — glitter and feathers welcome. No sportswear or beachwear. Smart casual as a minimum."}]}],website:"https://www.pikesibiza.com",tickets:null,maps:"https://www.google.com/maps/search/Pikes+Hotel+Ibiza"},
{id:"c-pacha",lat:38.9182986,lng:1.4432497,ico:"ti-music",col:"ico-pu",nm:"Pacha Ibiza",sub:"Ibiza Town marina · Midnight–6am · Since 1973",badge:null,pills:[{t:"Entry €30–65",c:"price"},{t:"Drinks: beer €15",c:"price"},{t:"Midnight start",c:"time"},{t:"Smart dress",c:"info"}],desc:"The original and most iconic nightclub in Ibiza — open since 1973, the double cherry logo now recognised worldwide, and still the spiritual home of Ibiza nightlife after more than 50 years. Capacity 3,000 across two rooms. Located in Ibiza Town near the marina, 30 minutes from the villa. During your trip (Sep 2-9) there are four distinct nights on offer, each with a very different character.",sections:[{title:"Your September Nights",items:[{key:"Thu Sep 3 — Purple Disco Machine",val:"Purple Disco Machine takes the Thursday residency for his debut season at Pacha 2026. Funk-influenced disco house — accessible, melodic and extremely danceable. A good opening to the trip."},{key:"Fri Sep 4 — Music On (Marco Carola)",val:"Clashes with Ushuaia. Not available."},{key:"Sat Sep 5 — Flower Power (Roger Sanchez)",val:"The most iconic night in Ibiza — running since 1981 and personally created by Pacha founder Ricardo Urgell. 60s, 70s and 80s music, costumed performers, coloured lights, total liberation. Not a serious techno night — a joyful one. Roger Sanchez takes over as host for 2026, bringing more house and disco into the mix. Consistently described as one of the most fun nights on the island regardless of age. This is the strongest recommendation for the group."},{key:"Sun Sep 6 — Solomun +1",val:"The most prestigious Sunday residency in Ibiza and one of the most sought-after tickets of the entire season. Solomun plays a four-to-five hour set, bringing a guest DJ (+1) each week. Deep, melodic, emotional. Conflicts with the Cala Benirras drum circles — a genuine choice between two unmissable Sunday-sunset experiences."},{key:"Mon Sep 7 — Sonny Fodera",val:"Vocal-led house music — accessible, feel-good, emotional. Crowd-defining anthems (Somedays, Think About Us, Unconditional) with guest DJs including Fatboy Slim, Jayda G, Eats Everything and Roger Sanchez. Described by Ibiza Spotlight as a pretention-free party with recognisable hooks and singalong choruses. An excellent option for a Monday night."}]},{title:"The Venue",items:[{key:"History",val:"Ricardo and Piti Urgell opened the Ibiza club in 1973 after founding Pacha in Sitges in 1967. It has operated continuously ever since, surviving every change in the island and in music. The double cherry logo was created in the 1970s."},{key:"Rooms",val:"The Main Room for the headline act, and the Funky Room (smaller, warmer, a different energy). Both run simultaneously on most nights."},{key:"Dress code",val:"Smart casual to glamorous. No swimwear, no flip-flops, no football shirts. More style-conscious than most other clubs — people make an effort here. Rewards looking good."},{key:"Capacity",val:"3,000. Significantly smaller than Ushuaia. You are in a room with the music, not in an arena."}]},{title:"Practical Details",items:[{key:"Entry",val:"€30-65 depending on the night and DJ. Flower Power and Sonny Fodera are towards the lower end; Solomun is higher. Always cheaper online than at the door."},{key:"Drinks",val:"Beer €15, water €10, spirit + mixer €20. Pre-sale drink bundles available at checkout when buying tickets — offer significant savings against bar prices."},{key:"Getting there",val:"Av. 8 d'Agost, Ibiza Town marina. 30 minutes from the villa by taxi. Free disco buses run from San Antonio and other areas — check the route at pacha.com. Disco buses operate until Sep 30, so you are within the window."},{key:"Taxis",val:"From San Antonio area: approximately €25-30. From Playa den Bossa: €15. Two taxis needed for your group. Pre-book via WhatsApp."},{key:"Tables",val:"VIP tables from €350 per person minimum spend. Significantly more on Solomun nights. Not necessary for a good experience."}]}],website:"https://www.pacha.com",tickets:"https://ticketsibiza.com/clubs/pacha/",maps:"https://www.google.com/maps/place/?q=Pacha+Ibiza+Av+8+d+Agost"},
{id:"c-covasanta",lat:38.89433500000001,lng:1.331512,ico:"ti-music",col:"ico-pu",nm:"Cova Santa",sub:"Carretera San Jose km 7 · Doors 7pm · Sep 4, 6 or 8",badge:null,pills:[{t:"Entry ~€32",c:"price"},{t:"Drinks: beer €12",c:"price"},{t:"Doors 7pm",c:"time"},{t:"Cave garden",c:"info"}],desc:"Built around an ancient cave discovered in the 15th century, Cova Santa sits in the Ibiza countryside near Sant Josep. Unlike the superclubs it opens at 7pm — you arrive in daylight, eat and drink in the outdoor garden terrace, and the music gradually builds as the night deepens. One of the few venues that works for your early-to-midnight style without compromise.",sections:[{title:"Your September Nights",items:[{key:"Sep 4 (Fri) — Ushuaia night — not available",val:"Cova Santa has Kölsch and Viken Arman from 18:00 this night but you are at Ushuaia. Do not plan anything else on September 4th."},{key:"Sep 6 (Sun) 19:00–05:00",val:"Pantheon — the theatrical Sunday event with live performances and costumes alongside the music. Artists include LF System, Butch, and others. Spiritual and immersive."},{key:"Sep 8 (Tue) — check",val:"PIV has run Tuesdays through the season. Verify on the Cova Santa calendar whether this date falls within their 2026 schedule."}]},{title:"Practical Details",items:[{key:"Entry",val:"Around €32 for most events — significantly cheaper than the superclubs. Some events offer free entry for early arrivals; watch their social channels for announcements."},{key:"Drinks",val:"Beer €12, water €10, spirits €20. Budget around ££ per person for the evening."},{key:"Getting there",val:"Carretera de San José km 7, just before the Sa Caleta turning. Taxi from Ibiza Town €18-22, from Playa den Bossa €15-17, from San Antonio area €22-27."},{key:"The venue",val:"Capacity 2,000. No dress code for the club. You do not need to eat at the restaurant to attend the party."}]}],website:"https://www.covasanta.com",tickets:"https://www.ibiza-spotlight.com/night/venue/cova-santa",maps:"https://www.google.com/maps/search/Cova+Santa+Ibiza"},
{id:"c-benirras",lat:39.0892175,lng:1.4537313,ico:"ti-music",col:"ico-pu",nm:"Cala Benirras — drum circles and market",sub:"North Ibiza · At sunset · Free",badge:null,pills:[{t:"Free",c:"free"},{t:"Sunset timing",c:"time"},{t:"Sun: bus from Sant Joan",c:"warn"}],desc:"One of the defining Ibiza experiences — entirely separate from the club scene. A curved north coast bay with the distinctive rocky islet rising from the sea at its western end. Every Sunday at sunset, drummers gather on the beach and rocks to salute the sun. Every Friday and Tuesday evening, a hippie market takes over the bay.",sections:[{title:"Drum Circles vs Hippie Market",items:[{key:"Sunday drum circles",val:"Organic, building, genuinely moving. Drummers of all ages and abilities gather on the beach and rocks as the sun drops behind God's Finger rock. Builds to a crescendo at the moment of sunset."},{key:"Friday and Tuesday hippie market",val:"Artisan stalls, food and atmosphere around the bay at sunset. More relaxed than the drum circles but still atmospheric."}]},{title:"Practical Details",items:[{key:"Sunday transport",val:"Traffic is severe on Sundays. Park at Sant Joan car park and take the shuttle bus. Do not try to drive — it is effectively impossible."},{key:"Fri and Tue",val:"Drive and park at the beach. Straightforward."},{key:"Timing",val:"September sunset is around 8pm-8:20pm. Arrive 45 minutes before sunset for a good position."},{key:"Cost",val:"Completely free. No charges of any kind."}]}],website:null,tickets:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJMarVGW48mRIRzA5PaaR-b48"},
{id:"c-wom",lat:38.9785745,lng:1.530651,ico:"ti-music",col:"ico-pu",nm:"Word of Mouth (WOM)",sub:"Santa Eulalia marina · 1pm–11pm · Closed Wed",badge:null,pills:[{t:"Free entry",c:"free"},{t:"Bar/restaurant prices",c:"price"},{t:"Live music",c:"genre"},{t:"Closes 11pm",c:"time"}],desc:"A genuinely hidden gem on the Santa Eulalia beachfront — live bands every evening followed by chilled DJ sets, with food that reviewers consistently describe as exceptional. No entry charge. 4.7 stars. Nothing to do with the superclub scene — this is a relaxed, warm bar and music venue on the marina.",sections:[{title:"The Experience",items:[{key:"Format",val:"Bar and music venue. Live bands play in the early evening, a DJ continues as the night winds down. Volume stays at conversation level for most of the evening."},{key:"Food",val:"Multiple reviewers call it the best burger on the island. The food is a genuine highlight, not an afterthought. Budget ££ per head for food and drinks."},{key:"Crowd",val:"Mix of locals, long-stay visitors and people who know the island well. Not the tourist-heavy scene of Sant Antoni."}]},{title:"Practical Details",items:[{key:"Hours",val:"1pm to 11pm. Closed Wednesdays."},{key:"Location",val:"Santa Eulalia marina beachfront. 30 minutes from the villa."},{key:"Combine with",val:"Restaurant Royalty for lunch on the main square, Ca na Ribes for dinner — WOM makes a natural closing act for the Santa Eulalia day."},{key:"Entry",val:"No charge. Drinks and food at bar/restaurant prices."}]}],website:null,tickets:null,maps:"https://www.google.com/maps/search/Word+of+Mouth+WOM+Santa+Eulalia+Ibiza"}
];

const EATS=[{id:"e-canpilot",lat:38.9623667,lng:1.3980149,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Can Pilot",sub:"Sant Rafel de sa Creu · Closed Wed",badge:{t:"Book ahead",c:"w"},pills:[{t:"££",c:"price"},{t:"Book ahead",c:"warn"},{t:"5 mins from villa",c:"time"}],desc:"Asador Can Pilot is a legendary, no-frills steakhouse in the village of Sant Rafel de sa Creu — 5 minutes from the villa. Established in 1989, it is widely considered an island institution, hugely popular with locals, music industry insiders, and in-the-know visitors alike. Valentino Rossi has a home nearby and it is his favourite restaurant.",sections:[{title:"Highlights and Offerings",items:[{key:"Signature tabletop charcoal grills",val:"The centrepiece. The chuleton (T-bone steak, typically for two or more) arrives at the table partially seared alongside a mini tabletop barbecue, allowing you to finish cooking every bite exactly as you like it."},{key:"Menu highlights",val:"Excellent cuts of beef (solomillo, entrecote), pluma or secreto Iberico (pork), lamb chops, and rustic Spanish sausages including butifarra and morcilla. Classic tapas and sides include pimientos de Padron, garlic fried potatoes, and frita de polp (fried octopus)."},{key:"Local desserts",val:"Traditional Ibicencan sweets — flao (mint-infused cheesecake) and greixonera (cinnamon ensaimada pudding)."},{key:"Vibe",val:"Rustic, bustling, and completely unpretentious. Traditional Ibicencan wooden furniture and a large open-fire grill. Gets very lively, warm and smoky indoors at peak hours — request the outdoor terrace when booking."}]},{title:"Practical Details",items:[{key:"Location",val:"Carretera Eivissa to Sant Antoni, Sant Rafel — directly on the main road between Ibiza Town and Sant Antoni. 5 minutes from the villa."},{key:"Value",val:"Generous portions and very reasonably priced compared to resort dining elsewhere on the island."},{key:"Reservations",val:"Essential. It fills up every night. Book in advance before leaving the UK. Request the outdoor terrace to avoid the indoor smoke and heat."},{key:"Closed",val:"Wednesdays only."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJO3P6l-JHmRIRoJHUKzcO0HA",website:"http://asadorcanpilot.com/"},
{id:"e-lapaloma",lat:39.0305578,lng:1.4757407,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"La Paloma",sub:"Sant Llorenç · Lunch 12:30–4:30pm · Dinner 8pm–midnight",badge:{t:"Book ahead",c:"w"},pills:[{t:"£££",c:"price"},{t:"Book ahead",c:"warn"},{t:"Garden dining",c:"info"}],desc:"One of the most universally loved restaurants on the island, and genuinely unlike anywhere else. You eat in a citrus grove — orange trees, lavender, twinkling lights strung through the branches — that feels entirely separate from commercial Ibiza. Two different menus by two different sets of owners, morning and evening.",sections:[{title:"The Menus",items:[{key:"Lunch — Middle Eastern",val:"Falafel, hummus, shakshuka, stuffed vine leaves, tabbouleh, beautiful mezze. Organic, fresh, colourful. Best enjoyed slowly over several hours in the shade of the grove."},{key:"Dinner — Italian-inspired",val:"A completely different kitchen team takes over for the evening. Homemade pasta, Italian classics with a Mediterranean influence, local ingredients."},{key:"Drinks",val:"Good wine list. Fresh juices and herb-infused drinks at lunch."}]},{title:"Practical Details",items:[{key:"Reservations",val:"Essential for both lunch and dinner. Book well in advance."},{key:"Location",val:"In Sant Lloren de Balafi, on the road north toward Sant Joan. The drive through the interior to reach it is beautiful."},{key:"Timing",val:"Lunch 12:30–4:30pm. Dinner 8pm to midnight. A long lunch here is one of the great Ibiza experiences — arrive at 12:30 and stay until 3pm."},{key:"Getting there",val:"40 minutes from the villa. Makes a natural stop on any north day."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJk0LzRvI9mRIRkbGRAJicva0",website:"https://palomaibiza.com/"},
{id:"e-kumharas",lat:38.97198849999999,lng:1.2827245,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Kumharas",sub:"Sant Antoni sunset strip · From 5pm",badge:null,pills:[{t:"£",c:"price"},{t:"No min spend",c:"free"},{t:"Sunset spot",c:"info"}],desc:"Rustic, bohemian sunset bar on the Sant Antoni promenade, built around an old defence tower — the locals' answer to Café del Mar. Daybeds, driftwood furniture, street-food vans and live ambient music as the sun goes down, without Café Mambo or Café del Mar's velvet-rope pricing. No reservations and no minimum spend, so it works equally well for a cheap sunset drink or a full evening.",sections:[{title:"What to Expect",items:[{key:"The setting",val:"A tower bar with wooden daybeds and coastal perches, facing west for the same sunset as Café del Mar and Café Mambo — with a relaxed, unpretentious, predominantly local atmosphere instead."},{key:"Music",val:"Ambient, chilled electronic music at a volume that allows conversation, sometimes live flamenco or ethnic bands, plus fire dancers and other performers around sunset."},{key:"Food and drink",val:"Street food vans set up in the evenings with varied international food — sushi, poke bowls, burgers, curries, veggie skewers and a large vegan and vegetarian selection. Drinks are around €5, a fraction of Café del Mar prices for the same view."}]},{title:"Practical Details",items:[{key:"No minimum spend",val:"Unlike Café Mambo or Café del Mar, there is no minimum spend to sit and watch the sunset — just order a drink."},{key:"No bookings",val:"First come, first served. Arrive well before sunset for a good spot, especially on the daybeds."},{key:"Hours",val:"Opens from 5pm. The golden hour 7-8:30pm is the sweet spot."},{key:"Getting there",val:"15 minutes from the villa, on the Sant Antoni sunset promenade, past Café del Mar."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ0cIx9wRKmRIRUkWCxX0xJro",website:"https://kumharas.org/en/inicio-english/"},
{id:"e-ritas",lat:38.9786968,lng:1.2992405,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Rita's Cantina",sub:"Sant Antoni harbour · Daily 8am–midnight",badge:null,pills:[{t:"£",c:"price"},{t:"No reservations",c:"warn"},{t:"Harbour terrace",c:"info"}],desc:"Buzzing all-day bar-restaurant right on the Sant Antoni harbourfront, known island-wide for its Indonesian menu with Dutch touches — a legacy of the town's long-running Dutch and German holiday crowd. No reservations and no pretension: turn up, grab a harbourside table and watch the boats come in. 4.5 stars from over 6,000 reviews.",sections:[{title:"What to Order",items:[{key:"Nasi goreng",val:"The signature dish — Indonesian fried rice, done properly. Order it with a fried egg on top."},{key:"Bami goreng",val:"The other headline dish — Indonesian fried noodles. Reviewers rate it as highly as the nasi goreng."},{key:"Chicken tikka wrap",val:"A popular, lighter option if you want something more casual."},{key:"Dutch apple pie",val:"For dessert — a nod to the Dutch side of the menu, alongside brownie with ice cream."}]},{title:"Practical Details",items:[{key:"Hours",val:"Daily 8am to midnight — kitchen runs from breakfast through to late dinner, useful any time of day."},{key:"No reservations",val:"Walk-in only. Turn up and grab a table on the harbour terrace."},{key:"Location",val:"Carrer de Madrid, 1, right on the Sant Antoni harbourfront — an easy stop before or after a sunset drink at Café del Mar or Kumharas."},{key:"Value",val:"Affordable and consistently well reviewed — 4.5 stars from over 6,000 reviews, unusual for a harbourfront location."}]}],note:null,maps:"https://www.google.com/maps?cid=11899950130727359430",website:"https://ritasibiza.com/"},
{id:"e-barcosta",lat:38.9981593,lng:1.4280499,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Bar Costa",sub:"Santa Gertrudis · Closed Tue",badge:{t:"Very cheap",c:"g"},pills:[{t:"£",c:"price"},{t:"Ibiza institution",c:"info"},{t:"Village square",c:"info"}],desc:"Ibiza institution in the Santa Gertrudis village square — hanging hams from the ceiling, famous bocadillos (stuffed rolls), cold beer. Extremely cheap. The kind of place that has barely changed in 40 years because it does not need to.",sections:[{title:"What to Order",items:[{key:"Bocadillos",val:"The house speciality — filled rolls with jambon serrano, cheese, tortilla or various combinations. The bread is good. Very cheap."},{key:"Cold beer",val:"A Estrella Damm or Moritz on the terrace in the late afternoon is the point."},{key:"When to go",val:"Early evening rather than dinner. Come for drinks and bocadillos before walking 200 metres to Can Mimosa for a proper dinner."}]},{title:"Practical Details",items:[{key:"Closed",val:"Tuesdays."},{key:"Price",val:"£ — genuinely cheap. One of the cheapest options on the island."},{key:"The combination",val:"Bar Costa at 6:30pm, Can Mimosa at 7:30pm — one of the best low-cost evenings in the guide."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJY0bju7U4mRIRuC4_VVSdhX8",website:"https://www.facebook.com/profile.php?id=100063559357932"},
{id:"e-canmimosa",lat:38.9992332,lng:1.4295159,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Can Mimosa",sub:"Santa Gertrudis · 7–11pm · Closed Mon",badge:null,pills:[{t:"££",c:"price"},{t:"Garden dining",c:"info"},{t:"7–11pm",c:"time"}],desc:"A 200-year-old farmhouse with an enclosed garden that grows much of what appears on the plate. The chalkboard menu changes daily with what is available. One of the most consistently well-reviewed restaurants on the island — 4.7 stars across hundreds of visits over many years.",sections:[{title:"What to Expect",items:[{key:"Setting",val:"An enclosed walled garden with the farmhouse on one side. Candlelit in the evening. The kind of setting that makes food taste better."},{key:"Menu",val:"Mediterranean cooking with local seasonal ingredients. The menu is written on a blackboard and changes daily based on what is growing and available. Expect good salads, fish, meat and pasta — always well-executed."},{key:"Service",val:"Family-run and warm. Unhurried. The kind of place where a meal takes two hours without anyone feeling rushed."}]},{title:"Practical Details",items:[{key:"Hours",val:"7pm to 11pm. Closed Mondays."},{key:"Location",val:"Santa Gertrudis village — combine with a drink at Bar Costa (200 metres away) beforehand."},{key:"Reservations",val:"Recommended in September — book a few days in advance."},{key:"Getting there",val:"15 minutes from the villa."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJQW-c6PY5mRIRCAvpg3UahX4",website:"https://canmimosaibiza.com/"},
{id:"e-alayoun",lat:38.9836584,lng:1.2946338,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Al Ayoun Sunset Ibiza",sub:"Sant Antoni sunset strip · Daily noon–1am",badge:null,pills:[{t:"££",c:"price"},{t:"No min spend",c:"free"},{t:"Sunset strip",c:"info"}],desc:"Arabic and Mediterranean fusion restaurant right on the Sant Antoni sunset strip, three minutes' walk from Café Mambo and Café del Mar — with uninterrupted sunset views from every table and no minimum spend. A cheaper, quieter alternative to its famous neighbours without giving up the view.",sections:[{title:"What to Order",items:[{key:"Slow-cooked lamb shoulder",val:"The signature dish — Arabic-spiced, falls off the bone."},{key:"Paella and fresh pasta",val:"Solid Mediterranean mains alongside the Arabic dishes, plus grilled fish."},{key:"Tapas selection",val:"Reviewers rate the tapas as some of the best on the strip — a good way to share and linger through sunset."},{key:"Cocktails",val:"Handcrafted list — Porn Star Martini, strawberry daiquiri, Aperol Spritz — plus a proper wine list."}]},{title:"Practical Details",items:[{key:"No minimum spend",val:"Unlike some of its sunset-strip neighbours, there is no minimum spend — order what you like and stay for the view."},{key:"Set menus",val:"Sol menu (€65) and Luna menu (€80) available if you want a fixed-price sunset dinner."},{key:"Hours",val:"Daily, midday to 1am — works for lunch, sunset drinks or a full dinner."},{key:"Location",val:"On the Sant Antoni sunset strip, about 3 minutes' walk from Café Mambo and Café del Mar."},{key:"Reservations",val:"Book via the website or WhatsApp, especially for a table at peak sunset time."}]}],note:null,maps:"https://www.google.com/maps?cid=9381458561027280682",website:"https://www.alayounsunsetibiza.com/"},
{id:"e-aubergine",lat:39.0408154,lng:1.4334641,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Aubergine by Atzaro",sub:"Near Sant Miquel · Daily noon–midnight",badge:null,pills:[{t:"££",c:"price"},{t:"Farm to table",c:"info"},{t:"On north day route",c:"time"}],desc:"Farm-to-table restaurant set in a gorgeous garden on the road toward Sant Miquel — which means you pass directly by it on the way to the Port Sant Miquel coastal walk. Everything grown on the premises. Consistently described as one of the best meals in Ibiza and surprisingly affordable.",sections:[{title:"The Food",items:[{key:"Concept",val:"Everything on the plate is grown in the garden surrounding the restaurant. Menu changes with the seasons and what is available each day."},{key:"Style",val:"Mediterranean and Middle Eastern influences. Strong on vegetarian and vegan options. Light, fresh, colourful food that suits the Ibiza climate."},{key:"Best for",val:"Lunch after or before the Port Sant Miquel walk. Open from noon so it works as a post-walk reward."}]},{title:"Practical Details",items:[{key:"Hours",val:"Daily noon to midnight."},{key:"Location",val:"On the road to Sant Miquel — you will pass it on the way to the Port Sant Miquel coastal walk starting point."},{key:"Value",val:"Affordable compared to the island average — described repeatedly as 'surprisingly reasonable.' Budget ££."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJU0iGHDg5mRIRGXue5cIYhLY",website:"https://aubergineibiza.com/"},
{id:"e-elzaguan",lat:38.9104421,lng:1.4329699,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"El Zaguán",sub:"Ibiza Town · 6pm–11:30pm · Closed Tue and Wed",badge:null,pills:[{t:"£",c:"price"},{t:"Basque pintxos",c:"info"},{t:"Open Mon Sep 7",c:"free"}],desc:"Basque-style pintxos bar near Vara de Rey in Ibiza Town — one of the most highly rated value restaurants in the old town area. Cold pintxos displayed on the bar at under €2 each, hot tapas brought round from the kitchen. 4.5 stars from 1,700+ reviews.",sections:[{title:"How It Works",items:[{key:"The bar display",val:"Cold pintxos displayed along the bar on plates. Pick what takes your interest — bread-based toppings with smoked salmon, cheese, anchovy, crab, cured meats, roasted pepper and more. Each piece under €2."},{key:"Hot pintxos",val:"Servers circulate with plates of freshly grilled hot tapas. These rotate and change — grab them as they come by."},{key:"At the end",val:"Sticks are counted to calculate the bill. Order drinks as you go."}]},{title:"Practical Details",items:[{key:"Open Monday September 7",val:"Perfect for the Ibiza Town day. Closed Tuesdays and Wednesdays."},{key:"Hours",val:"6pm to 11:30pm on open days."},{key:"Best approach",val:"Arrive at 6pm to get the full fresh selection. Pair with La Bodega or Las Dalias afterwards."},{key:"Price",val:"£ — budget £15-20 per person for a full meal of pintxos. Outstanding value."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJu_CUIrpGmRIRlXaxygdZOmg",website:"https://elzaguan.es/"},
{id:"e-estapnou",lat:38.9097774,lng:1.4313488,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Es Tap Nou",sub:"Ibiza Town · Mon–Fri 8am–8:30pm · Sat 8am–3pm · Closed Sun",badge:null,pills:[{t:"£",c:"price"},{t:"Breakfast/lunch only",c:"info"},{t:"Very cheap",c:"free"}],desc:"Half fruit shop, half cafe — an Ibiza Town institution for over 30 years. The front room is a working greengrocer overflowing with island-grown produce. Step inside for freshly pressed juices, tomato bread, bocadillos and salads. Mostly only locals. Around €8 for a salad.",sections:[{title:"What to Order",items:[{key:"Fresh juices",val:"Made to order from the fruit in the shop. Orange, apple, carrot, ginger, combinations. The point of the place."},{key:"Tomato bread (pa amb oli)",val:"The Mallorcan and Ibizan staple — good bread rubbed with ripe tomato and olive oil. Topped with cheese or jambon."},{key:"Salads",val:"Fresh, generous, good quality ingredients from the shop. Around €8."}]},{title:"Practical Details",items:[{key:"Hours",val:"Monday to Friday 8am to 8:30pm. Saturday 8am to 3pm. Closed Sundays."},{key:"Best for",val:"Breakfast or lunch on the Ibiza Town day before heading up to Dalt Vila."},{key:"The rush",val:"Do not go in a rush. The staff work flat out but it is always busy and service is unhurried. Budget extra time."},{key:"Location",val:"Ibiza Town near Vara de Rey — on the same street cluster as Can Terra and El Zaguan."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJA-cctbtGmRIRBPnVANZICEE",website:"http://www.estapnou.es/"},
{id:"e-espins",lat:39.0280189,lng:1.4884663,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Es Pins",sub:"Sant Llorenç · Closed Wed",badge:null,pills:[{t:"£",c:"price"},{t:"Very cheap",c:"free"},{t:"Roadside classic",c:"info"}],desc:"Old-school roadside restaurant that has been feeding locals on the road to Sant Joan for decades without changing. Traditional Ibizan food at prices that feel like a different decade. The bread and aioli alone have their own reputation.",sections:[{title:"What to Order",items:[{key:"The bread and aioli",val:"Reviewers specifically mention this as the best on the island. Arrives as you sit down and sets the tone for everything that follows."},{key:"Paella and rice dishes",val:"Traditional Ibicencan paella made properly. Available with different combinations of seafood and meat."},{key:"Grills",val:"Roast lamb, pork chops, rabbit — traditional preparation, no frills."}]},{title:"Practical Details",items:[{key:"Price",val:"Price level £ — genuinely cheap for Ibiza. One of the best value restaurants on the island."},{key:"Location",val:"On the road between Sant Lloren and Sant Joan in the north of the island. 40 minutes from the villa."},{key:"Closed",val:"Wednesdays. Sunday lunch service closes at 5pm."},{key:"Best approach",val:"Stop here for lunch on any north day. No reservation needed but arrive by 1pm for best choice."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJfWj13VA-mRIRRZwmcDMD_K4"},
{id:"e-cancosmi",lat:39.0384889,lng:1.3360549,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Can Cosmi",sub:"Santa Agnès de Corona · 5pm–1am · Sun from noon · Closed Tue",badge:{t:"Since 1951",c:"g"},pills:[{t:"£",c:"price"},{t:"Village institution",c:"info"},{t:"Since 1951",c:"free"}],desc:"Village institution in Santa Agnes de Corona since 1951 — originally the village grocery store and social hub, still operating in the same spirit. The terrace looks directly onto the village church and the ancient olive tree. Famous across the island for its tortilla, lamb chops and baked chicken.",sections:[{title:"What to Expect",items:[{key:"The tortilla",val:"Widely regarded as one of the best on the island — thick, properly set, made with good potatoes and eggs. The bar for comparing any other tortilla."},{key:"Grills and mains",val:"Lamb chops, baked chicken, grilled fish. Simple, honest and cooked well."},{key:"The setting",val:"The terrace faces the village church and the ancient olive tree. Sant Agnes is one of the most peaceful villages in Ibiza. The drive through the almond groves to reach it is beautiful."},{key:"Note",val:"Recent reviews suggest the food remains good but the atmosphere may have shifted slightly under new ownership. The location and the tortilla remain the reason to go."}]},{title:"Practical Details",items:[{key:"Hours",val:"5pm to 1am on weekdays and Saturdays. Opens at noon on Sundays for lunch — the best option for a pre-north-day meal."},{key:"Closed",val:"Tuesdays."},{key:"Cash",val:"Possibly cash only — take cash to be safe."},{key:"Getting there",val:"15 minutes northwest of the villa through the almond groves. An easy detour on the way to the north coast."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ9TJd7xk3mRIR5RmbJGn5tS4"},
{id:"e-escantonet",lat:38.9110667,lng:1.4323056,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Es Cantonet",sub:"Ibiza Town · Mon–Sat 7am–11pm · Closed Sun",badge:null,pills:[{t:"£",c:"price"},{t:"Very cheap",c:"free"},{t:"Ibiza Town",c:"info"}],desc:"Proper local Spanish restaurant in Ibiza Town that has been feeding the neighbourhood for years without ceremony or pretension. Simple, generous, fresh. One of the best value menú del dia on the island.",sections:[{title:"What to Expect",items:[{key:"Menú del día",val:"Three courses plus drink at lunch — a genuine bargain. The menu changes daily. This is how Spanish people eat lunch."},{key:"Food style",val:"Honest, straightforward Spanish cooking. Nothing experimental, everything executed correctly."},{key:"Crowd",val:"Local workers, residents, anyone who values food over atmosphere. Not a tourist destination."}]},{title:"Practical Details",items:[{key:"Hours",val:"Monday to Saturday 7am to 11pm. Closed Sundays."},{key:"Location",val:"In Ibiza Town — close to Can Terra and Es Tap Nou. All three make a natural Ibiza Town food cluster."},{key:"Price",val:"£ — consistently one of the cheapest proper restaurants in town."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ08pzirlGmRIRtFpC9Az8kPE",website:"https://escantonet.shop/"},
{id:"e-royalty",lat:38.9849155,lng:1.5338102,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Restaurant Royalty",sub:"Santa Eulalia main square · Daily 8am–midnight",badge:null,pills:[{t:"££",c:"price"},{t:"Since 1933",c:"free"},{t:"Main square terrace",c:"info"}],desc:"Santa Eulalias longest-standing restaurant, on the corner of the main square since 1933. Best experienced for breakfast or menú del dia on the terrace. Some regulars go three times a day — breakfast, afternoon coffee, dinner. An anchor of the Santa Eulalia day.",sections:[{title:"Best For",items:[{key:"Breakfast",val:"Coffee, fresh orange juice, pastries or toast. The terrace on the square in the morning is a lovely way to start a Santa Eulalia day."},{key:"Menú del día",val:"Three courses plus drink at lunch — good value and consistent."},{key:"Fried octopus (frita de polp)",val:"The standout dish — order it."},{key:"What to avoid",val:"The full a la carte in the evening has more mixed reviews. Stick to simpler dishes."}]},{title:"Practical Details",items:[{key:"Hours",val:"8am to midnight daily — one of the most accessible restaurants on the island."},{key:"Location",val:"Corner of the main square (Plaza del Ayuntamiento) in Santa Eulalia. 30 minutes from the villa."},{key:"Combine with",val:"Ca na Ribes for dinner — together they make the Santa Eulalia day anchor."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJAZE-V7dGmRIRILxgXrsVIJ0",website:"https://www.facebook.com/royaltyibiza"},
{id:"e-canaribes",lat:38.9854457,lng:1.5349527,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Ca na Ribes",sub:"Santa Eulalia · Lunch 1–3:30pm · Dinner 7–11:30pm · Closed Sun",badge:{t:"Since 1926",c:"g"},pills:[{t:"££",c:"price"},{t:"Since 1926",c:"free"},{t:"Courtyard garden",c:"info"},{t:"Book ahead",c:"warn"}],desc:"The oldest restaurant on the island — same courtyard since 1926, now run by the fourth generation of the founding family. A beautiful interior garden with terracotta tiles, climbing vine and a fountain. Traditional Ibizan cuisine. The paella here has its own reputation: 'I went twice in one week. Hands down the best I have ever tasted.'",sections:[{title:"What to Order",items:[{key:"Paella",val:"The signature and the reason multiple reviewers come back twice in one stay. Both seafood and chicken paella are excellent. Order it as the main event."},{key:"Baked fish",val:"The other strong suit — baked fish with herbs, local style."},{key:"Starters",val:"Good selection of traditional Ibizan starters. The frita de polp (fried octopus) is excellent here."},{key:"Black rice",val:"If available, the arros negre (black rice with squid ink) is worth ordering."}]},{title:"Practical Details",items:[{key:"Hours",val:"Lunch 1pm to 3:30pm. Dinner 7pm to 11:30pm. Closed Sundays."},{key:"Location",val:"In Santa Eulalia, 30 metres from Restaurant Royalty — two of the oldest restaurants on the island on the same street."},{key:"Reservations",val:"Recommended — particularly for dinner. Phone ahead or book on arrival in town."},{key:"Cost",val:"Around €30-40 per head for a full meal. Good value for the quality and history."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJaewNKU8VmRIRHD36zfiMGcw",website:"https://canaribes.es/"},
{id:"e-lasdalias",lat:39.0284124,lng:1.5577137,ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Las Dalias night market",hrs:"Sat/Sun/Mon/Tue 7pm–11:30pm · Sant Carles",badge:null,pills:[{t:"Free entry",c:"free"},{t:"7–11:30pm",c:"time"},{t:"30 mins from villa",c:"info"}],desc:"One of the best free evenings on the island and completely unlike anything else in Ibiza. Over 100 artisan stalls selling handmade clothing, jewellery, art and craft, alongside international food stalls and live acoustic music. On Sundays DJs play on the terrace with people dancing under the stars. Bohemian, warm and genuine. Founded in 1954.",sections:[{title:"The Food and Drink",items:[{key:"Food stalls",val:"International street food from a dozen or more stalls around the site — Moroccan tagines, Asian wraps, fresh juices, wood-fired pizza, Indian street food, Spanish tapas. Quality is consistently good and prices are normal (not inflated)."},{key:"Drinks",val:"Cocktail and beer stalls at reasonable prices. Not club prices — a beer is €4-6, cocktail €8-12."},{key:"The artisan market",val:"The food stalls sit alongside 100+ artisan stalls. Handmade leather, textiles, jewellery, ceramics, essential oils. A genuinely good place to buy something to remember the trip."}]},{title:"Practical Details",items:[{key:"When",val:"Saturday, Sunday, Monday and Tuesday in September. All 7pm to 11:30pm."},{key:"Getting there",val:"Ctra San Carlos km 12. 30 minutes from the villa. Free car park on site."},{key:"Akasha connection",val:"The club Akasha (see Clubs tab) opens on the same site from 11pm if you want to continue the evening."},{key:"Cost",val:"Free entry. Eat and drink at normal prices — budget £ per head."}]}],note:null,maps:"https://www.google.com/maps?cid=5106203796113575268",website:"https://www.lasdalias.es",tickets:null}
];

const WALKS=[{id:"w-calabassa",lat:38.967757,lng:1.241227,distKm:9.2,diff:"Moderate",ico:"ti-route",col:"ico-gn",nm:"Cala Bassa — Torre d'en Rovira loop",sub:"20 mins from villa",badge:null,pills:[{t:"Circular",c:"genre"},{t:"9.2km",c:"info"},{t:"Moderate",c:"warn"},{t:"Morning",c:"time"}],desc:"A circular coastal route linking three unspoiled beaches via a historic watchtower, with panoramic views across the sea toward the islets of Conillera. One of the most satisfying walks near the villa — varied, scenic and ending with a swim.",sections:[{title:"The Route",items:[{key:"Overview",val:"Start at Cala Bassa beach. The path climbs gently to Torre den Rovira watchtower, a 16th-century defensive tower with views across the entire western coast. The route then drops to connect Cala Conta and returns."},{key:"The watchtower",val:"Built to watch for Barbary pirates. The views from the top take in Conillera island, the western coast of Ibiza, and on clear days toward the Spanish mainland."},{key:"The beaches",val:"Three distinct beaches along the route, each with good swimming. Cala Conta at the far end is considered one of the most beautiful beaches on the island."}]},{title:"Practical Details",items:[{key:"Distance and time",val:"9.2km circular, approximately 2–2.5 hours at a comfortable pace without swimming stops."},{key:"Best time",val:"Morning before the heat. Start by 9am in September."},{key:"Transport",val:"In summer buses run between Cala Bassa and Sant Antoni — can be done one-way if preferred."},{key:"What to bring",val:"Plenty of water, swimming things, snacks. No shade on the upper sections."},{key:"Difficulty",val:"Moderate — longer than it looks, with some rocky, poorly-marked sections near the tower. Comfortable trainers recommended."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJBxfkK45KmRIRxSB6XOTHhik",alltrails:"https://www.alltrails.com/trail/spain/ibiza/cala-bassa-torre-d-en-rovira-cala-comte"},,{id:"w-moscarter",lat:39.1100462,lng:1.5172804,distKm:7.6,diff:"Moderate",ico:"ti-route",col:"ico-gn",nm:"Punta Moscarter lighthouse",sub:"Portinatx · North",badge:null,pills:[{t:"Out & back",c:"genre"},{t:"7.6km",c:"info"},{t:"Moderate",c:"warn"},{t:"Morning",c:"time"}],desc:"A clifftop out-and-back walk through the wildest part of the island to the Punta Moscarter lighthouse — the northernmost point of Ibiza. Wind-sculpted pines, dramatic coastline and sea views that feel entirely remote. A hidden crystal cove lies beyond the lighthouse if you push on.",sections:[{title:"The Walk",items:[{key:"The lighthouse",val:"Punta Moscarter is the northernmost tip of Ibiza. The lighthouse has been here since 1857. The views from the point back across the island and toward Menorca on a clear day are exceptional."},{key:"The hidden cove",val:"Push past the lighthouse along the path for another 20 minutes and you reach a crystal clear cove accessible only on foot. Worth the extra effort."},{key:"The landscape",val:"Wild, scrubby, windswept. Pine and juniper shaped by the north wind. Nothing like the south coast."}]},{title:"Practical Details",items:[{key:"Start point",val:"Portinatx village car park. The trail is marked but not signposted throughout."},{key:"Duration",val:"7.6km out and back, approximately 2.5-3 hours."},{key:"Combine with",val:"Lunch in Sant Joan de Labritja, 45 minutes from Portinatx. One of the best north day combinations."},{key:"Difficulty",val:"Moderate but technical in places — several sections require scrambling over rocky outcrops and steep, loose ground. Hiking boots with good grip essential, not trainers. Exposed with no shade. Start early."}]}],note:null,maps:"https://www.google.com/maps?cid=2301373648189429326",alltrails:"https://www.alltrails.com/trail/spain/ibiza/sendero-de-la-costa-far-des-moscarter-via-carrer-s-arenal-gran"},,{id:"w-caladserra",lat:39.1102,lng:1.5175,distKm:8,diff:"Moderate",ico:"ti-route",col:"ico-gn",nm:"Cala d'en Serra from Portinatx",sub:"North",badge:null,pills:[{t:"Out & back",c:"genre"},{t:"~4km each way",c:"info"},{t:"Moderate",c:"warn"},{t:"Afternoon",c:"time"}],desc:"Walk from Portinatx along wild northern coastline to a beautiful cove alongside the ruins of an abandoned hotel started in 1969 and never finished — now entirely covered in murals and street art by local and international artists. Small bar, no phone signal. Genuinely unusual.",sections:[{title:"The Destination",items:[{key:"The abandoned hotel",val:"Construction began in 1969 but was never completed. The concrete skeleton has been entirely painted over the years by local and visiting artists. The result is one of the most unusual art installations in the Balearics."},{key:"The cove",val:"A beautiful curved bay with clear water. The combination of natural beauty and the strange painted ruins is genuinely memorable."},{key:"The bar",val:"A small simple bar serves drinks and basic food. Cash only. No signal."}]},{title:"Practical Details",items:[{key:"Route",val:"Start at Portinatx beach and follow the coastal path east, past Punta Moscarter lighthouse, to reach Cala den Serra — about 4km each way, roughly 8km round trip."},{key:"Best approach",val:"Walk there, swim, have a drink at the bar, walk back. Allow 3-4 hours."},{key:"Timing",val:"Afternoon — the ruins are best photographed with afternoon light on them."},{key:"Difficulty",val:"Moderate but technical in places — some rocky scrambling sections. Good grip footwear essential, not sandals."}]}],note:null,maps:"https://www.google.com/maps?cid=2301373648189429326",alltrails:"https://www.alltrails.com/trail/spain/ibiza/sendero-de-la-costa-far-des-moscarter-via-carrer-s-arenal-gran"},,{id:"w-calallonga",lat:38.952548,lng:1.5198034,ico:"ti-route",col:"ico-gn",nm:"Sol d'en Serra — Cala Llonga loop",sub:"East · Santa Eulària",badge:null,distKm:4.2,diff:"Moderate",pills:[{t:"Circular",c:"genre"},{t:"4.2km",c:"info"},{t:"Moderate",c:"warn"},{t:"Morning",c:"time"}],desc:"A compact up-and-down coastal loop on the east coast, linking Cala Llonga and Sol d'en Serra beaches via ancient hilltop ruins — a good option if you're already staying or eating over on this side of the island.",sections:[{title:"The Route",items:[{key:"Overview",val:"A trail with frequent short ups and downs, following the coast between the beaches of Cala Llonga and Sol d'en Serra."},{key:"Puig de Ses Torretes",val:"The high point of the walk — the ruins of ancient, near-circular wooden-roofed structures are visible at the top, with excellent views back over both beaches."},{key:"The descent",val:"The drop down to Cala Llonga isn't technically difficult, but the terrain is uneven and rocky underfoot — take care not to slip."}]},{title:"Practical Details",items:[{key:"Distance and time",val:"4.2km circular, approximately 1.5 hours at a comfortable pace."},{key:"Difficulty",val:"Moderate — short but with real ups and downs on rocky, uneven ground. Hiking shoes recommended."},{key:"Combine with",val:"Santa Eulalia day — Restaurant Royalty and Ca na Ribes are a short drive away for lunch or dinner."},{key:"Getting there",val:"East coast, near Santa Eulària des Riu."}]}],note:null,maps:"https://www.google.com/maps?cid=10204258330126439123",alltrails:"https://www.alltrails.com/trail/spain/ibiza/sol-d-en-serra-cala-llonga-carrer-des-mur-aconagua"},{id:"w-escubells",lat:38.8812009,lng:1.272244,ico:"ti-route",col:"ico-gn",nm:"Es Cubells — Cala Llentrisca coastal walk",sub:"South · Sant Josep",badge:null,distKm:10.9,diff:"Moderate",pills:[{t:"Circular",c:"genre"},{t:"10.9km",c:"info"},{t:"Moderate",c:"warn"},{t:"Morning",c:"time"}],desc:"A long, dramatic clifftop loop from the church at Es Cubells down to the fishermen's boathouses at Cala Llentrisca — with a different, less crowded vantage point over Es Vedrà along the way. A serious walk, not a stroll.",sections:[{title:"The Route",items:[{key:"Overview",val:"Starts at the church in Es Cubells and follows the coastline south toward Ses Boques beach and Cala Llentrisca, with a section of paved road with light traffic partway through."},{key:"The Es Vedrà angle",val:"Partway round, the trail climbs to a viewpoint with a different perspective on Es Vedrà from the classic Cala d'Hort shot — worth knowing about given the old Puig des Savinar viewpoint is now closed (see the Cala d'Hort entry)."},{key:"Cala Llentrisca",val:"A secluded bay with traditional fishermen's boathouses — one of the least-visited coves on this stretch of coast."}]},{title:"Practical Details",items:[{key:"Distance and time",val:"10.9km circular, approximately 3–3.5 hours at a comfortable pace."},{key:"Difficulty",val:"Moderate but serious — sections of dirt, loose rock and steep slopes. Hiking boots with good traction required, not trainers."},{key:"Best time",val:"Start early — exposed coastal terrain with little shade."},{key:"What to bring",val:"Plenty of water, sunscreen, proper footwear."}]}],note:null,maps:"https://www.google.com/maps?cid=12542234878288175798",alltrails:"https://www.alltrails.com/trail/spain/ibiza/es-cubells-ses-bosques-cala-llentrisca"},{id:"w-satalaia",lat:38.921951,lng:1.2931333,distKm:6,diff:"Moderate",ico:"ti-route",col:"ico-gn",nm:"Sa Talaia — Ibiza's highest point",sub:"30 mins · Sant Josep",badge:null,pills:[{t:"Out & back",c:"genre"},{t:"6km",c:"info"},{t:"Moderate",c:"warn"},{t:"Before 9am essential",c:"warn"}],desc:"Ibiza's highest point at 487 metres. On a clear September morning you can see the whole island, across to Formentera, and in ideal conditions the Spanish mainland. Little shade above the treeline — start before 9am or the heat makes it miserable.",sections:[{title:"The Ascent",items:[{key:"Route",val:"Start from the car park near Sant Josep village. The path is well-marked. The lower section goes through pine forest with shade. Above the tree line it is exposed."},{key:"The views from the top",val:"The entire island laid out beneath you. The south coast, Formentera across the water, the interior with its white fincas, the north coast. One of those perspectives that makes you understand a place differently."},{key:"Duration",val:"Approximately 1.5 hours up, 1 hour down. Total circuit around 2.5-3 hours."}]},{title:"Practical Details",items:[{key:"Start time",val:"Leave no later than 8am in September. The summit before 10am is the target."},{key:"Water",val:"Carry significantly more than you think you need. 2 litres per person minimum."},{key:"Footwear",val:"Light hiking shoes or good trainers. The path is rocky in sections."},{key:"Getting there",val:"Park in Sant Josep village. The trailhead is well-signed."}]}],note:null,maps:"https://www.google.com/maps?cid=6152320125531163694",alltrails:"https://www.alltrails.com/trail/spain/ibiza/san-jose-cap-de-sa-talaia-talaia-de-sant-josep-roca-grossa"},,{id:"w-puertascielo",lat:39.0384889,lng:1.3360549,ico:"ti-route",col:"ico-gn",nm:"Las Puertas del Cielo — Penya Esbarrada",sub:"Santa Agnès de Corona",badge:null,distKm:3.5,diff:"Moderate",pills:[{t:"Circular",c:"genre"},{t:"3.5km",c:"info"},{t:"Moderate",c:"warn"},{t:"Morning",c:"time"}],desc:"A short, dramatic clifftop loop from Santa Agnès de Corona to the 'Gates of Heaven' viewpoint — a sheer sea cliff with some of the best coastal views on the west of the island. Starts right by Can Cosmi, so easy to combine with lunch.",sections:[{title:"The Walk",items:[{key:"The viewpoint",val:"Las Puertas del Cielo (Puertas del Cielo) is a dramatic clifftop lookout over the western sea cliffs — one of the more striking, less-crowded viewpoints on the island."},{key:"Terrain",val:"Constant up and down along the cliff edge — locals use it for trail-running training. The path is faint in places; worth downloading the AllTrails map before setting off."},{key:"Sa Penya Esbarrada",val:"An archaeological site along the route, alongside the natural rock formations that give the walk its drama."}]},{title:"Practical Details",items:[{key:"Distance and time",val:"3.5km circular, approximately 1–1.5 hours."},{key:"Start point",val:"Starts at the car park by Can Cosmi in Santa Agnès de Corona — combine the walk with lunch there."},{key:"Difficulty",val:"Moderate — short but with real elevation change and rocky, uneven ground. Good hiking shoes essential, not sandals."},{key:"What to bring",val:"Water, hat, sunscreen — no shade for most of the route."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ9TJd7xk3mRIR5RmbJGn5tS4",alltrails:"https://www.alltrails.com/trail/spain/ibiza/mirador-las-puertas-del-cielo-penya-esbarrada-via-carretera-corona"},{id:"w-sanvicente",lat:39.0756135,lng:1.5919806,ico:"ti-route",col:"ico-gn",nm:"Cala Sant Vicent — s'Aigua Dolça loop",sub:"North-east · Sant Joan de Labritja",badge:null,distKm:8.9,diff:"Moderate",pills:[{t:"Circular",c:"genre"},{t:"8.9km",c:"info"},{t:"Moderate",c:"warn"},{t:"Morning",c:"time"}],desc:"A steep, remote loop on the north-east coast — a hard climb out of Cala Sant Vicent, round the Serra d'en Negre ridge, and down to the hidden swim spot at s'Aigua Dolça. One of the wilder, quieter corners of the island.",sections:[{title:"The Route",items:[{key:"Overview",val:"Starts at Cala Sant Vicent beach with a steep climb up through Venda de Cas Rierons — tough going but with genuinely excellent views. The descent circles the Serra d'en Negre ridge down to Cala s'Aigua Dolça."},{key:"s'Aigua Dolça",val:"A hidden cove at the far end of the loop — bring swimwear, it's worth the walk to get here."},{key:"Isolation",val:"This route runs past working farmland with loose dogs on some adjacent properties, and has patchy phone signal — a trekking pole and a downloaded map are worth having."}]},{title:"Practical Details",items:[{key:"Distance and time",val:"8.9km circular, approximately 2.5–3 hours."},{key:"Difficulty",val:"Moderate but strenuous — a steep initial climb and rocky, narrow paths. Sturdy footwear and an early start recommended."},{key:"Best time",val:"Morning — the climb is much harder in full afternoon heat."},{key:"What to bring",val:"Plenty of water, swimwear for s'Aigua Dolça, and download the offline map — cell service is patchy."}]}],note:null,maps:"https://www.google.com/maps?cid=631573607763724115",alltrails:"https://www.alltrails.com/trail/spain/ibiza/cala-de-san-vicente-serra-d-en-negre-s-aigua-dolca"},{id:"w-torreportes",lat:38.8444725,lng:1.4024157,ico:"ti-route",col:"ico-gn",nm:"Torre de ses Portes — Ses Salines beach loop",sub:"South · Ses Salines",badge:null,distKm:9.2,diff:"Easy",pills:[{t:"Circular",c:"genre"},{t:"9.2km",c:"info"},{t:"Easy",c:"free"},{t:"Morning",c:"time"}],desc:"A gentle, mostly-flat loop through Ses Salines nature park, walking the sand between beaches and coves — sandy beach, beach bars, pine forest, some naturist stretches. The easiest way to properly explore the park on foot.",sections:[{title:"The Route",items:[{key:"Overview",val:"Starts at the Es Cavallet car park and follows the coast on sand and packed paths, linking a series of beaches and coves within the nature reserve, with a stretch through pine forest."},{key:"The beaches",val:"Several distinct beaches along the way, some naturist — a genuinely varied walk for how flat and easy it is."},{key:"Torre de ses Portes",val:"One of the old coastal watchtowers built to spot Barbary pirates, visible along the route."}]},{title:"Practical Details",items:[{key:"Distance and time",val:"9.2km circular, approximately 2–2.5 hours — flat and easy, mostly on sand."},{key:"Difficulty",val:"Easy. No real elevation change, though soft sand for stretches is tiring underfoot."},{key:"Best time",val:"Morning before the heat, or combine with an afternoon at one of the beach bars along the way."},{key:"What to bring",val:"Water, swimming things — several good spots to stop and swim."}]}],note:null,maps:"https://www.google.com/maps?cid=11185452145794362736",alltrails:"https://www.alltrails.com/trail/spain/ibiza/torre-de-ses-portes-las-salinas"},{id:"w-calodesmoro",lat:
