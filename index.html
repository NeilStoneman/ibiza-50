<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ibiza 50th — Sep 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sand:#F5EDD8;--bg:#FAFAF7;--surface:#FFFFFF;--border:#E4D8C4;
  --text:#1A2332;--sec:#6B5E50;--muted:#9A8878;
  --accent:#1870A8;--acbg:#EBF5FC;--acbd:#B5D4F4;
  --amber:#854F0B;--ambbg:#FAEEDA;--ambd:#F5C070;
  --green:#3B6D11;--grnbg:#EAF3DE;--grnbd:#C0DD97;
  --blue:#0C447C;--blubg:#E6F1FB;
  --pur:#3C3489;--purbg:#EEEDFE;
}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);padding-bottom:3rem}
/* Hero */
.hero{background:var(--sand);border-bottom:1px solid var(--border);padding:1rem 1rem .75rem}
.hero-eye{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.hero-title{font-family:Georgia,serif;font-size:30px;font-weight:400;line-height:1;margin-bottom:3px}
.hero-sub{font-size:12px;color:var(--sec)}
/* Tabs */
.tab-bar{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{display:inline-flex;align-items:center;gap:4px;padding:10px 13px;font-size:12px;font-weight:500;color:var(--sec);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;transition:color .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn i{font-size:14px}
/* Panes */
.pane{display:none;padding:10px 12px}
.pane.on{display:block}
/* Summary banner */
.summary{background:var(--acbg);border:1px solid var(--acbd);border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:12px;line-height:1.65;color:var(--text)}
/* Sight filter */
.sf-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.sf-btn{font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--sec);cursor:pointer;transition:all .15s}
.sf-btn.on{background:var(--acbg);color:var(--accent);border-color:var(--acbd)}
/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;overflow:hidden;transition:box-shadow .2s}
.card.open{box-shadow:0 2px 12px rgba(0,0,0,.07)}
.card-hdr{display:flex;align-items:flex-start;gap:10px;padding:12px 12px 11px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.card-hdr:hover{background:#FDFAF5}
.card-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;margin-top:1px}
.ico-pu{background:var(--purbg);color:var(--pur)}
.ico-am{background:var(--ambbg);color:var(--amber)}
.ico-gn{background:var(--grnbg);color:var(--green)}
.ico-bl{background:var(--blubg);color:var(--blue)}
.ico-gy{background:var(--bg);color:var(--sec)}
.card-meta{flex:1;min-width:0}
.card-top{display:flex;align-items:flex-start;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.card-name{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.3}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;flex-shrink:0}
.bdg-g{background:#DCFCE7;color:#166534}
.bdg-w{background:var(--ambbg);color:var(--amber)}
.bdg-n{background:var(--bg);color:var(--sec);border:1px solid var(--border)}
.card-sub{font-size:11.5px;color:var(--muted)}
.catb{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;display:inline-block}
.cat-Beach{background:var(--blubg);color:var(--blue)}
.cat-Natural-sight,.cat-Nature{background:var(--grnbg);color:var(--green)}
.cat-Village{background:var(--bg);color:var(--sec);border:1px solid var(--border)}
.cat-Culture,.cat-Restaurant,.cat-Bar-Sunset{background:var(--ambbg);color:var(--amber)}
.cat-Day-trip{background:var(--purbg);color:var(--pur)}
.chevron{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);margin-top:2px;transition:background .15s}
.chevron i{transition:transform .3s ease;font-size:14px}
.card.open .chevron{background:var(--acbg);border-color:var(--acbd);color:var(--accent)}
.card.open .chevron i{transform:rotate(180deg)}
/* Card body */
.card-body{height:0;overflow:hidden;transition:height .32s ease}
.card-body-inner{padding:0 12px 14px 56px}
.card-divider{height:1px;background:var(--border);margin:0 12px 12px}
.card-note{font-size:12.5px;color:var(--text);line-height:1.65;margin-bottom:12px}
/* Chips */
.chip-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--sec);border:1px solid var(--border)}
.chip i{font-size:12px}
.chip-e{background:var(--grnbg);color:var(--green);border-color:var(--grnbd)}
.chip-m{background:var(--ambbg);color:var(--amber);border-color:var(--ambd)}
/* Links inside card */
.card-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.cl{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;text-decoration:none;padding:5px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.cl-maps{background:var(--acbg);color:var(--accent);border-color:var(--acbd)}
.cl-at{background:var(--grnbg);color:var(--green);border-color:var(--grnbd)}
.cl-wl{background:var(--sand);color:var(--sec);border-color:var(--border);transition:all .2s}
.cl-wl.copied{background:var(--grnbg);color:var(--green);border-color:var(--grnbd)}
/* Itineraries */
.itn-slots{padding:0 12px 14px 56px}
.slot{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #F0E8D8}
.slot:last-child{border:none;padding-bottom:0}
.slot-time{font-size:10px;font-weight:600;color:var(--accent);min-width:72px;flex-shrink:0;padding-top:2px;text-transform:uppercase;letter-spacing:.06em}
.slot-name{font-size:12.5px;font-weight:500;color:var(--text)}
.slot-link{cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.slot-link:hover{color:var(--blue)}

.pills-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.pill i{font-size:11px}
.pill-price{background:#FAEEDA;color:#854F0B;border:1px solid #F5C070}
.pill-free{background:#DCFCE7;color:#166534;border:1px solid #A0D4B0}
.pill-info{background:#EBF5FC;color:#1870A8;border:1px solid #B5D4F4}
.pill-warn{background:#FEF3C7;color:#92400E;border:1px solid #FBD87A}
.pill-time{background:#EAF3DE;color:#3B6D11;border:1px solid #C0DD97}
.pill-genre{background:var(--purbg);color:var(--pur);border:1px solid #C8C4F0}


.card-desc{font-size:12.5px;color:var(--text);line-height:1.65;margin-bottom:14px}
.card-section{margin-bottom:14px}
.section-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.section-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.section-list li{font-size:12.5px;color:var(--text);line-height:1.6;padding-left:12px;position:relative}
.section-list li::before{content:"·";position:absolute;left:0;color:var(--accent);font-weight:700}
.section-key{font-weight:600;color:var(--text)}

</style>
</head>
<body>

<div class="hero">
  <div class="hero-eye">50th birthday trip</div>
  <div class="hero-title">Ibiza</div>
  <div class="hero-sub">September 2–9, 2026 &nbsp;·&nbsp; San Rafael villa</div>
</div>

<nav class="tab-bar">
  <button class="tab-btn on" data-tab="clubs" onclick="showTab('clubs',this)"><i class="ti ti-music"></i> Clubs</button>
  <button class="tab-btn" data-tab="eat"   onclick="showTab('eat',this)"><i class="ti ti-tools-kitchen-2"></i> Eat</button>
  <button class="tab-btn" data-tab="walks" onclick="showTab('walks',this)"><i class="ti ti-route"></i> Walks</button>
  <button class="tab-btn" data-tab="shops" onclick="showTab('shops',this)"><i class="ti ti-shopping-bag"></i> Shops</button>
  <button class="tab-btn" data-tab="sights" onclick="showTab('sights',this)"><i class="ti ti-binoculars"></i> Sights</button>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────

const CLUBS_SUM = "Twelve venues ranked for your group. Ushuaïa is the centrepiece — already booked, open-air, done by midnight. Pikes is the hidden gem: free guestlist, over-27s only, house party in a legendary finca 10 minutes from the villa. Cova Santa and Funky Room suit your early-evening style perfectly. Las Dalias and Cala Benirràs are the free cultural alternatives. Amnesia and Club Chinois are for one proper late night each.";

const CLUBS=[{id:"c-ushuaia",ico:"ti-music",col:"ico-pu",nm:"Ushuaia — Calvin Harris",sub:"Playa den Bossa · Sep 4, 4pm–midnight",badge:{t:"Booked",c:"g"},pills:[{t:"££££ drinks",c:"price"},{t:"Open air",c:"info"},{t:"4pm start",c:"time"}],desc:"Ushuaia Ibiza is the most iconic open-air club venue in the world — a 5,000-capacity pool party and concert experience at Playa den Bossa. Already booked for September 4th with Calvin Harris, one of the biggest bookings of the Ibiza season.",sections:[{title:"The Experience",items:[{key:"Format",val:"An open-air concert arena built around a pool. Runs from late afternoon into midnight, meaning you get the full arc from afternoon sun through the golden hour sunset to evening — three atmospheres in one evening."},{key:"Calvin Harris",val:"One of the biggest headline DJs in the world, known for euphoric sets that work outdoors. The production values — sound, lights, staging — are exceptional."},{key:"Crowd",val:"International, mixed age, there for the spectacle. At this scale it feels more like a music event than a nightclub."}]},{title:"Practical Details",items:[{key:"Drinks prices",val:"Budget €20–25 per drink inside. Eat well and hydrate at the villa before going. Free tap water is available on request by law."},{key:"Getting there",val:"Two taxis needed for the group — approximately €44–50 each way at night. Pre-book via WhatsApp in advance."},{key:"Timing",val:"Arrives gates open around 4pm. Arrive by 5pm to find your spot and catch the full sunset. Finishes around midnight."},{key:"Tickets",val:"Already booked — hold onto your booking confirmation."}]}],note:null,maps:"https://www.google.com/maps/search/Ushuaia+Ibiza+Beach+Hotel"},
{id:"c-pikes",ico:"ti-music",col:"ico-pu",nm:"Pikes Hotel",sub:"Near Sant Antoni · Free guestlist · Over 27s only",badge:{t:"Free entry",c:"g"},pills:[{t:"Free entry",c:"free"},{t:"Over 27s",c:"warn"},{t:"££ drinks",c:"price"},{t:"10 mins",c:"time"}],desc:"A 500-year-old Ibicencan finca that has been running legendary parties since the late 1970s. Freddie Mercury celebrated his 41st birthday here. Wham filmed Club Tropicana at the pool. The feeling is entirely different from any superclub — less concert venue, more extraordinary house party.",sections:[{title:"The Experience",items:[{key:"Atmosphere",val:"Small interconnected rooms, a bar beside the famous pool, a garden, a dance floor — nothing is where you expect it. Intimate in the best way. The over-27s policy and no-phones rule are rigorously enforced and create an entirely different energy to other Ibiza venues."},{key:"Saturday nights",val:"The Pikes House Band plays live — vocals, trumpet, saxophone, keys, DJ. One of the best live music experiences on the island."},{key:"The history",val:"Freddie Mercury, Grace Jones, Julio Iglesias, and virtually every major artist who played Ibiza in the 1980s and 90s came here. His room — the Freddie Mercury Suite — is bookable as a hotel room."},{key:"The pool",val:"The same pool as the Club Tropicana video. Worth seeing in its own right."}]},{title:"Practical Details",items:[{key:"Entry",val:"Free guestlist in 2026 — they ask for a charitable donation on the door. Register on the Pikes website before arriving."},{key:"Getting there",val:"5 minutes from Sant Antoni, 10 minutes from the villa. Easy taxi."},{key:"Best night",val:"Saturday for the live band. Any night for the atmosphere."},{key:"Drinks",val:"Moderate — expect £££ rather than the ££££ of the superclubs. Spirits and cocktails but not at Ushuaia pricing."}]}],note:null,maps:"https://www.google.com/maps/search/Pikes+Hotel+Ibiza"},
{id:"c-covasanta",ico:"ti-music",col:"ico-pu",nm:"Cova Santa",sub:"Sant Josep road · Opens 7pm · Sep 6 (Pantheon) or Sep 8 (PIV)",badge:{t:"From 7pm",c:"n"},pills:[{t:"£££ entry + drinks",c:"price"},{t:"From 7pm",c:"time"},{t:"Cave garden",c:"info"}],desc:"Built around an ancient cave discovered in the 15th century, Cova Santa is set in the Ibiza countryside near Sant Josep and combines outdoor garden dining with an indoor club. One of the few venues that genuinely suits an early-evening crowd — doors open at 7pm and the journey from sunset dining to dancing unfolds naturally.",sections:[{title:"Your Nights",items:[{key:"September 6 — Pantheon",val:"The big Sunday residency. Described as a spiritual, theatrical experience — performances and costumes bringing the gods of Olympus to life alongside the music. Artists this season include Butch, LF System, Eats Everything, TSHA, HoneyLuv and more. Starts 19:00."},{key:"September 8 — PIV (check)",val:"Amsterdam-based micro house label PIV runs Tuesdays at Cova Santa. Focused on deep house and tech house with a refined underground edge. Check the website closer to the date as the September schedule may vary."}]},{title:"The Venue",items:[{key:"Format",val:"Outdoor garden terrace for the first part of the evening — dinner, drinks, socialising. As the night progresses, energy moves indoors to the cave club. You can leave at midnight having had a full, satisfying evening without feeling like you missed anything."},{key:"Capacity",val:"2,000 — large enough to feel like an event, intimate enough to not feel anonymous."},{key:"Music style",val:"Quality-led rather than headline-driven. Melodic, organic, deep. Not hard or aggressive at any point in the night."}]},{title:"Practical Details",items:[{key:"Tickets",val:"Around €32 for most events — significantly cheaper than the superclubs. Check ibiza-spotlight.com for current pricing and lineups."},{key:"Free entry",val:"Possible if you arrive early. Watch the venue social channels for announcements."},{key:"Getting there",val:"Carretera de San Jose km 7. 25 minutes from the villa. Taxi recommended — €15-17 from Playa den Bossa, €22-27 from Sant Antoni area."},{key:"Drinks",val:"Beer €12, water €10, spirits €20. Budget £££ inside."}]}],note:null,maps:"https://www.google.com/maps/search/Cova+Santa+Ibiza"},
{id:"c-wom",ico:"ti-sun",col:"ico-am",nm:"Word of Mouth (WOM)",sub:"Santa Eulalia marina · 1pm–11pm · Closed Wed",badge:{t:"Live music",c:"g"},pills:[{t:"££",c:"price"},{t:"Live music",c:"genre"},{t:"Closes 11pm",c:"time"}],desc:"A genuine hidden gem on the Santa Eulalia beachfront — nothing to do with the clubbing scene. Live bands play every evening followed by chilled DJ sets, with food that multiple reviewers describe as the best burger on the island. 4.7 stars. A natural fit for the Santa Eulalia day.",sections:[{title:"The Experience",items:[{key:"Format",val:"Beach bar and music venue combined. Live bands play first, then a DJ continues with laid-back music as the evening winds down. The vibe is warm, unpretentious and social."},{key:"Food",val:"The food is a genuine highlight — not an afterthought. Burgers are the standout but the whole menu is considered. Budget ££ per head."},{key:"Crowd",val:"Mix of locals, long-stay visitors and people who know the island well. Not the tourist-heavy scene of Sant Antoni."}]},{title:"Practical Details",items:[{key:"Location",val:"On the Santa Eulalia marina beachfront — one of the most pleasant settings on the east coast."},{key:"Timing",val:"1pm to 11pm means it works for a long lunch, an afternoon drink, or an early evening. Closed Wednesdays."},{key:"Combine with",val:"Restaurant Royalty for breakfast/lunch on the main square, Ca na Ribes for dinner — makes WOM the natural closing act of a Santa Eulalia day."}]}],note:null,maps:"https://www.google.com/maps/search/Word+of+Mouth+WOM+Santa+Eulalia+Ibiza"},
{id:"c-kasbah",ico:"ti-sun",col:"ico-am",nm:"Kasbah Ibiza Sunset",sub:"Sant Antoni sunset strip · Daily 10am–11pm",badge:{t:"Live music",c:"g"},pills:[{t:"££",c:"price"},{t:"Tapas & cocktails",c:"info"},{t:"Live music",c:"genre"}],desc:"Spanish tapas and cocktails with live music overlooking Calo des Moro on the Sant Antoni sunset strip. A proper sit-down alternative to the minimum-spend madness of Cafe del Mar — 4.5 stars, with reviewers noting they have returned many times over 10 years.",sections:[{title:"What to Expect",items:[{key:"Food and drink",val:"Spanish tapas alongside cocktails. The food is considered, not an afterthought. Budget ££ per head."},{key:"Sunset position",val:"Faces west for the full sunset. Arrive around 7pm for the best light. Live music plays as the sun drops."},{key:"Vibe",val:"Relaxed, social, no rush to move on. Much more civilised than the surrounding strip."}]},{title:"Practical Details",items:[{key:"Compared to neighbours",val:"No minimum spend tables, no pretension. A notch more authentic than Cafe del Mar while still in the same postcode."},{key:"Timing",val:"10am to 11pm daily. Afternoon drinks work well — arrive 7pm for sunset with music."},{key:"Getting there",val:"On the Sant Antoni sunset promenade. 15 minutes from the villa."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJj2OpvQM2mRIRYlXQwcvleEM"},
{id:"c-alunaroom",ico:"ti-music",col:"ico-pu",nm:"Aluna Funky Room + Calle de la Virgen",sub:"Ibiza Old Town · Wed–Sun from 9pm",badge:{t:"From 9pm",c:"n"},pills:[{t:"££",c:"price"},{t:"House/Funk/Disco",c:"genre"},{t:"From 9pm",c:"time"}],desc:"The spiritual successor to the legendary Funky Room at Pacha, hosted by Ibiza icon Vaughan Afrika beside the Dalt Vila walls. One of the most authentic music venues in Ibiza Town — the crowd is there to dance, not to be seen. Good prices for Ibiza. The surrounding Sa Penya quarter (Calle de la Virgen) is a 400-metre street of small bars worth wandering on the same evening.",sections:[{title:"The Experience",items:[{key:"Music",val:"House, funk, disco and Balearic sounds rooted in the original Ibiza spirit. DJs play here on their nights off for the love of it — the quality is consistently high without being headline-driven."},{key:"Crowd",val:"Mixed, dancing, not posing. No filming policy enforced. The Funky Room has always had this reputation and Aluna maintains it."},{key:"Setting",val:"Terrace with views of the Dalt Vila castle walls. An outdoor area for drinks before the dancing starts inside."}]},{title:"Practical Details",items:[{key:"Hours",val:"Wednesday to Sunday from 9pm."},{key:"Getting there",val:"In the Sa Penya quarter of Ibiza Town. 20 minutes from the villa. Combine with dinner in the old town and a wander along Calle de la Virgen beforehand."},{key:"Prices",val:"Reasonable for Ibiza — ££ rather than £££. Good prices noted repeatedly in reviews."},{key:"Best approach",val:"Dinner in Dalt Vila, wander Calle de la Virgen with a drink, arrive at Funky Room around 10pm."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJWWRQfhhHmRIRBqjLaeDaCxw"},
{id:"c-benirras",ico:"ti-sun",col:"ico-am",nm:"Cala Benirras — drum circles",sub:"North Ibiza · At sunset",badge:{t:"Free",c:"g"},pills:[{t:"Free",c:"free"},{t:"At sunset",c:"time"},{t:"Cultural institution",c:"info"}],desc:"One of the great Ibiza experiences — entirely separate from the clubbing scene. A beautiful north coast bay where drummers have gathered for decades to salute the sun setting behind the dramatic rocky islet known as God's Finger. The Friday and Tuesday hippie market is the alternative. Essential for anyone who wants to understand the real Ibiza.",sections:[{title:"Drum Circles vs Hippie Market",items:[{key:"Sundays — drum circles",val:"Drummers of all ages and abilities gather on the beach and rocks as the sun drops. Organic, emotional, entirely genuine. Builds to a crescendo as the sun touches the rock. One of those experiences you will remember long after the clubs are forgotten."},{key:"Fridays and Tuesdays — hippie market",val:"A market of artisan stalls, food, and atmosphere in the same setting at sunset. Less intense than the drum circles but a lovely early evening."}]},{title:"Getting There",items:[{key:"Sundays",val:"Traffic is severe — park at Sant Joan car park and take the shuttle bus. This is not optional; driving is essentially impossible."},{key:"Fridays and Tuesdays",val:"Drive yourself and park at the beach. Much easier."},{key:"Timing",val:"Arrive 30–45 minutes before sunset. September sunset is approximately 8:15pm — check the exact time before going."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJMarVGW48mRIRzA5PaaR-b48"},
{id:"c-lasdalias",ico:"ti-sun",col:"ico-am",nm:"Las Dalias night market",sub:"Sant Carles · 7–11:30pm · Sat/Sun/Mon/Tue",badge:{t:"Free entry",c:"g"},pills:[{t:"Free entry",c:"free"},{t:"7–11:30pm",c:"time"},{t:"Market + music",c:"info"}],desc:"One of the best free evenings on the island and completely unlike anything else in Ibiza. Over 100 artisan stalls selling handmade clothing, jewellery, art and craft, alongside international food stalls and live music. On Sundays DJs play on the terrace with people dancing under the stars. Bohemian, warm and genuine.",sections:[{title:"What to Expect",items:[{key:"The market",val:"Artisan goods — leather, textiles, jewellery, ceramics, essential oils. Quality varies but many stalls are genuinely exceptional. An excellent place to buy something from the trip."},{key:"Food",val:"International food stalls around the edges — good quality street food at normal prices, not club prices."},{key:"Music",val:"Live acoustic acts and DJs depending on the night. Sundays tend to be the most musical."}]},{title:"Practical Details",items:[{key:"When",val:"Saturday, Sunday, Monday and Tuesday in September. All run 7pm to 11:30pm."},{key:"Combine with",val:"Go for the Las Dalias market at 7pm, then Akasha within the same complex from 11pm for one late night."},{key:"Getting there",val:"Sant Carles on the road to Santa Eulalia. 30 minutes from the villa. Free parking."},{key:"Budget",val:"Free entry. Food and drinks at normal prices — budget £."}]}],note:null,maps:"https://www.google.com/maps/search/Las+Dalias+Ibiza+Sant+Carles"},
{id:"c-akasha",ico:"ti-music",col:"ico-pu",nm:"Akasha at Las Dalias",sub:"San Carlos · Garden from 7pm · Club from 11pm",badge:{t:"300 capacity",c:"n"},pills:[{t:"£££",c:"price"},{t:"Deep house",c:"genre"},{t:"From 11pm",c:"time"}],desc:"A 300-person intimate club tucked within the Las Dalias complex — one of the best-kept secrets in Ibiza nightlife. The garden opens from 7pm alongside the Las Dalias market, so you can transition naturally from market browsing to dancing without leaving the site. Serious music, no-phones policy, carefully curated bookings.",sections:[{title:"The Music and Atmosphere",items:[{key:"Sound",val:"Deep house, organic electronic and tribal sounds. A Boiler Room-style DJ booth in a small room creates an intense, focused listening and dancing environment."},{key:"Crowd",val:"Knowledgeable music crowd. People who have sought this out rather than stumbled upon it."},{key:"No phones",val:"Enforced. Creates an entirely different atmosphere — people are present."}]},{title:"Practical Details",items:[{key:"Timing",val:"Garden from 7pm (can overlap with the Las Dalias market next door). Club proper from 11pm."},{key:"Tickets",val:"Buy online in advance — it sells out. Check the Las Dalias website for the booking link."},{key:"Getting there",val:"Same site as Las Dalias in Sant Carles — 30 minutes from the villa. One evening covers both."},{key:"Drinks",val:"Budget £££ inside the club. Garden bar is cheaper."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJwSN3CAEVmRIRV_ZTtz28e70"},
{id:"c-groundzero",ico:"ti-music",col:"ico-pu",nm:"Ground Zero",sub:"Sant Antoni · Rock and indie bar",badge:null,pills:[{t:"£",c:"price"},{t:"Rock/Indie",c:"genre"},{t:"Sant Antoni",c:"info"}],desc:"The only rock and indie bar in Sant Antoni — Arctic Monkeys, Killers, Oasis, Libertines, Kasabian. A complete change of gear from everything else on the island. Worth knowing about for one night when the mood calls for something entirely different. Cheap drinks. Genuine atmosphere.",sections:[{title:"What to Expect",items:[{key:"Music",val:"Classic and contemporary rock and indie. Think 2000s indie, Britpop, classic rock. Nothing electronic."},{key:"Crowd",val:"A different crowd entirely from the rest of Sant Antoni — people who are deliberately avoiding the dance music scene."},{key:"Vibe",val:"Unpretentious, relaxed, conversations happen. A proper bar."}]},{title:"Practical Details",items:[{key:"Drinks",val:"Cheap by Ibiza standards — £ territory. A genuine alternative to club pricing."},{key:"Location",val:"Tucked away from the main West End strip in Sant Antoni. 15 minutes from the villa."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ2cIjDuJJmRIRX7eZJydJVcc"},
{id:"c-chinois",ico:"ti-music",col:"ico-pu",nm:"Club Chinois",sub:"Ibiza Gran Hotel · From 11:30pm",badge:null,pills:[{t:"£££",c:"price"},{t:"Deep house",c:"genre"},{t:"From 11:30pm",c:"time"}],desc:"A refined, intimate club in the Ibiza Gran Hotel near the marina — one of the few genuine alternatives to the superclub experience for those who want quality music in a smaller room. Deep house and Afro house with excellent production. Sophisticated without being stuffy.",sections:[{title:"The Experience",items:[{key:"Scale",val:"Intimate by Ibiza standards — a proper club rather than a concert venue. You can actually hear the music as intended."},{key:"Music",val:"Deep house, Afro house and melodic techno. Defected label nights and Masquerade events feature in the programme. Quality bookings."},{key:"Crowd",val:"Older than the average superclub — people who chose this deliberately over the more obvious options."}]},{title:"Practical Details",items:[{key:"Timing",val:"Doors at 11:30pm — genuinely late. This is for one occasion rather than a regular."},{key:"Location",val:"Ibiza Gran Hotel on the marina in Ibiza Town. 20 minutes from the villa. Combine with dinner in Dalt Vila."},{key:"Drinks",val:"£££ territory — premium but not Ushuaia-level."},{key:"Tickets",val:"Check the Ibiza Spotlight calendar for specific night pricing."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJF4KLyRdHmRIR6IN8SS2voPo"},
{id:"c-amnesia",ico:"ti-music",col:"ico-pu",nm:"Amnesia — Glitterbox",sub:"San Rafael road · Sep 4, 11:30pm (after Ushuaia)",badge:null,pills:[{t:"££££",c:"price"},{t:"House/Disco",c:"genre"},{t:"After Ushuaia",c:"warn"}],desc:"Amnesia also celebrates its 50th anniversary in 2026 — the same milestone as this trip. The Glitterbox night on September 4th features David Morales, Jayda G and Horse Meat Disco — house and disco that suits the group perfectly. Literally 10 minutes from the villa on the San Rafael road.",sections:[{title:"Glitterbox Night — Sep 4",items:[{key:"Music",val:"House and disco with a genuine celebration spirit. David Morales is a house music legend — Grammy-winning, New York house royalty. Jayda G brings funk and energy. Horse Meat Disco is exactly what it sounds like: brilliant disco."},{key:"Format",val:"The Terrace (outdoor) and the Main Room run simultaneously. Start outside, move inside as the night builds."},{key:"Timing",val:"Doors 11:30pm — this follows naturally from Ushuaia winding down at midnight if the group has the energy."}]},{title:"Practical Details",items:[{key:"Tickets",val:"Buy online before the trip — significantly cheaper than the door. The door premium on Amnesia can be substantial."},{key:"Drinks",val:"£££-£££ — beer €12-16, spirits €18-25. Clubs must provide free tap water by law."},{key:"Getting there",val:"The San Rafael road — 10 minutes from the villa. Easiest venue to reach of the entire list."},{key:"The building",val:"Capacity around 5,000. The terrace is one of the great outdoor spaces in Ibiza — warm September evenings make it special."}]}],note:null,maps:"https://www.google.com/maps/search/Amnesia+Ibiza+Club"}];

const EATS=[{id:"e-canpilot",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Can Pilot",sub:"Sant Rafel de sa Creu · Closed Wed",badge:{t:"Book ahead",c:"w"},pills:[{t:"££",c:"price"},{t:"Book ahead",c:"warn"},{t:"5 mins from villa",c:"time"}],desc:"Asador Can Pilot is a legendary, no-frills steakhouse in the village of Sant Rafel de sa Creu — 5 minutes from the villa. Established in 1989, it is widely considered an island institution, hugely popular with locals, music industry insiders, and in-the-know visitors alike. Valentino Rossi has a home nearby and it is his favourite restaurant.",sections:[{title:"Highlights and Offerings",items:[{key:"Signature tabletop charcoal grills",val:"The centrepiece. The chuleton (T-bone steak, typically for two or more) arrives at the table partially seared alongside a mini tabletop barbecue, allowing you to finish cooking every bite exactly as you like it."},{key:"Menu highlights",val:"Excellent cuts of beef (solomillo, entrecote), pluma or secreto Iberico (pork), lamb chops, and rustic Spanish sausages including butifarra and morcilla. Classic tapas and sides include pimientos de Padron, garlic fried potatoes, and frita de polp (fried octopus)."},{key:"Local desserts",val:"Traditional Ibicencan sweets — flao (mint-infused cheesecake) and greixonera (cinnamon ensaimada pudding)."},{key:"Vibe",val:"Rustic, bustling, and completely unpretentious. Traditional Ibicencan wooden furniture and a large open-fire grill. Gets very lively, warm and smoky indoors at peak hours — request the outdoor terrace when booking."}]},{title:"Practical Details",items:[{key:"Location",val:"Carretera Eivissa to Sant Antoni, Sant Rafel — directly on the main road between Ibiza Town and Sant Antoni. 5 minutes from the villa."},{key:"Value",val:"Generous portions and very reasonably priced compared to resort dining elsewhere on the island."},{key:"Reservations",val:"Essential. It fills up every night. Book in advance before leaving the UK. Request the outdoor terrace to avoid the indoor smoke and heat."},{key:"Closed",val:"Wednesdays only."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJO3P6l-JHmRIRoJHUKzcO0HA"},
{id:"e-lapaloma",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"La Paloma",sub:"Sant Llorenç · Lunch 12:30–4:30pm · Dinner 8pm–midnight",badge:{t:"Book ahead",c:"w"},pills:[{t:"£££",c:"price"},{t:"Book ahead",c:"warn"},{t:"Garden dining",c:"info"}],desc:"One of the most universally loved restaurants on the island, and genuinely unlike anywhere else. You eat in a citrus grove — orange trees, lavender, twinkling lights strung through the branches — that feels entirely separate from commercial Ibiza. Two different menus by two different sets of owners, morning and evening.",sections:[{title:"The Menus",items:[{key:"Lunch — Middle Eastern",val:"Falafel, hummus, shakshuka, stuffed vine leaves, tabbouleh, beautiful mezze. Organic, fresh, colourful. Best enjoyed slowly over several hours in the shade of the grove."},{key:"Dinner — Italian-inspired",val:"A completely different kitchen team takes over for the evening. Homemade pasta, Italian classics with a Mediterranean influence, local ingredients."},{key:"Drinks",val:"Good wine list. Fresh juices and herb-infused drinks at lunch."}]},{title:"Practical Details",items:[{key:"Reservations",val:"Essential for both lunch and dinner. Book well in advance."},{key:"Location",val:"In Sant Lloren de Balafi, on the road north toward Sant Joan. The drive through the interior to reach it is beautiful."},{key:"Timing",val:"Lunch 12:30–4:30pm. Dinner 8pm to midnight. A long lunch here is one of the great Ibiza experiences — arrive at 12:30 and stay until 3pm."},{key:"Getting there",val:"40 minutes from the villa. Makes a natural stop on any north day."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJk0LzRvI9mRIRkbGRAJicva0"},
{id:"e-camibalafi",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Camí de Balàfia",sub:"Near Sant Joan · 8pm–11pm · Closed Sun",badge:{t:"Cash only",c:"w"},pills:[{t:"££",c:"price"},{t:"Cash only",c:"warn"},{t:"Book weeks ahead",c:"warn"}],desc:"One of the most authentic and sought-after dining experiences on the island — a family farm that has been grilling its own animals over charcoal for over 30 years. Known only to those who really know Ibiza. The tomatoes alone are described as life-changing.",sections:[{title:"The Experience",items:[{key:"Format",val:"You are eating on a working farm. The animals on the table were raised here. Everything comes from the land around you. This is farm-to-table in its most literal possible sense."},{key:"The grill",val:"Chicken, lamb chops, rabbit, secreto Iberico (pork), entrecote. Grilled over charcoal with exceptional seasoning."},{key:"The tomatoes",val:"Multiple reviewers specifically mention the tomatoes as extraordinary — grown on the farm, different category from supermarket."},{key:"The hierbas",val:"At the end of the meal they bring a bottle of homemade hierbas (the traditional Ibizan herbal spirit) and leave it on the table. Included in the bill."}]},{title:"Practical Details",items:[{key:"Reservations",val:"Book weeks in advance — it is very small and has been discovered by those in the know. Phone or email before you leave the UK."},{key:"Cash only",val:"Bring cash. No card machine."},{key:"Cost",val:"Approximately €85 for two people including wine. Excellent value for the experience."},{key:"Hours",val:"8pm to 11pm. Closed Sundays."},{key:"Location",val:"In the rural interior near Sant Joan de Labritja. Best combined with a north day."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJYxegAVs-mRIRHiq_4E4mxag"},
{id:"e-canmimosa",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Can Mimosa",sub:"Santa Gertrudis · 7–11pm · Closed Mon",badge:null,pills:[{t:"££",c:"price"},{t:"Garden dining",c:"info"},{t:"7–11pm",c:"time"}],desc:"A 200-year-old farmhouse with an enclosed garden that grows much of what appears on the plate. The chalkboard menu changes daily with what is available. One of the most consistently well-reviewed restaurants on the island — 4.7 stars across hundreds of visits over many years.",sections:[{title:"What to Expect",items:[{key:"Setting",val:"An enclosed walled garden with the farmhouse on one side. Candlelit in the evening. The kind of setting that makes food taste better."},{key:"Menu",val:"Mediterranean cooking with local seasonal ingredients. The menu is written on a blackboard and changes daily based on what is growing and available. Expect good salads, fish, meat and pasta — always well-executed."},{key:"Service",val:"Family-run and warm. Unhurried. The kind of place where a meal takes two hours without anyone feeling rushed."}]},{title:"Practical Details",items:[{key:"Hours",val:"7pm to 11pm. Closed Mondays."},{key:"Location",val:"Santa Gertrudis village — combine with a drink at Bar Costa (200 metres away) beforehand."},{key:"Reservations",val:"Recommended in September — book a few days in advance."},{key:"Getting there",val:"15 minutes from the villa."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJQW-c6PY5mRIRCAvpg3UahX4"},
{id:"e-aubergine",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Aubergine by Atzaro",sub:"Near Sant Miquel · Daily noon–midnight",badge:null,pills:[{t:"££",c:"price"},{t:"Farm to table",c:"info"},{t:"On north day route",c:"time"}],desc:"Farm-to-table restaurant set in a gorgeous garden on the road toward Sant Miquel — which means you pass directly by it on the way to the Port Sant Miquel coastal walk. Everything grown on the premises. Consistently described as one of the best meals in Ibiza and surprisingly affordable.",sections:[{title:"The Food",items:[{key:"Concept",val:"Everything on the plate is grown in the garden surrounding the restaurant. Menu changes with the seasons and what is available each day."},{key:"Style",val:"Mediterranean and Middle Eastern influences. Strong on vegetarian and vegan options. Light, fresh, colourful food that suits the Ibiza climate."},{key:"Best for",val:"Lunch after or before the Port Sant Miquel walk. Open from noon so it works as a post-walk reward."}]},{title:"Practical Details",items:[{key:"Hours",val:"Daily noon to midnight."},{key:"Location",val:"On the road to Sant Miquel — you will pass it on the way to the Port Sant Miquel coastal walk starting point."},{key:"Value",val:"Affordable compared to the island average — described repeatedly as "surprisingly reasonable." Budget ££."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJU0iGHDg5mRIRGXue5cIYhLY"},
{id:"e-espins",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Es Pins",sub:"Sant Llorenç · Closed Wed",badge:null,pills:[{t:"£",c:"price"},{t:"Very cheap",c:"free"},{t:"Roadside classic",c:"info"}],desc:"Old-school roadside restaurant that has been feeding locals on the road to Sant Joan for decades without changing. Traditional Ibizan food at prices that feel like a different decade. The bread and aioli alone have their own reputation.",sections:[{title:"What to Order",items:[{key:"The bread and aioli",val:"Reviewers specifically mention this as the best on the island. Arrives as you sit down and sets the tone for everything that follows."},{key:"Paella and rice dishes",val:"Traditional Ibicencan paella made properly. Available with different combinations of seafood and meat."},{key:"Grills",val:"Roast lamb, pork chops, rabbit — traditional preparation, no frills."}]},{title:"Practical Details",items:[{key:"Price",val:"Price level £ — genuinely cheap for Ibiza. One of the best value restaurants on the island."},{key:"Location",val:"On the road between Sant Lloren and Sant Joan in the north of the island. 40 minutes from the villa."},{key:"Closed",val:"Wednesdays. Sunday lunch service closes at 5pm."},{key:"Best approach",val:"Stop here for lunch on any north day. No reservation needed but arrive by 1pm for best choice."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJfWj13VA-mRIRRZwmcDMD_K4"},
{id:"e-cancosmi",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Can Cosmi",sub:"Santa Agnès de Corona · 5pm–1am · Sun from noon · Closed Tue",badge:{t:"Since 1951",c:"g"},pills:[{t:"£",c:"price"},{t:"Village institution",c:"info"},{t:"Since 1951",c:"free"}],desc:"Village institution in Santa Agnes de Corona since 1951 — originally the village grocery store and social hub, still operating in the same spirit. The terrace looks directly onto the village church and the ancient olive tree. Famous across the island for its tortilla, lamb chops and baked chicken.",sections:[{title:"What to Expect",items:[{key:"The tortilla",val:"Widely regarded as one of the best on the island — thick, properly set, made with good potatoes and eggs. The bar for comparing any other tortilla."},{key:"Grills and mains",val:"Lamb chops, baked chicken, grilled fish. Simple, honest and cooked well."},{key:"The setting",val:"The terrace faces the village church and the ancient olive tree. Sant Agnes is one of the most peaceful villages in Ibiza. The drive through the almond groves to reach it is beautiful."},{key:"Note",val:"Recent reviews suggest the food remains good but the atmosphere may have shifted slightly under new ownership. The location and the tortilla remain the reason to go."}]},{title:"Practical Details",items:[{key:"Hours",val:"5pm to 1am on weekdays and Saturdays. Opens at noon on Sundays for lunch — the best option for a pre-north-day meal."},{key:"Closed",val:"Tuesdays."},{key:"Cash",val:"Possibly cash only — take cash to be safe."},{key:"Getting there",val:"15 minutes northwest of the villa through the almond groves. An easy detour on the way to the north coast."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ9TJd7xk3mRIR5RmbJGn5tS4"},
{id:"e-elclo",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"El CLO (El Clodenis)",sub:"San Rafael village square · Closed Mon",badge:null,pills:[{t:"£££",c:"price"},{t:"Village square terrace",c:"info"},{t:"5 mins from villa",c:"time"}],desc:"Mexican-Mediterranean restaurant on the village square in San Rafael — 5 minutes from the villa. Great cocktails and a beautiful terrace. Prices are steep (wine around €14 a glass) so treat this as a special occasion spot rather than a regular, but it is excellent for the arrival night when Can Pilot is closed.",sections:[{title:"What to Expect",items:[{key:"Food",val:"Creative Mexican and Mediterranean fusion. Bold flavours, generous presentation. The cocktails are notably good."},{key:"Setting",val:"Tables on the village square terrace. Atmospheric in the evening when the village is quiet and the lights are on."},{key:"Best for",val:"Arrival night (Can Pilot is closed on Wednesdays). Special occasion dinners."}]},{title:"Practical Details",items:[{key:"Price",val:"£££ — wine around €14 a glass, mains €20-30. Worth knowing before sitting down."},{key:"Closed",val:"Mondays."},{key:"Location",val:"San Rafael village square — literally 5 minutes from the villa on foot depending on where the track exits."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJdYZgGZ9HmRIRh04ofjfir20"},
{id:"e-barcosta",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Bar Costa",sub:"Santa Gertrudis · Closed Tue",badge:{t:"Very cheap",c:"g"},pills:[{t:"£",c:"price"},{t:"Ibiza institution",c:"info"},{t:"Village square",c:"info"}],desc:"Ibiza institution in the Santa Gertrudis village square — hanging hams from the ceiling, famous bocadillos (stuffed rolls), cold beer. Extremely cheap. The kind of place that has barely changed in 40 years because it does not need to.",sections:[{title:"What to Order",items:[{key:"Bocadillos",val:"The house speciality — filled rolls with jambon serrano, cheese, tortilla or various combinations. The bread is good. Very cheap."},{key:"Cold beer",val:"A Estrella Damm or Moritz on the terrace in the late afternoon is the point."},{key:"When to go",val:"Early evening rather than dinner. Come for drinks and bocadillos before walking 200 metres to Can Mimosa for a proper dinner."}]},{title:"Practical Details",items:[{key:"Closed",val:"Tuesdays."},{key:"Price",val:"£ — genuinely cheap. One of the cheapest options on the island."},{key:"The combination",val:"Bar Costa at 6:30pm, Can Mimosa at 7:30pm — one of the best low-cost evenings in the guide."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJY0bju7U4mRIRuC4_VVSdhX8"},
{id:"e-labodega",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"La Bodega Eivissa",sub:"Ibiza Town · Daily 6pm–2am",badge:null,pills:[{t:"££",c:"price"},{t:"From 6pm",c:"time"},{t:"Foot of Dalt Vila",c:"info"}],desc:"Tapas bar at the base of the Dalt Vila ramp — a natural stopping point for any Ibiza Town evening. Buzzing, atmospheric, a good mix of locals and visitors. The tapas are the thing; stick to food and cocktails rather than shots.",sections:[{title:"What to Order",items:[{key:"Tapas",val:"Croquetas, manchego, meatballs, ceviche. Classic Spanish tapas done consistently well. Order several and share."},{key:"Cocktails",val:"Good cocktail programme. The house gin and tonics are well made."},{key:"What to avoid",val:"The shots are expensive and unnecessary. Stick to the food and proper drinks."}]},{title:"Practical Details",items:[{key:"Hours",val:"6pm to 2am daily — very useful for the Ibiza Town evening."},{key:"Location",val:"At the very foot of the Dalt Vila entrance ramp. You will pass it on the way down from the old town."},{key:"Best approach",val:"Dalt Vila exploration in the afternoon, La Bodega at 6–7pm, then El Zaguan for pintxos or Las Dalias for the market."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJSRyyqL1GmRIRdSVQZbzD1UY"},
{id:"e-escantonet",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Es Cantonet",sub:"Ibiza Town · Mon–Sat 7am–11pm · Closed Sun",badge:null,pills:[{t:"£",c:"price"},{t:"Very cheap",c:"free"},{t:"Ibiza Town",c:"info"}],desc:"Proper local Spanish restaurant in Ibiza Town that has been feeding the neighbourhood for years without ceremony or pretension. Simple, generous, fresh. One of the best value menú del dia on the island.",sections:[{title:"What to Expect",items:[{key:"Menú del día",val:"Three courses plus drink at lunch — a genuine bargain. The menu changes daily. This is how Spanish people eat lunch."},{key:"Food style",val:"Honest, straightforward Spanish cooking. Nothing experimental, everything executed correctly."},{key:"Crowd",val:"Local workers, residents, anyone who values food over atmosphere. Not a tourist destination."}]},{title:"Practical Details",items:[{key:"Hours",val:"Monday to Saturday 7am to 11pm. Closed Sundays."},{key:"Location",val:"In Ibiza Town — close to Can Terra and Es Tap Nou. All three make a natural Ibiza Town food cluster."},{key:"Price",val:"£ — consistently one of the cheapest proper restaurants in town."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ08pzirlGmRIRtFpC9Az8kPE"},
{id:"e-elzaguan",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"El Zaguán",sub:"Ibiza Town · 6pm–11:30pm · Closed Tue and Wed",badge:null,pills:[{t:"£",c:"price"},{t:"Basque pintxos",c:"info"},{t:"Open Mon Sep 7",c:"free"}],desc:"Basque-style pintxos bar near Vara de Rey in Ibiza Town — one of the most highly rated value restaurants in the old town area. Cold pintxos displayed on the bar at under €2 each, hot tapas brought round from the kitchen. 4.5 stars from 1,700+ reviews.",sections:[{title:"How It Works",items:[{key:"The bar display",val:"Cold pintxos displayed along the bar on plates. Pick what takes your interest — bread-based toppings with smoked salmon, cheese, anchovy, crab, cured meats, roasted pepper and more. Each piece under €2."},{key:"Hot pintxos",val:"Servers circulate with plates of freshly grilled hot tapas. These rotate and change — grab them as they come by."},{key:"At the end",val:"Sticks are counted to calculate the bill. Order drinks as you go."}]},{title:"Practical Details",items:[{key:"Open Monday September 7",val:"Perfect for the Ibiza Town day. Closed Tuesdays and Wednesdays."},{key:"Hours",val:"6pm to 11:30pm on open days."},{key:"Best approach",val:"Arrive at 6pm to get the full fresh selection. Pair with La Bodega or Las Dalias afterwards."},{key:"Price",val:"£ — budget £15-20 per person for a full meal of pintxos. Outstanding value."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJu_CUIrpGmRIRlXaxygdZOmg"},
{id:"e-estapnou",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Es Tap Nou",sub:"Ibiza Town · Mon–Fri 8am–8:30pm · Sat 8am–3pm · Closed Sun",badge:null,pills:[{t:"£",c:"price"},{t:"Breakfast/lunch only",c:"info"},{t:"Very cheap",c:"free"}],desc:"Half fruit shop, half cafe — an Ibiza Town institution for over 30 years. The front room is a working greengrocer overflowing with island-grown produce. Step inside for freshly pressed juices, tomato bread, bocadillos and salads. Mostly only locals. Around €8 for a salad.",sections:[{title:"What to Order",items:[{key:"Fresh juices",val:"Made to order from the fruit in the shop. Orange, apple, carrot, ginger, combinations. The point of the place."},{key:"Tomato bread (pa amb oli)",val:"The Mallorcan and Ibizan staple — good bread rubbed with ripe tomato and olive oil. Topped with cheese or jambon."},{key:"Salads",val:"Fresh, generous, good quality ingredients from the shop. Around €8."}]},{title:"Practical Details",items:[{key:"Hours",val:"Monday to Friday 8am to 8:30pm. Saturday 8am to 3pm. Closed Sundays."},{key:"Best for",val:"Breakfast or lunch on the Ibiza Town day before heading up to Dalt Vila."},{key:"The rush",val:"Do not go in a rush. The staff work flat out but it is always busy and service is unhurried. Budget extra time."},{key:"Location",val:"Ibiza Town near Vara de Rey — on the same street cluster as Can Terra and El Zaguan."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJA-cctbtGmRIRBPnVANZICEE"},
{id:"e-canterra",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Can Terra",sub:"Ibiza Town · Daily 8:30am–2am",badge:null,pills:[{t:"£",c:"price"},{t:"Under €2 pintxos",c:"free"},{t:"Open late",c:"time"}],desc:"Pintxos bar near Vara de Rey with a courtyard garden at the back — the best value dining in Ibiza Town. Pintxos displayed on the bar at under €2 each. 4.3 stars from 2,600+ reviews. "I go here every time I come to Ibiza and it has never ever disappointed."",sections:[{title:"What to Order",items:[{key:"The pintxos at the bar",val:"Self-service from the long bar display. Pick what you want, track what you take. Under €2 per piece — extraordinary value in Ibiza Town."},{key:"The courtyard",val:"After the bar pintxos, find a table in the garden for mains — steak, grilled prawns, squid. Portions are large."},{key:"What to avoid",val:"The full a la carte menu is good but more expensive. The bar pintxos are the reason to come."}]},{title:"Practical Details",items:[{key:"Hours",val:"8:30am to 2am daily — one of the few places that stays open this late at a decent price."},{key:"Location",val:"Near Vara de Rey in Ibiza Town. Essentially the same street cluster as Es Tap Nou and El Zaguan."},{key:"Price",val:"£ per person for a proper fill of pintxos. Outstanding value."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJNc-Ea7lGmRIR-ZGsnVY_X_M"},
{id:"e-monkey",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Monkey",sub:"Sant Antoni · From 1pm",badge:null,pills:[{t:"£££",c:"price"},{t:"Sunset views",c:"info"},{t:"Mediterranean",c:"info"}],desc:"Mediterranean restaurant and wine bar in Sant Antoni with good sunset views and consistently excellent reviews — 4.7 stars from nearly 2,000 visits. Elegant but genuinely relaxed. The kind of place where a meal drifts naturally into drinks without planning it.",sections:[{title:"What to Expect",items:[{key:"Food",val:"Mediterranean menu with well-executed classics. Fish and seafood, good pasta, meat options. Quality ingredients, confident cooking."},{key:"Wine bar",val:"A well-considered wine list extends the evening naturally. Good by-the-glass selection."},{key:"Atmosphere",val:"Elegant without being stiff. The crowd is mixed age and the service is professional but warm."}]},{title:"Practical Details",items:[{key:"Hours",val:"From 1pm daily."},{key:"Location",val:"Sant Antoni — 15 minutes from the villa. Good positioning relative to the sunset strip."},{key:"Price",val:"£££ — higher end for casual dining but the quality justifies it. Budget €35-50 per head."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJB37hZQQ3mRIRRtLqlsoEsLc"},
{id:"e-rinconpepe",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"El Rincon de Pepe",sub:"Sant Antoni · Daily 1pm–11:30pm",badge:{t:"Since 1962",c:"g"},pills:[{t:"££",c:"price"},{t:"Since 1962",c:"free"},{t:"Village patio",c:"info"}],desc:"One of Sant Antonions oldest restaurants — built in the patio of an old house under an enormous grapevine, unchanged since it opened in 1962 despite mass tourism erupting all around it. A quiet side street off the Fountains Square. "I have known El Rincon de Pepe for 30 years and every time I go to Ibiza I am there."",sections:[{title:"What to Order",items:[{key:"Ibiza-style octopus (frita de polp)",val:"The island speciality — fried octopus with potatoes and vegetables. One of the definitive Ibizan dishes."},{key:"Grilled cuttlefish",val:"Fresh, simply prepared, excellent with alioli."},{key:"Escalivada",val:"Roasted aubergine and peppers — a perfect accompaniment."},{key:"Anchovies in vinegar",val:"A classic starter. Order a selection of tapas and share."}]},{title:"Practical Details",items:[{key:"Setting",val:"A patio inside an old building with the grapevine growing overhead. Completely sheltered and atmospheric."},{key:"Hours",val:"1pm to 11:30pm daily."},{key:"Location",val:"Off the Fountains Square (Plaza de la Constitucion) in Sant Antoni. 15 minutes from the villa."},{key:"Price",val:"££ — reasonable for the quality."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ6W99A-JJmRIRc4F9WQ1y1sI"},
{id:"e-bamboo",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Bamboo",sub:"Sant Antoni · Closed Tue",badge:null,pills:[{t:"££",c:"price"},{t:"Tiki bar",c:"info"},{t:"Away from the strip",c:"free"}],desc:"Chilled tiki cocktail bar in Sant Antoni tucked well away from the West End circuit. Reviewers consistently go back every day of their holiday. Reasonably priced. Good for food and drinks in town without the surrounding chaos.",sections:[{title:"What to Expect",items:[{key:"Vibe",val:"Relaxed, tropical, social. The antithesis of the West End. Comfortable seating, good music at a volume you can talk over."},{key:"Cocktails",val:"The reason to come. A proper cocktail menu with skill behind the bar. The staff are friendly and engaged."},{key:"Food",val:"Bar food done well. Not a restaurant but enough to eat and stay."}]},{title:"Practical Details",items:[{key:"Closed",val:"Tuesdays."},{key:"Location",val:"Sant Antoni, away from the main tourist strip. 15 minutes from the villa."},{key:"Price",val:"££ — reasonable for Ibiza. One of the better value cocktail bars on the island."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJP94DnwM2mRIRrVh4XG9s8eA"},
{id:"e-royalty",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Restaurant Royalty",sub:"Santa Eulalia main square · Daily 8am–midnight",badge:null,pills:[{t:"££",c:"price"},{t:"Since 1933",c:"free"},{t:"Main square terrace",c:"info"}],desc:"Santa Eulalias longest-standing restaurant, on the corner of the main square since 1933. Best experienced for breakfast or menú del dia on the terrace. Some regulars go three times a day — breakfast, afternoon coffee, dinner. An anchor of the Santa Eulalia day.",sections:[{title:"Best For",items:[{key:"Breakfast",val:"Coffee, fresh orange juice, pastries or toast. The terrace on the square in the morning is a lovely way to start a Santa Eulalia day."},{key:"Menú del día",val:"Three courses plus drink at lunch — good value and consistent."},{key:"Fried octopus (frita de polp)",val:"The standout dish — order it."},{key:"What to avoid",val:"The full a la carte in the evening has more mixed reviews. Stick to simpler dishes."}]},{title:"Practical Details",items:[{key:"Hours",val:"8am to midnight daily — one of the most accessible restaurants on the island."},{key:"Location",val:"Corner of the main square (Plaza del Ayuntamiento) in Santa Eulalia. 30 minutes from the villa."},{key:"Combine with",val:"Ca na Ribes for dinner — together they make the Santa Eulalia day anchor."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJAZE-V7dGmRIRILxgXrsVIJ0"},
{id:"e-canaribes",ico:"ti-tools-kitchen-2",col:"ico-am",nm:"Ca na Ribes",sub:"Santa Eulalia · Lunch 1–3:30pm · Dinner 7–11:30pm · Closed Sun",badge:{t:"Since 1926",c:"g"},pills:[{t:"££",c:"price"},{t:"Since 1926",c:"free"},{t:"Courtyard garden",c:"info"},{t:"Book ahead",c:"warn"}],desc:"The oldest restaurant on the island — same courtyard since 1926, now run by the fourth generation of the founding family. A beautiful interior garden with terracotta tiles, climbing vine and a fountain. Traditional Ibizan cuisine. The paella here has its own reputation: "I went twice in one week. Hands down the best I have ever tasted."",sections:[{title:"What to Order",items:[{key:"Paella",val:"The signature and the reason multiple reviewers come back twice in one stay. Both seafood and chicken paella are excellent. Order it as the main event."},{key:"Baked fish",val:"The other strong suit — baked fish with herbs, local style."},{key:"Starters",val:"Good selection of traditional Ibizan starters. The frita de polp (fried octopus) is excellent here."},{key:"Black rice",val:"If available, the arros negre (black rice with squid ink) is worth ordering."}]},{title:"Practical Details",items:[{key:"Hours",val:"Lunch 1pm to 3:30pm. Dinner 7pm to 11:30pm. Closed Sundays."},{key:"Location",val:"In Santa Eulalia, 30 metres from Restaurant Royalty — two of the oldest restaurants on the island on the same street."},{key:"Reservations",val:"Recommended — particularly for dinner. Phone ahead or book on arrival in town."},{key:"Cost",val:"Around €30-40 per head for a full meal. Good value for the quality and history."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJaewNKU8VmRIRHD36zfiMGcw"}];

const WALKS=[{id:"w-puntagalera",ico:"ti-route",col:"ico-gn",nm:"Punta Galera",sub:"20 mins from villa",badge:null,pills:[{t:"~2km",c:"info"},{t:"Easy",c:"free"},{t:"Afternoon/sunset",c:"time"}],desc:"The closest walk to the villa and a perfect introduction to the island. A short coastal path leads to a flat stone plateau descending into crystal clear water — the geology is entirely unlike anything else in Ibiza. Very popular with locals, almost invisible to tourists.",sections:[{title:"The Walk",items:[{key:"Route",val:"Start from the car park at Cala Salada. A well-marked path follows the coast north for approximately 1km to reach the stone platform. The path continues beyond but the platform is the destination."},{key:"The geology",val:"Flat limestone terraces descend in steps into the sea. Natural swimming pools form in the hollows. The rock formations are visually extraordinary."},{key:"Swimming",val:"Crystal clear, calm water in most conditions. The pools formed in the rock hollows are sheltered even when there is some swell."}]},{title:"Practical Details",items:[{key:"Best time",val:"Late afternoon for swimming, then stay for sunset. The light on the stone platform at golden hour is extraordinary."},{key:"What to bring",val:"Towels, water shoes or sandals for the rocks, plenty of water, snacks."},{key:"Getting there",val:"20 minutes from the villa. Park at Cala Salada and walk — the path is well-signed."},{key:"Difficulty",val:"Easy. No significant climbing. Suitable for all fitness levels."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ-QZYi3Q2mRIRc_lCgzzCtfw"},
{id:"w-calabassa",ico:"ti-route",col:"ico-gn",nm:"Cala Bassa — Torre d'en Rovira loop",sub:"20 mins from villa",badge:null,pills:[{t:"6.8km",c:"info"},{t:"Easy",c:"free"},{t:"Morning",c:"time"}],desc:"A circular coastal route linking three unspoiled beaches via a historic watchtower, with panoramic views across the sea toward the islets of Conillera. One of the most satisfying walks near the villa — varied, scenic and ending with a swim.",sections:[{title:"The Route",items:[{key:"Overview",val:"Start at Cala Bassa beach. The path climbs gently to Torre den Rovira watchtower, a 16th-century defensive tower with views across the entire western coast. The route then drops to connect Cala Conta and returns."},{key:"The watchtower",val:"Built to watch for Barbary pirates. The views from the top take in Conillera island, the western coast of Ibiza, and on clear days toward the Spanish mainland."},{key:"The beaches",val:"Three distinct beaches along the route, each with good swimming. Cala Conta at the far end is considered one of the most beautiful beaches on the island."}]},{title:"Practical Details",items:[{key:"Distance and time",val:"6.8km circular, approximately 2 hours at a comfortable pace without swimming stops."},{key:"Best time",val:"Morning before the heat. Start by 9am in September."},{key:"Transport",val:"In summer buses run between Cala Bassa and Sant Antoni — can be done one-way if preferred."},{key:"What to bring",val:"Plenty of water, swimming things, snacks. No shade on the upper sections."},{key:"Difficulty",val:"Easy on well-maintained paths. Some rocky sections near the tower."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJBxfkK45KmRIRxSB6XOTHhik"},
{id:"w-caladhort",ico:"ti-route",col:"ico-gn",nm:"Cala d'Hort clifftop walk",sub:"30 mins from villa",badge:null,pills:[{t:"~3km",c:"info"},{t:"Easy–Moderate",c:"time"},{t:"Late afternoon",c:"time"}],desc:"Walk the cliff paths above Cala d'Hort looking directly at Es Vedra rising from the sea — the island's most dramatic natural sight. The light in late afternoon turns everything golden. Descend to the beach restaurant for dinner as the sun drops behind the rock.",sections:[{title:"The Walk",items:[{key:"Es Vedra",val:"A 382-metre rocky island rising dramatically from the sea, uninhabited and protected. Various legends attach to it. Viewing it from the cliff paths above Cala d'Hort is the best possible vantage point."},{key:"Route",val:"Park at Cala d'Hort and take the path that climbs the cliffs to the left. The path follows the cliff edge with continuous views of Es Vedra. The Puig des Savinar watchtower is the main objective — about 1.5km from the start."},{key:"The descent",val:"Return to Cala d'Hort beach for the end of the evening."}]},{title:"Practical Details",items:[{key:"Best time",val:"Late afternoon into sunset. The sun sets directly behind Es Vedra in September which is spectacular."},{key:"After the walk",val:"The restaurant at Cala d'Hort beach has front-row views of Es Vedra. Perfect for dinner after the walk."},{key:"Difficulty",val:"Easy to moderate. Some rocky sections. Sturdy sandals minimum, trainers better."},{key:"What to bring",val:"Water, camera. The sunset view deserves it."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJs7iAo69MmRIRJJzqAkHqgeQ"},
{id:"w-satalaia",ico:"ti-route",col:"ico-gn",nm:"Sa Talaia — Ibiza's highest point",sub:"30 mins · Sant Josep",badge:null,pills:[{t:"5.5km",c:"info"},{t:"Moderate",c:"time"},{t:"Before 9am essential",c:"warn"}],desc:"Ibiza's highest point at 487 metres. On a clear September morning you can see the whole island, across to Formentera, and in ideal conditions the Spanish mainland. Little shade above the treeline — start before 9am or the heat makes it miserable.",sections:[{title:"The Ascent",items:[{key:"Route",val:"Start from the car park near Sant Josep village. The path is well-marked. The lower section goes through pine forest with shade. Above the tree line it is exposed."},{key:"The views from the top",val:"The entire island laid out beneath you. The south coast, Formentera across the water, the interior with its white fincas, the north coast. One of those perspectives that makes you understand a place differently."},{key:"Duration",val:"Approximately 1.5 hours up, 1 hour down. Total circuit around 2.5-3 hours."}]},{title:"Practical Details",items:[{key:"Start time",val:"Leave no later than 8am in September. The summit before 10am is the target."},{key:"Water",val:"Carry significantly more than you think you need. 2 litres per person minimum."},{key:"Footwear",val:"Light hiking shoes or good trainers. The path is rocky in sections."},{key:"Getting there",val:"Park in Sant Josep village. The trailhead is well-signed."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJZ3geSulLmRIRV0POn2sxJt0"},
{id:"w-santmiquel",ico:"ti-route",col:"ico-gn",nm:"Port de Sant Miquel coastal circuit",sub:"North · 45 mins from villa",badge:null,pills:[{t:"~10km",c:"info"},{t:"Moderate",c:"time"},{t:"Morning",c:"time"}],desc:"The best coastal walk in the north of the island. A circular route from Port Sant Miquel beach to a hidden cove, a watchtower with panoramic views, and a beach bar at the far end. About 3 hours at a comfortable pace. Varied, beautiful and entirely off the tourist radar.",sections:[{title:"The Route",items:[{key:"Overview",val:"Start at Port Sant Miquel beach. The path climbs through pine forest to Torre des Molar watchtower, then drops steeply to the hidden cove of Calo des Moltons — small, crystal clear, almost always empty. Continue along the coast to Cala den Ferrer where there is a beach bar."},{key:"Calo des Moltons",val:"The jewel of this walk — a tiny hidden cove accessible only on foot. The swimming is excellent. Most people who walk past this point miss it entirely."},{key:"The beach bar",val:"Cala den Ferrer has a simple beach bar. A cold drink after 3 hours of walking is well-earned."}]},{title:"Practical Details",items:[{key:"Distance and time",val:"Approximately 10km, 3 hours without swim stops. Allow 4 hours for a comfortable day."},{key:"Best time",val:"Start by 9am. The morning light is beautiful and you beat the heat."},{key:"Combine with",val:"Lunch in Sant Joan de Labritja on the way home — 20 minutes from Port Sant Miquel."},{key:"Difficulty",val:"Moderate. Some steep sections, particularly the descent to Calo des Moltons. Good footwear essential."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJz1FnV_Q7mRIRFapnGw_lb7M"},
{id:"w-portixol",ico:"ti-route",col:"ico-gn",nm:"Es Portixol — hidden cove",sub:"North",badge:null,pills:[{t:"2.5km each way",c:"info"},{t:"Moderate",c:"time"},{t:"Early morning",c:"time"}],desc:"A 2.5km walk down a rocky path to one of the most pristine and least-visited beaches in Ibiza. Old boat houses, crystal water, almost always empty. The walk back up is the hard part. The reward for the effort is significant.",sections:[{title:"The Walk",items:[{key:"What you find",val:"A small, perfectly enclosed bay with a cluster of traditional fishermen's boat houses on one side. Crystal clear water. Almost no visitors on any normal day."},{key:"The path",val:"Rocky and in places steep. This is why so few people make it. Good shoes are essential — not sandals or flip flops."},{key:"The return",val:"Walking back up is harder than coming down. Budget more time and energy for the return."}]},{title:"Practical Details",items:[{key:"Best time",val:"Very early morning before the heat builds. Start by 8am. The walk down takes 45 minutes."},{key:"What to bring",val:"Plenty of water (there is none at the beach), snacks, good shoes, swimming things."},{key:"Getting there",val:"Park near the Illa Blanca residential area in the north of the island. The path begins there."},{key:"Return time",val:"Total round trip 3-4 hours including a swim and rest at the bottom."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJh-aNxzE6mRIRkmLAku82R2U"},
{id:"w-xarraca",ico:"ti-route",col:"ico-gn",nm:"Cala Xarraca",sub:"North · Near Portinatx",badge:null,pills:[{t:"Short walk",c:"info"},{t:"Easy",c:"free"},{t:"Any time",c:"time"}],desc:"A beautiful sheltered northern cove with something genuinely unusual — a natural mud bath in a crevice to the left of the bay. The reddish clay emerges from the cliff, people cover themselves in it, then wash off in the sea. Crystal clear water. Quiet.",sections:[{title:"The Experience",items:[{key:"The mud bath",val:"Found in a crevice to the left when facing the sea. The reddish clay is supposed to be therapeutic. An experience entirely unique to this beach."},{key:"The swimming",val:"The cove is sheltered and the water is exceptionally clear even by Ibiza standards. Good for snorkelling."},{key:"Extension",val:"From Cala Xarraca you can continue east along the coast toward Es Calo de s'Illa, revealing isolated coves hidden between the cliffs. Adds 2-3km."}]},{title:"Practical Details",items:[{key:"Best time",val:"Any time — though morning before the sun hits the cliffs is particularly atmospheric."},{key:"Getting there",val:"Follow signs to Portinatx and then to Cala Xarraca. Small car park at the beach."},{key:"Difficulty",val:"Easy — short walk from the car park to the beach."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ-ZREWqE9mRIRJI9KyDMTKi8"},
{id:"w-moscarter",ico:"ti-route",col:"ico-gn",nm:"Punta Moscarter lighthouse",sub:"Portinatx · North",badge:null,pills:[{t:"7.5km circular",c:"info"},{t:"Moderate",c:"time"},{t:"Morning",c:"time"}],desc:"A circular clifftop walk through the wildest part of the island to the Punta Moscarter lighthouse — the northernmost point of Ibiza. Wind-sculpted pines, dramatic coastline and sea views that feel entirely remote. A hidden crystal cove lies beyond the lighthouse if you push on.",sections:[{title:"The Walk",items:[{key:"The lighthouse",val:"Punta Moscarter is the northernmost tip of Ibiza. The lighthouse has been here since 1857. The views from the point back across the island and toward Menorca on a clear day are exceptional."},{key:"The hidden cove",val:"Push past the lighthouse along the path for another 20 minutes and you reach a crystal clear cove accessible only on foot. Worth the extra effort."},{key:"The landscape",val:"Wild, scrubby, windswept. Pine and juniper shaped by the north wind. Nothing like the south coast."}]},{title:"Practical Details",items:[{key:"Start point",val:"Portinatx village car park. The trail is marked."},{key:"Duration",val:"7.5km circular, approximately 2.5-3 hours."},{key:"Combine with",val:"Lunch in Sant Joan de Labritja, 45 minutes from Portinatx. One of the best north day combinations."},{key:"Difficulty",val:"Moderate. Exposed in sections with no shade. Start early."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJRb83Y8QXmRIRb0ctShahQro"},
{id:"w-caladserra",ico:"ti-route",col:"ico-gn",nm:"Cala d'en Serra from Portinatx",sub:"North",badge:null,pills:[{t:"~4km",c:"info"},{t:"Moderate",c:"time"},{t:"Afternoon",c:"time"}],desc:"Walk from Portinatx along wild northern coastline to a beautiful cove alongside the ruins of an abandoned hotel started in 1969 and never finished — now entirely covered in murals and street art by local and international artists. Small bar, no phone signal. Genuinely unusual.",sections:[{title:"The Destination",items:[{key:"The abandoned hotel",val:"Construction began in 1969 but was never completed. The concrete skeleton has been entirely painted over the years by local and visiting artists. The result is one of the most unusual art installations in the Balearics."},{key:"The cove",val:"A beautiful curved bay with clear water. The combination of natural beauty and the strange painted ruins is genuinely memorable."},{key:"The bar",val:"A small simple bar serves drinks and basic food. Cash only. No signal."}]},{title:"Practical Details",items:[{key:"Route",val:"Start at Portinatx beach and follow the coastal path east. About 2km to reach Cala den Serra."},{key:"Best approach",val:"Walk there, swim, have a drink at the bar, walk back. Allow 3-4 hours."},{key:"Timing",val:"Afternoon — the ruins are best photographed with afternoon light on them."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ9eX_2MsXmRIRaGA213OLU1E"},
{id:"w-sessalines",ico:"ti-route",col:"ico-gn",nm:"Ses Salines natural park",sub:"South · 35 mins from villa",badge:null,pills:[{t:"Variable",c:"info"},{t:"Easy",c:"free"},{t:"Any time",c:"time"}],desc:"UNESCO-protected salt flats, dunes and pine forest on the southern tip of the island. A completely different landscape from anywhere else in Ibiza — wide, flat and open. Flamingos are possible in September. Close to the airport, making it an ideal last-morning option.",sections:[{title:"What to See",items:[{key:"The salt pans",val:"Active salt production since Phoenician times. The pink and white crystalline flats are visually striking, particularly in morning light."},{key:"Wildlife",val:"Flamingos are possible in September as they congregate before winter migration. Various wading birds and raptors throughout the year. Bring binoculars if you have them."},{key:"The dunes and forest",val:"Pine forest behind the beach at es Cavallet. The transition from salt flats to dune to forest to sea is compressed into a very short distance."}]},{title:"Practical Details",items:[{key:"Best for",val:"A last morning walk before the airport — 5 minutes from the runway. Can be done in 1-2 hours."},{key:"Combine with",val:"Experimental Beach (es Cavallet side) for a final sundowner if leaving in the evening."},{key:"Access",val:"Several entry points from the road. Free to enter the park."},{key:"Distance from villa",val:"35 minutes south."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJa9fB0nNFmRIRIy2Yk7wr0H0"}];

const SHOPS=[{id:"s-lidl",ico:"ti-shopping-bag",col:"ico-gy",nm:"Lidl Sant Antoni",hrs:"Daily 9am–10pm",badge:{t:"Best prices",c:"g"},pills:[{t:"Daily 9am–10pm",c:"time"},{t:"15 mins from villa",c:"info"}],desc:"Best prices on the island. Open every day including Sundays until 10pm — later than any other supermarket. 15 minutes from the villa. Reviewers describe it as the best Lidl in the world, which sets expectations correctly.",sections:[{title:"What to Buy",items:[{key:"Fresh produce",val:"Good quality fruit, vegetables and salads at Lidl prices. The fresh herbs and local tomatoes are particularly good."},{key:"Meat and fish",val:"Well-stocked fresh counter. Good for villa cooking."},{key:"Spanish staples",val:"Excellent selection of Iberian ham, cheeses, olive oil and wines at Lidl prices — a fraction of restaurant costs."},{key:"Alcohol",val:"Full selection. Note: no alcohol sold in Sant Antoni shops after 9:30pm regardless of opening hours."}]},{title:"Practical Details",items:[{key:"Hours",val:"9am to 10pm daily including Sundays — the latest supermarket on the island."},{key:"Location",val:"On the main road into Sant Antoni. 15 minutes from the villa."},{key:"Villa shop",val:"This is the main weekly shop. Do a large run on arrival and top up through the week."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJHeEtjj82mRIREGKdNjAezOE"},
{id:"s-hiper",ico:"ti-shopping-bag",col:"ico-gy",nm:"Hiper Centro",hrs:"Mon–Sat 9am–9:30pm · Sun 9am–2:30pm",badge:null,pills:[{t:"Mon–Sat 9am–9:30pm",c:"time"},{t:"Best quality",c:"info"},{t:"On your route",c:"free"}],desc:"On the Ibiza-Sant Antoni road — your main route — so you pass it constantly. A large hypermarket with a fish counter, meat and deli counter, and a wine bodega. Reviewers compare it to Waitrose in quality. The best option when you want good ingredients.",sections:[{title:"What to Buy",items:[{key:"Fish counter",val:"Fresh fish from local waters. Good selection, knowledgeable staff."},{key:"Meat and deli",val:"Excellent cured meats, cheeses and prepared foods. The butcher counter has good quality cuts."},{key:"Wine bodega",val:"A well-stocked wine section with local Ibizan wines alongside Spanish and international selections. Good prices for the quality."}]},{title:"Practical Details",items:[{key:"Hours",val:"Monday to Saturday 9am to 9:30pm. Sunday 9am to 2:30pm — note the early Sunday close."},{key:"Location",val:"Directly on the Ibiza-Sant Antoni road (your main route). You will drive past it multiple times."},{key:"Best for",val:"A proper quality shop when you want to cook something good at the villa."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ4cpEkeJGmRIRI9av03ZyklA"},
{id:"s-spar",ico:"ti-shopping-bag",col:"ico-gy",nm:"SPAR San Rafael",hrs:"Daily 8:30am–9pm",badge:null,pills:[{t:"Daily 8:30am–9pm",c:"time"},{t:"5 mins from villa",c:"free"},{t:"Top-ups",c:"info"}],desc:"5 minutes from the villa in San Rafael village. Limited range but perfect for top-ups — bread, milk, basics, cold drinks. Your nearest shop by far. Good sandwiches from the meat counter.",sections:[{title:"Practical Details",items:[{key:"Hours",val:"Daily 8:30am to 9pm."},{key:"Best for",val:"Quick top-ups. Bread, milk, basics, cold drinks. Not a full weekly shop."},{key:"Sandwiches",val:"The person at the meat counter makes good bocadillos on request."},{key:"Distance",val:"5 minutes from the villa — your closest option for anything forgotten."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJdeN8oZlHmRIRtTiNrLUOhRs"},
{id:"s-proxim",ico:"ti-shopping-bag",col:"ico-gy",nm:"Proxim Sant Antoni",hrs:"Daily until midnight",badge:null,pills:[{t:"Until midnight",c:"time"},{t:"Good prices",c:"free"},{t:"Note: no alcohol 9:30pm+",c:"warn"}],desc:"Good prices, fresh bread, decent alcohol selection. The midnight closing makes it useful when you realise at 11pm you are out of something. Important: no alcohol sold after 9:30pm anywhere in Sant Antoni regardless of shop opening hours.",sections:[{title:"Practical Details",items:[{key:"Hours",val:"Daily until midnight."},{key:"Alcohol rule",val:"No alcohol sold after 9:30pm in Sant Antoni. The shop stays open until midnight but alcohol purchases must be made before 9:30pm."},{key:"Fresh bread",val:"Good fresh bread available until late."},{key:"Location",val:"Sant Antoni. 15 minutes from the villa."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJFTs3SwM2mRIRbvx2yawVH1Q"}];
