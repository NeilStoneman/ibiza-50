38.9851154,lng:1.2965721,ico:"ti-route",col:"ico-gn",nm:"Caló des Moro — Capella de sa Talaia loop",sub:"Sant Antoni",badge:null,distKm:7.6,diff:"Moderate",pills:[{t:"Circular",c:"genre"},{t:"7.6km",c:"info"},{t:"Moderate",c:"warn"},{t:"Morning",c:"time"}],desc:"A loop around the western edge of Sant Antoni starting at the Caló des Moro car park — a hillside chapel, an old lime kiln, and a stretch of coastline most visitors to the town never see. Ends back near the sunset strip.",sections:[{title:"The Route",items:[{key:"Overview",val:"Start at the Caló des Moro car park. The path climbs past the Forn de Calç (an old lime kiln) to the Capella de sa Talaia, a small hillside chapel with views back over Sant Antoni bay. The return leg threads through residential streets before rejoining the coast."},{key:"The chapel",val:"Capella de sa Talaia sits above the town — a quiet, unshowy spot with one of the better panoramic views of the bay, away from the sunset-strip crowds."},{key:"The coast",val:"The final stretch runs along the Mediterranean shoreline back toward Caló des Moro, past Cala Grassio."}]},{title:"Practical Details",items:[{key:"Distance and time",val:"7.6km circular, approximately 2–2.5 hours at a comfortable pace."},{key:"Best time",val:"Morning before the heat — much of the route is exposed."},{key:"Combine with",val:"Sant Antoni sunset strip is a short drive away — a natural end to the day."},{key:"Difficulty",val:"Moderate. Some rocky, scrambling sections. Good grip footwear recommended."}]}],note:null,maps:"https://www.google.com/maps?cid=5538497272468982021",alltrails:"https://www.alltrails.com/trail/spain/ibiza/calo-des-moro-capella-de-sa-talaia-cala-grassio"},{id:"w-puntagalera",lat:39.0095208,lng:1.2956091,distKm:2,diff:"Easy",ico:"ti-route",col:"ico-gn",nm:"Punta Galera",sub:"20 mins from villa",badge:null,pills:[{t:"Out & back",c:"genre"},{t:"~2km",c:"info"},{t:"Easy",c:"free"},{t:"Afternoon/sunset",c:"time"}],desc:"The closest walk to the villa and a perfect introduction to the island. A short coastal path leads to a flat stone plateau descending into crystal clear water — the geology is entirely unlike anything else in Ibiza. Very popular with locals, almost invisible to tourists.",sections:[{title:"The Walk",items:[{key:"Route",val:"Start from the car park at Cala Salada. A well-marked path follows the coast north for approximately 1km to reach the stone platform. The path continues beyond but the platform is the destination."},{key:"The geology",val:"Flat limestone terraces descend in steps into the sea. Natural swimming pools form in the hollows. The rock formations are visually extraordinary."},{key:"Swimming",val:"Crystal clear, calm water in most conditions. The pools formed in the rock hollows are sheltered even when there is some swell."}]},{title:"Practical Details",items:[{key:"Best time",val:"Late afternoon for swimming, then stay for sunset. The light on the stone platform at golden hour is extraordinary."},{key:"What to bring",val:"Towels, water shoes or sandals for the rocks, plenty of water, snacks."},{key:"Getting there",val:"20 minutes from the villa. Park at Cala Salada and walk — the path is well-signed."},{key:"Difficulty",val:"Easy. No significant climbing. Suitable for all fitness levels."}]}],note:null,maps:"https://www.google.com/maps?cid=5611576306000616971",alltrails:"https://www.alltrails.com/trail/spain/ibiza/cala-gracio-cap-negret-punta-sa-galera-cala-llosar"},,{id:"w-caladhort",lat:38.8902227,lng:1.2242623,distKm:0,diff:"Easy",ico:"ti-route",col:"ico-gn",nm:"Cala d'Hort — Es Vedrà views",sub:"30 mins from villa",badge:{t:"Access changing",c:"w"},pills:[{t:"No hike required",c:"free"},{t:"Access changing",c:"warn"},{t:"Late afternoon",c:"time"}],desc:"Look directly at Es Vedra rising from the sea from Cala d'Hort beach — the island's most dramatic natural sight. The old clifftop route to the Puig des Savinar watchtower is permanently closed, and the newer viewpoint above the beach has had its own access disputes, so the beach itself is now the reliable option — no hiking needed.",sections:[{title:"Es Vedrà & Access",items:[{key:"Es Vedra",val:"A 382-metre rocky island rising dramatically from the sea, uninhabited and protected. Various legends attach to it."},{key:"The old route is closed",val:"The clifftop path to the Puig des Savinar watchtower — long the classic route — has been fenced off and permanently closed since February 2025, after landowners blocked access in response to overcrowding, litter and unauthorised parties. Do not attempt this route."},{key:"The newer viewpoint is unreliable",val:"An official viewing platform and 200+ space car park opened above the beach in 2025, but the car park itself closed again in June 2026 amid a dispute between the owner and the local authority. Status may have changed again by September — worth a quick check locally before planning around it."},{key:"The reliable option",val:"Cala d'Hort beach itself always has an unobstructed view of Es Vedra and is unaffected by the disputes above. The beachfront restaurants have front-row seats for sunset."}]},{title:"Practical Details",items:[{key:"Best time",val:"Late afternoon into sunset. The sun sets directly behind Es Vedra in September which is spectacular."},{key:"Dinner",val:"The restaurant at Cala d'Hort beach has front-row views of Es Vedra. No walk required — just arrive for sunset and stay for dinner."},{key:"If you want an actual walk",val:"El Ojo de Es Vedrà is a short, separate 1km trail near Sant Josep de sa Talaia with its own viewpoint — a different access point from Cala d'Hort beach, currently open (see AllTrails link)."},{key:"What to bring",val:"Water, camera. The sunset view deserves it."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJs7iAo69MmRIRJJzqAkHqgeQ",alltrails:"https://www.alltrails.com/trail/spain/ibiza/el-ojo-de-es-vedra"},,{id:"w-santmiquel",lat:39.0803648,lng:1.440354,distKm:4,diff:"Moderate",ico:"ti-route",col:"ico-gn",nm:"Port de Sant Miquel coastal circuit",sub:"North · 45 mins from villa",badge:null,pills:[{t:"Circular",c:"genre"},{t:"~4km",c:"info"},{t:"Moderate",c:"warn"},{t:"Morning",c:"time"}],desc:"The best coastal walk in the north of the island. A loop route from Port Sant Miquel beach to a hidden cove, a watchtower with panoramic views, and a beach bar at the far end. The walking itself takes about an hour to 90 minutes — allow longer for swim stops. Varied, beautiful and entirely off the tourist radar.",sections:[{title:"The Route",items:[{key:"Overview",val:"Start at Port Sant Miquel beach. The path climbs through pine forest to Torre des Molar watchtower, then drops steeply to the hidden cove of Calo des Moltons — small, crystal clear, almost always empty. Continue along the coast to Cala den Ferrer where there is a beach bar."},{key:"Calo des Moltons",val:"The jewel of this walk — a tiny hidden cove accessible only on foot. The swimming is excellent. Most people who walk past this point miss it entirely."},{key:"The beach bar",val:"Cala den Ferrer has a simple beach bar. A cold drink at the end is well-earned."}]},{title:"Practical Details",items:[{key:"Distance and time",val:"Approximately 4km, 1–1.5 hours of walking without stops. Allow 2.5–3 hours for a comfortable day with swimming and a drink at the beach bar."},{key:"Best time",val:"Start by 9am. The morning light is beautiful and you beat the heat."},{key:"Combine with",val:"Lunch in Sant Joan de Labritja on the way home — 20 minutes from Port Sant Miquel."},{key:"Difficulty",val:"Moderate. Some steep, rocky sections, particularly the descent to Calo des Moltons. Good footwear essential."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJz1FnV_Q7mRIRFapnGw_lb7M",alltrails:"https://www.alltrails.com/trail/spain/ibiza/cala-sant-miquel-torre-d-es-molar-cala-d-en-ferrer"},,{id:"w-portixol",lat:39.0700874,lng:1.4095188,distKm:5,diff:"Moderate",ico:"ti-route",col:"ico-gn",nm:"Es Portixol — hidden cove",sub:"North",badge:null,pills:[{t:"Out & back",c:"genre"},{t:"2.5km each way",c:"info"},{t:"Moderate",c:"warn"},{t:"Early morning",c:"time"}],desc:"A 2.5km walk down a rocky path to one of the most pristine and least-visited beaches in Ibiza. Old boat houses, crystal water, almost always empty. The walk back up is the hard part. The reward for the effort is significant.",sections:[{title:"The Walk",items:[{key:"What you find",val:"A small, perfectly enclosed bay with a cluster of traditional fishermen's boat houses on one side. Crystal clear water. Almost no visitors on any normal day."},{key:"The path",val:"Rocky and in places steep. This is why so few people make it. Good shoes are essential — not sandals or flip flops."},{key:"The return",val:"Walking back up is harder than coming down. Budget more time and energy for the return."}]},{title:"Practical Details",items:[{key:"Best time",val:"Very early morning before the heat builds. Start by 8am. The walk down takes 45 minutes."},{key:"What to bring",val:"Plenty of water (there is none at the beach), snacks, good shoes, swimming things."},{key:"Getting there",val:"Park near the Illa Blanca residential area in the north of the island. The path begins there."},{key:"Return time",val:"Total round trip 3-4 hours including a swim and rest at the bottom."}]}],note:null,maps:"https://www.google.com/maps?cid=10600257386945872740",alltrails:"https://www.alltrails.com/trail/spain/ibiza/illa-blanca-es-portixol"},,{id:"w-xarraca",lat:39.0983932,lng:1.4973655,distKm:3,diff:"Easy",ico:"ti-route",col:"ico-gn",nm:"Cala Xarraca",sub:"North · Near Portinatx",badge:null,pills:[{t:"Circular",c:"genre"},{t:"~3km",c:"info"},{t:"Easy",c:"free"},{t:"Any time",c:"time"}],desc:"A beautiful sheltered northern cove with something genuinely unusual — a natural mud bath in a crevice to the left of the bay. The reddish clay emerges from the cliff, people cover themselves in it, then wash off in the sea. Crystal clear water. Quiet.",sections:[{title:"The Experience",items:[{key:"The mud bath",val:"Found in a crevice to the left when facing the sea. The reddish clay is supposed to be therapeutic. An experience entirely unique to this beach."},{key:"The swimming",val:"The cove is sheltered and the water is exceptionally clear even by Ibiza standards. Good for snorkelling."},{key:"Extension",val:"From Cala Xarraca you can continue east along the coast toward Es Calo de s'Illa, revealing isolated coves hidden between the cliffs. Adds 2-3km."}]},{title:"Practical Details",items:[{key:"Best time",val:"Any time — though morning before the sun hits the cliffs is particularly atmospheric."},{key:"Getting there",val:"Follow signs to Portinatx and then to Cala Xarraca. Small car park at the beach."},{key:"Difficulty",val:"Easy — short walk from the car park to the beach."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ-ZREWqE9mRIRJI9KyDMTKi8",alltrails:"https://www.alltrails.com/trail/spain/ibiza/punta-de-xarraco"},,{id:"w-sessalines",lat:38.8505813,lng:1.3889324,distKm:4,diff:"Easy",ico:"ti-route",col:"ico-gn",nm:"Ses Salines natural park",sub:"South · 35 mins from villa",badge:null,pills:[{t:"Variable",c:"info"},{t:"Easy",c:"free"},{t:"Any time",c:"time"}],desc:"UNESCO-protected salt flats, dunes and pine forest on the southern tip of the island. A completely different landscape from anywhere else in Ibiza — wide, flat and open. Flamingos are possible in September. Close to the airport, making it an ideal last-morning option.",sections:[{title:"What to See",items:[{key:"The salt pans",val:"Active salt production since Phoenician times. The pink and white crystalline flats are visually striking, particularly in morning light."},{key:"Wildlife",val:"Flamingos are possible in September as they congregate before winter migration. Various wading birds and raptors throughout the year. Bring binoculars if you have them."},{key:"The dunes and forest",val:"Pine forest behind the beach at es Cavallet. The transition from salt flats to dune to forest to sea is compressed into a very short distance."}]},{title:"Practical Details",items:[{key:"Best for",val:"A last morning walk before the airport — 5 minutes from the runway. Can be done in 1-2 hours."},{key:"Combine with",val:"Experimental Beach (es Cavallet side) for a final sundowner if leaving in the evening."},{key:"Access",val:"Several entry points from the road. Free to enter the park."},{key:"Distance from villa",val:"35 minutes south."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJa9fB0nNFmRIRIy2Yk7wr0H0",alltrails:"https://www.alltrails.com/parks/spain/ibiza/parque-natural-de-ses-salines"}];

const SHOPS=[{id:"s-lidl",lat:38.98004,lng:1.31033,ico:"ti-shopping-bag",col:"ico-gy",nm:"Lidl Sant Antoni",hrs:"Daily 9am–10pm",badge:{t:"Best prices",c:"g"},pills:[{t:"Daily 9am–10pm",c:"time"},{t:"15 mins from villa",c:"info"}],desc:"Best prices on the island. Open every day including Sundays until 10pm — later than any other supermarket. 15 minutes from the villa. Reviewers describe it as the best Lidl in the world, which sets expectations correctly.",sections:[{title:"What to Buy",items:[{key:"Fresh produce",val:"Good quality fruit, vegetables and salads at Lidl prices. The fresh herbs and local tomatoes are particularly good."},{key:"Meat and fish",val:"Well-stocked fresh counter. Good for villa cooking."},{key:"Spanish staples",val:"Excellent selection of Iberian ham, cheeses, olive oil and wines at Lidl prices — a fraction of restaurant costs."},{key:"Alcohol",val:"Full selection. Note: no alcohol sold in Sant Antoni shops after 9:30pm regardless of opening hours."}]},{title:"Practical Details",items:[{key:"Hours",val:"9am to 10pm daily including Sundays — the latest supermarket on the island."},{key:"Location",val:"On the main road into Sant Antoni. 15 minutes from the villa."},{key:"Villa shop",val:"This is the main weekly shop. Do a large run on arrival and top up through the week."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJHeEtjj82mRIREGKdNjAezOE"},
{id:"s-hiper",lat:38.937628,lng:1.4156706,ico:"ti-shopping-bag",col:"ico-gy",nm:"Hiper Centro",hrs:"Mon–Sat 9am–9:30pm · Sun 9am–2:30pm",badge:null,pills:[{t:"Mon–Sat 9am–9:30pm",c:"time"},{t:"Best quality",c:"info"},{t:"On your route",c:"free"}],desc:"On the Ibiza-Sant Antoni road — your main route — so you pass it constantly. A large hypermarket with a fish counter, meat and deli counter, and a wine bodega. Reviewers compare it to Waitrose in quality. The best option when you want good ingredients.",sections:[{title:"What to Buy",items:[{key:"Fish counter",val:"Fresh fish from local waters. Good selection, knowledgeable staff."},{key:"Meat and deli",val:"Excellent cured meats, cheeses and prepared foods. The butcher counter has good quality cuts."},{key:"Wine bodega",val:"A well-stocked wine section with local Ibizan wines alongside Spanish and international selections. Good prices for the quality."}]},{title:"Practical Details",items:[{key:"Hours",val:"Monday to Saturday 9am to 9:30pm. Sunday 9am to 2:30pm — note the early Sunday close."},{key:"Location",val:"Directly on the Ibiza-Sant Antoni road (your main route). You will drive past it multiple times."},{key:"Best for",val:"A proper quality shop when you want to cook something good at the villa."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ4cpEkeJGmRIRI9av03ZyklA"},
{id:"s-spar",lat:38.9621915,lng:1.3972917,ico:"ti-shopping-bag",col:"ico-gy",nm:"SPAR San Rafael",hrs:"Daily 8:30am–9pm",badge:null,pills:[{t:"Daily 8:30am–9pm",c:"time"},{t:"5 mins from villa",c:"free"},{t:"Top-ups",c:"info"}],desc:"5 minutes from the villa in San Rafael village. Limited range but perfect for top-ups — bread, milk, basics, cold drinks. Your nearest shop by far. Good sandwiches from the meat counter.",sections:[{title:"Practical Details",items:[{key:"Hours",val:"Daily 8:30am to 9pm."},{key:"Best for",val:"Quick top-ups. Bread, milk, basics, cold drinks. Not a full weekly shop."},{key:"Sandwiches",val:"The person at the meat counter makes good bocadillos on request."},{key:"Distance",val:"5 minutes from the villa — your closest option for anything forgotten."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJdeN8oZlHmRIRtTiNrLUOhRs"},
{id:"s-proxim",lat:38.9845584,lng:1.2987679,ico:"ti-shopping-bag",col:"ico-gy",nm:"Proxim Sant Antoni",hrs:"Daily until midnight",badge:null,pills:[{t:"Until midnight",c:"time"},{t:"Good prices",c:"free"},{t:"Note: no alcohol 9:30pm+",c:"warn"}],desc:"Good prices, fresh bread, decent alcohol selection. The midnight closing makes it useful when you realise at 11pm you are out of something. Important: no alcohol sold after 9:30pm anywhere in Sant Antoni regardless of shop opening hours.",sections:[{title:"Practical Details",items:[{key:"Hours",val:"Daily until midnight."},{key:"Alcohol rule",val:"No alcohol sold after 9:30pm in Sant Antoni. The shop stays open until midnight but alcohol purchases must be made before 9:30pm."},{key:"Fresh bread",val:"Good fresh bread available until late."},{key:"Location",val:"Sant Antoni. 15 minutes from the villa."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJFTs3SwM2mRIRbvx2yawVH1Q"}];

const SIGHTS=[{id:"g-daltvila",lat:38.9069135,lng:1.4346072,cat:"Culture",ico:"ti-building-castle",col:"ico-bl",nm:"Dalt Vila — Ibiza Town",sub:"UNESCO World Heritage Site",badge:null,pills:[{t:"Free",c:"free"},{t:"Best at dusk",c:"time"},{t:"20 mins from villa",c:"info"}],desc:"The walled hilltop town that has stood here since the 16th century — a UNESCO World Heritage Site and the most historically significant place on the island. The Renaissance fortification walls, the cathedral, the narrow cobbled streets and the panoramic harbour views make this a full-day destination, though it's at its best in the last hour before sunset.",sections:[{title:"What to See",items:[{key:"The ramparts",val:"Walk the full circuit of the 16th-century fortification walls. The views across the marina, the island and out to Formentera are extraordinary at any time of day."},{key:"Dalt Vila streets",val:"Narrow cobbled streets winding up through layers of history — medieval, Arab, Roman origins visible in the architecture. Small galleries, boutiques and restaurants tucked into ancient buildings."},{key:"The cathedral",val:"At the highest point. The terrace in front of it is one of the best viewpoints on the island. Worth climbing to even if the cathedral itself is closed."},{key:"Dusk",val:"The stone walls turn gold then rose as the light drops — the single best hour to be up here. Come up in the late afternoon and let the walk down coincide with sunset."}]},{title:"Practical Details",items:[{key:"Free to enter",val:"The walls and streets are free. Some specific sites have small entry fees."},{key:"Hours",val:"The area is open all day. The cathedral has specific opening hours."},{key:"Getting there",val:"20 minutes from the villa. Park below the walls and walk up — cars cannot access most of Dalt Vila."},{key:"Best approach",val:"Morning for a quiet wander, dusk for the light, evening for dinner in the old town below."}]},{title:"Nearby",items:[{key:"Pintxos and tapas",val:"<span class=\"slot-link\" onclick=\"goTo('eat','e-elzaguan')\">El Zaguán</span>, <span class=\"slot-link\" onclick=\"goTo('eat','e-estapnou')\">Es Tap Nou</span> and <span class=\"slot-link\" onclick=\"goTo('eat','e-escantonet')\">Es Cantonet</span> are all a short walk below the walls — a natural cluster for dinner after the climb down."},{key:"The marina",val:"<span class=\"slot-link\" onclick=\"goTo('sights','g-marina')\">Ibiza Town marina</span> sits directly beneath Dalt Vila — combine the two for a full evening in town."},{key:"Pacha",val:"<span class=\"slot-link\" onclick=\"goTo('clubs','c-pacha')\">Pacha Ibiza</span> is on the marina, a few minutes' walk from the old town."}]}],note:null,maps:"https://www.google.com/maps/search/Dalt+Vila+Ibiza+Town"},
{id:"g-esvedra",lat:38.8902227,lng:1.2242623,cat:"Natural sight",ico:"ti-mountain",col:"ico-gn",nm:"Es Vedra and Cala d'Hort",sub:"Southwest Ibiza · 30 mins from villa",badge:null,pills:[{t:"Access changing",c:"warn"},{t:"Free",c:"free"},{t:"Sunset essential",c:"time"}],desc:"The island's most dramatic natural sight — a 382-metre rocky island rising from the sea, uninhabited and protected. Various legends attach to it including connections to Ulysses and the Sirens. The classic clifftop viewpoint is currently closed, so the reliable way to see it is from Cala d'Hort beach itself.",sections:[{title:"The Experience",items:[{key:"The legend",val:"Es Vedra is supposedly where Homer placed the island of the Sirens in the Odyssey. It is also claimed to be one of the world's most magnetic spots after the North and South Poles. The legends are part of the experience."},{key:"Where to actually see it",val:"The old clifftop path to the Puig des Savinar watchtower has been closed since February 2025 after landowners blocked access. A newer viewing platform above the beach has also had its own access disputes. Cala d'Hort beach itself is the reliable option — see the Walks tab entry for the full picture and a short alternative walk."},{key:"Sunset timing",val:"In September the sun sets slightly north of west — it drops behind or very near Es Vedra. The timing is approximately 8:15pm in early September. Being in position by 7:30pm is sensible."}]},{title:"Practical Details",items:[{key:"Access",val:"Drive to Cala d'Hort beach. 30 minutes from the villa. No hiking required for the view."},{key:"The beach restaurant",val:"The restaurant at Cala d'Hort beach has direct views. A natural combination — arrive for sunset, dinner at the restaurant afterwards."}]},{title:"Nearby",items:[{key:"Full walk write-up",val:"<span class=\"slot-link\" onclick=\"goTo('walks','w-caladhort')\">Cala d'Hort — Es Vedrà views</span> in the Walks tab has the complete access situation and practical timings."},{key:"An actual walk with Es Vedrà views",val:"<span class=\"slot-link\" onclick=\"goTo('walks','w-escubells')\">Es Cubells — Cala Llentrisca coastal walk</span> reaches a different, still-open viewpoint further south."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJs7iAo69MmRIRJJzqAkHqgeQ"},
{id:"g-sessalines",lat:38.8505813,lng:1.3889324,cat:"Nature",ico:"ti-leaf",col:"ico-gn",nm:"Ses Salines natural park",sub:"South · 35 mins from villa",badge:null,pills:[{t:"Free",c:"free"},{t:"Close to airport",c:"info"},{t:"Flamingos possible",c:"free"}],desc:"UNESCO-protected salt flats, dunes and pine forest. Flamingos are possible in September as they gather before winter migration. A completely different landscape from anywhere else on the island. Close to the airport — ideal for a gentle last morning.",sections:[{title:"What to See",items:[{key:"The salt pans",val:"Pink and white crystalline flats producing salt since Phoenician times. The colour intensifies toward sunset."},{key:"Wildlife",val:"Flamingos in September, wading birds, raptors. The transition between the salt flat ecosystem and the pine dune ecosystem supports unusual biodiversity."},{key:"Es Cavallet beach",val:"One of the most beautiful beaches on the island — long, natural, backed by dunes and pine. Adjacent to the park."}]},{title:"Practical Details",items:[{key:"Free entry",val:"Open access. No ticket required."},{key:"Best timing",val:"Morning for wildlife. Combine with Experimental Beach (Cavallet area) for a final sundowner."},{key:"Airport proximity",val:"5 minutes from the runway — useful for a last-morning activity."}]},{title:"Nearby",items:[{key:"Walk the park",val:"<span class=\"slot-link\" onclick=\"goTo('walks','w-sessalines')\">Ses Salines natural park</span> and <span class=\"slot-link\" onclick=\"goTo('walks','w-torreportes')\">Torre de ses Portes — Ses Salines beach loop</span> in the Walks tab cover routes through the park on foot."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJa9fB0nNFmRIRIy2Yk7wr0H0"},
{id:"g-benirras",lat:39.0892175,lng:1.4537313,cat:"Beach",ico:"ti-wave-sine",col:"ico-bl",nm:"Cala Benirras — Sunday sunset drums",sub:"North Ibiza",badge:null,pills:[{t:"Free",c:"free"},{t:"Sundays",c:"time"},{t:"Bus on Sundays",c:"warn"}],desc:"Every Sunday, locals and visitors gather on this north-coast beach to drum as the sun sets behind the God's Finger rock (Cap Bernat). Free, bohemian and one of the truly iconic Ibiza experiences — arrive early for a spot on the sand or the rocks.",sections:[{title:"The Experience",items:[{key:"Sunday drum circles",val:"Drummers of all ages gather on the beach and rocks as the sun drops behind God's Finger. Organic, building, genuinely moving. One of the most authentic Ibiza experiences and entirely free."},{key:"Friday and Tuesday hippie market",val:"A market of artisan stalls and food around the bay at sunset. Less intense than the drum circles but a lovely early evening."}]},{title:"Practical Details",items:[{key:"Sunday logistics",val:"Traffic is impossible on Sundays. Park at Sant Joan car park and take the shuttle bus. Not optional. Arrive early for a spot."},{key:"Friday and Tuesday",val:"Drive and park at the beach. Much easier."},{key:"Timing in September",val:"Sunset around 8:15pm early September. Arrive 45 minutes before for the best position."}]},{title:"Nearby",items:[{key:"Same beach, in the Clubs tab",val:"<span class=\"slot-link\" onclick=\"goTo('clubs','c-benirras')\">Cala Benirràs — drum circles and market</span> has the same event with additional logistics notes."},{key:"Lunch on the way",val:"<span class=\"slot-link\" onclick=\"goTo('sights','g-santjoan')\">Sant Joan de Labritja</span> is 20 minutes west — a good lunch stop before heading to Benirràs for sunset."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJMarVGW48mRIRzA5PaaR-b48"},
{id:"g-calabassa",lat:38.967757,lng:1.241227,cat:"Beach",ico:"ti-wave-sine",col:"ico-bl",nm:"Cala Bassa",sub:"West coast · 20 mins from villa",badge:null,pills:[{t:"Free beach",c:"free"},{t:"Crystal water",c:"info"},{t:"Walk starting point",c:"time"}],desc:"One of the most beautiful west coast beaches on the island — a horseshoe bay with clear turquoise water, pine trees and the Torre den Rovira watchtower above. Starting point for the coastal loop walk that links three beaches.",sections:[{title:"The Beach",items:[{key:"Water quality",val:"Consistently clear and clean. The shallow entry makes it good for swimming at any pace."},{key:"Setting",val:"Backed by pine trees with the watchtower visible above. More protected and less developed than many Ibiza beaches."},{key:"Beach club",val:"There is a beach club on the beach but the public section is accessible without minimum spend."}]},{title:"Practical Details",items:[{key:"Getting there",val:"20 minutes from the villa. Summer bus service from Sant Antoni if you prefer."},{key:"The walk",val:"Starting point for the Torre den Rovira coastal loop linking Cala Bassa, Torre den Rovira and Cala Conta."}]},{title:"Nearby",items:[{key:"The full loop walk",val:"<span class=\"slot-link\" onclick=\"goTo('walks','w-calabassa')\">Cala Bassa — Torre d'en Rovira loop</span> in the Walks tab starts right here."},{key:"Another west coast beach",val:"<span class=\"slot-link\" onclick=\"goTo('sights','g-calatarida')\">Cala Tarida</span> is a short drive south — calmer, shallower water, better for families."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJBxfkK45KmRIRxSB6XOTHhik"},
{id:"g-puntagalera",lat:39.0046316,lng:1.2931396,cat:"Natural sight",ico:"ti-wave-sine",col:"ico-bl",nm:"Punta Galera stone platform",sub:"Near Cala Salada · 20 mins",badge:null,pills:[{t:"Free",c:"free"},{t:"Very local",c:"free"},{t:"Best at sunset",c:"time"}],desc:"A unique geological feature — flat limestone terraces descending in steps into crystal clear water. Very popular with locals, almost completely unknown to tourists. The rock formations are unlike anything else on the island.",sections:[{title:"What to Expect",items:[{key:"The geology",val:"Layered flat limestone descending into the sea. Natural hollows and pools form in the rock. People lay out on the flat sections and swim from the edges."},{key:"Swimming",val:"Excellent — clear, calm, accessible. The natural rock pools are sheltered even when there is some swell on the open sections."},{key:"Sunset",val:"The flat terraces face west. Watching the sunset from here with your feet in the water is one of the simple pleasures of staying near the villa."}]},{title:"Practical Details",items:[{key:"Getting there",val:"Park at Cala Salada and take the coastal path north. The platform is approximately 15 minutes from the car park."},{key:"What to bring",val:"Swimming things, water shoes or sandals for the rocky approach, snacks and water."}]},{title:"Nearby",items:[{key:"The walk",val:"<span class=\"slot-link\" onclick=\"goTo('walks','w-puntagalera')\">Punta Galera</span> in the Walks tab covers the same short walk from Cala Salada."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ-QZYi3Q2mRIRc_lCgzzCtfw"},
{id:"g-xarraca",lat:39.0983932,lng:1.4973655,cat:"Beach",ico:"ti-wave-sine",col:"ico-bl",nm:"Cala Xarraca",sub:"North · Near Portinatx",badge:null,pills:[{t:"Free",c:"free"},{t:"Mud bath",c:"free"},{t:"Sheltered cove",c:"info"}],desc:"A sheltered northern cove with something genuinely unusual — a natural mud bath in a crevice to the left of the bay. The reddish clay emerges from the cliff face, people cover themselves and wash off in the clear water. Quiet and local.",sections:[{title:"What to Do",items:[{key:"The mud bath",val:"In the crevice to the left when facing the sea. Reddish clay, traditionally held to have therapeutic properties. Apply, wait, wash off. A genuinely unusual experience."},{key:"Swimming",val:"The cove is sheltered and exceptionally clear. Good snorkelling off the rocks."},{key:"Extension",val:"Continue east along the coast toward isolated coves if you want more walking."}]},{title:"Practical Details",items:[{key:"Getting there",val:"Follow signs to Portinatx then Cala Xarraca. Small car park."},{key:"Best time",val:"Morning. Quiet and shaded at the eastern end of the bay."}]},{title:"Nearby",items:[{key:"The walk",val:"<span class=\"slot-link\" onclick=\"goTo('walks','w-xarraca')\">Cala Xarraca</span> in the Walks tab is the same short loop from the car park."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ-ZREWqE9mRIRJI9KyDMTKi8"},
{id:"g-santagertrudis",lat:38.9986978,lng:1.4283253,cat:"Village",ico:"ti-home",col:"ico-am",nm:"Santa Gertrudis de la Fruitera",sub:"Interior village · 15 mins from villa",badge:null,pills:[{t:"15 mins from villa",c:"info"},{t:"Bar Costa + Can Mimosa",c:"free"}],desc:"The most charming of the interior villages, and very close to the villa — a whitewashed cluster around a simple church with art galleries, boutiques and café terraces lining the square. Bar Costa is the local institution; Can Mimosa is tucked just behind. Perfect for a slow morning browsing the shops, or an early evening drink before dinner.",sections:[{title:"What to Do",items:[{key:"Bar Costa",val:"The institution. Hanging hams, famous bocadillos, cold beer in the square. Arrive around 6:30pm for the evening, or mid-morning for a slow coffee."},{key:"Galleries and boutiques",val:"Several small art galleries and independent boutiques around the square and side streets — genuinely worth a browse, not just souvenir shops."},{key:"Café terraces",val:"Multiple good terraces around the square for a coffee or lunch at a slower pace than the coast."},{key:"Can Mimosa",val:"200m from Bar Costa — the farmhouse garden restaurant. Move there at 7:30pm for dinner."}]},{title:"Practical Details",items:[{key:"Getting there",val:"15 minutes from the villa. Easy drive — one of the closest villages."},{key:"Best timing",val:"A slow morning for the galleries and boutiques, or 6pm to 10pm for the classic village evening."}]},{title:"Nearby",items:[{key:"Bar Costa",val:"<span class=\"slot-link\" onclick=\"goTo('eat','e-barcosta')\">Bar Costa</span> in the Eat tab has the full write-up and hours."},{key:"Can Mimosa",val:"<span class=\"slot-link\" onclick=\"goTo('eat','e-canmimosa')\">Can Mimosa</span> — the dinner pairing 200m away."}]}],note:null,maps:"https://www.google.com/maps/search/Santa+Gertrudis+de+Fruitera+Ibiza"},
{id:"g-santjoan",lat:39.0778886,lng:1.5139034,cat:"Village",ico:"ti-home",col:"ico-am",nm:"Sant Joan de Labritja",sub:"North Ibiza village",badge:null,pills:[{t:"45 mins from villa",c:"info"},{t:"Prettiest north village",c:"free"}],desc:"The prettiest village in the north of the island — a simple church square, a handful of houses, a bar, an atmosphere entirely removed from tourist Ibiza. Lunch here is one of the great simple pleasures of a north day.",sections:[{title:"What to Do",items:[{key:"Lunch at the local bar",val:"Menú del día at around €14. Fresh, simple, very Spanish. The bar has been here for decades."},{key:"The square",val:"Sit in the square, have a coffee, watch the village. Nothing happens quickly."},{key:"Combine with",val:"The Port Sant Miquel coastal walk (40 minutes south), Cala Benirras sunset (20 minutes east)."}]},{title:"Practical Details",items:[{key:"Getting there",val:"45 minutes from the villa through the beautiful interior."},{key:"Best approach",val:"Lunch here on any north day. No reservation needed."}]},{title:"Nearby",items:[{key:"Afternoon walk",val:"<span class=\"slot-link\" onclick=\"goTo('walks','w-santmiquel')\">Port de Sant Miquel coastal circuit</span> is 40 minutes south."},{key:"Sunset",val:"<span class=\"slot-link\" onclick=\"goTo('sights','g-benirras')\">Cala Benirràs — Sunday sunset drums</span> is 20 minutes east — the natural next stop on a north day."}]}],note:null,maps:"https://www.google.com/maps/search/Sant+Joan+de+Labritja+Ibiza"},
{id:"g-kumharas",lat:38.97198849999999,lng:1.2827245,cat:"Bar/Sunset",ico:"ti-sun",col:"ico-am",nm:"Kumharas",sub:"Sant Antoni sunset strip · 15 mins",badge:null,pills:[{t:"£",c:"price"},{t:"From 5pm",c:"time"},{t:"Locals favourite",c:"free"}],desc:"The locals' answer to Cafe del Mar — faces west for the full sunset, drinks at around €5, food from street van vendors. A relaxed bohemian atmosphere that the commercial strips entirely lack. 15 minutes from the villa.",sections:[{title:"What to Expect",items:[{key:"The sunset",val:"Same western orientation as Cafe del Mar and Cafe Mambo. The sunset is identical. The atmosphere is completely different — relaxed, unpretentious, predominantly local."},{key:"Drinks prices",val:"Around €5 — a fraction of Cafe del Mar prices for the same sunset view."},{key:"Food",val:"Street food vans set up in the evenings with varied international food. Eat from the van, drink at the bar, watch the sunset."},{key:"Music",val:"Ambient, chilled electronic music at a volume that allows conversation. Nothing intrusive."}]},{title:"Practical Details",items:[{key:"Hours",val:"Opens from 5pm. The golden hour 7-8:30pm is the sweet spot."},{key:"Getting there",val:"15 minutes from the villa. On the Sant Antoni sunset promenade, past Cafe del Mar."},{key:"The alternative",val:"Cafe del Mar is worth experiencing once for the spectacle. But for a regular sunset spot, Kumharas is the choice."}]},{title:"Nearby",items:[{key:"Full menu write-up",val:"<span class=\"slot-link\" onclick=\"goTo('eat','e-kumharas')\">Kumharas</span> in the Eat tab has the food menu and dinner-focused practical details."},{key:"Other sunset strip options",val:"<span class=\"slot-link\" onclick=\"goTo('clubs','c-cafemambo')\">Café Mambo</span> and <span class=\"slot-link\" onclick=\"goTo('clubs','c-cafedelmar')\">Café del Mar</span> are the pricier, more famous neighbours along the same strip."}]}],note:null,maps:"https://www.google.com/maps/place/?q=place_id:ChIJ0cIx9wRKmRIRUkWCxX0xJro"},
{id:"g-formentera",lat:39.0200099,lng:1.4821482,cat:"Day trip",ico:"ti-ship",col:"ico-pur",nm:"Formentera day trip",sub:"Ferry from Ibiza Town port",badge:null,pills:[{t:"££ ferry",c:"price"},{t:"Full day",c:"time"},{t:"Book ferry ahead",c:"warn"}],desc:"Fast ferry 30 minutes from Ibiza Town port. The water at Formentera is widely regarded as the clearest in the Mediterranean — a genuinely extraordinary turquoise that photographs cannot do justice to. Hire a bike and explore — the beaches at Illetes and Ses Platgetes are the highlights, and the island is flat and quiet with almost no commercial development.",sections:[{title:"The Day",items:[{key:"Illetes and Ses Platgetes",val:"The two standout beaches, both near the northern tip — sandbar-thin strips of white sand between the turquoise lagoon and the open sea. The single best reason to make the trip."},{key:"Transport",val:"Hire bikes or mopeds at the port to explore the island. It is flat — cycling is easy. The lighthouse at the southern tip is a good destination."},{key:"Lunch",val:"Simple chiringuito beach restaurants serve fresh fish at good prices. The local ensaimada pastries are excellent."}]},{title:"Practical Details",items:[{key:"Ferry",val:"Fast ferry approximately 30 minutes each way. Multiple companies operate. Book in advance especially for September."},{key:"Cost",val:"Ferry return approximately €35-50 per person. Budget ££ for the day including transport and food."},{key:"Ferry port",val:"In Ibiza Town — 20 minutes from the villa. Early morning ferries are worth it to reach Formentera before it gets busy."},{key:"Duration",val:"A full day trip. Take the first ferry and the last one back."}]},{title:"Nearby",items:[{key:"Before or after the ferry",val:"<span class=\"slot-link\" onclick=\"goTo('sights','g-marina')\">Ibiza Town marina</span> and <span class=\"slot-link\" onclick=\"goTo('sights','g-daltvila')\">Dalt Vila</span> are both walkable from the ferry terminal — worth an hour either side of the crossing."}]}],note:null,maps:"https://www.google.com/maps/search/Ibiza+ferry+terminal"},

// ── Expand/collapse ───────────────────────────────────────────────────────────

function toggleCard(id) {
  const card = document.getElementById(id);
  const body = card.querySelector('.card-body');
  if (card.classList.contains('open')) {
    body.style.height = body.scrollHeight + 'px';
    requestAnimationFrame(() => requestAnimationFrame(() => { body.style.height = '0'; }));
    card.classList.remove('open');
  } else {
    card.classList.add('open');
    body.style.height = body.scrollHeight + 'px';
    body.addEventListener('transitionend', () => { body.style.height = 'auto'; }, {once:true});
  }
}

function expandCard(id) {
  const card = document.getElementById(id);
  if (!card || card.classList.contains('open')) return;
  const body = card.querySelector('.card-body');
  card.classList.add('open');
  body.style.height = body.scrollHeight + 'px';
  body.addEventListener('transitionend', () => { body.style.height = 'auto'; }, {once:true});
}

// ── Deep links ────────────────────────────────────────────────────────────────

function copyWLLink(cat, id) {
  const url = window.location.href.split('#')[0] + '#' + cat + '/' + id;
  const btn = document.getElementById('wl-' + id);
  navigator.clipboard.writeText(url).then(() => {
    if (btn) {
      btn.classList.add('copied');
      btn.innerHTML = '<i class="ti ti-check"></i> Copied — paste into Wanderlog notes';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = '<i class="ti ti-link"></i> Copy link for Wanderlog';
      }, 2500);
    }
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = window.location.href.split('#')[0] + '#' + cat + '/' + id;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}

function readHash() {
  const hash = window.location.hash.slice(1);
  if (!hash || !hash.includes('/')) return;
  const [cat, id] = hash.split('/');
  const TAB_MAP = {clubs:'clubs',eat:'eat',walks:'walks',shops:'shops',sights:'sights',plan:'plan'};
  if (!TAB_MAP[cat]) return;

  // Switch tab only if needed
  const btn = document.querySelector(`[data-tab="${cat}"]`);
  if (btn && !btn.classList.contains('on')) showTab(cat, btn);

  // Retry until the element exists in DOM (renders are synchronous but layout may lag)
  function tryOpen(attempt) {
    if (attempt > 20) return; // give up after 2 seconds
    const el = document.getElementById(id);
    if (!el) { setTimeout(() => tryOpen(attempt+1), 100); return; }
    const body = el.querySelector('.card-body');
    if (!body) return;
    // Open instantly — no animation on deep-link open
    body.style.transition = 'none';
    el.classList.add('open');
    body.style.height = 'auto';
    requestAnimationFrame(() => { body.style.transition = ''; });
    // Scroll after one more frame
    requestAnimationFrame(() => {
      const top = el.getBoundingClientRect().top + window.pageYOffset - 56;
      window.scrollTo({top: Math.max(0, top), behavior: 'smooth'});
    });
  }
  setTimeout(() => tryOpen(0), 50);
}

// Fire on every meaningful load moment
window.addEventListener('hashchange', readHash);
window.addEventListener('DOMContentLoaded', readHash);
window.addEventListener('load', readHash);

window.addEventListener('hashchange', readHash);

// ── Rendering ─────────────────────────────────────────────────────────────────

function bdgHtml(b) {
  if (!b) return '';
  return `<span class="badge ${b.c==='g'?'bdg-g':b.c==='w'?'bdg-w':'bdg-n'}">${b.t}</span>`;
}


function linkify(t) {
  if (!t) return t || '';
  // Full URLs with protocol
  t = t.replace(/https?:\/\/[^\s<>"']+/g, u =>
    `<a href="${u}" target="_blank" rel="noopener" class="section-link">${u}</a>`);
  // Bare domains — only match after a space or start, not inside href attributes
  t = t.replace(/(?<=^|[\s:>])([a-z][a-z0-9-]*\.(?:com|es|net|org|ibiza|co\.uk|io)(?:\/[^\s<>"']*)?)/gi, (m) =>
    `<a href="https://${m}" target="_blank" rel="noopener" class="section-link">${m}</a>`);
  return t;
}

function buildBody(r) {
  // Rich format: desc + sections[]
  if (r.desc || r.sections) {
    let out = '';
    if (r.desc) out += `<p class="card-desc">${linkify(r.desc)}</p>`;
    if (r.sections) {
      r.sections.forEach(sec => {
        const items = sec.items.map(it =>
          `<li><span class="section-key">${it.key}:</span> ${linkify(it.val)}</li>`
        ).join('');
        out += `<div class="card-section"><div class="section-title">${sec.title}</div><ul class="section-list">${items}</ul></div>`;
      });
    }
    return out;
  }
  // Simple format: note
  return r.note ? `<p class="card-note">${r.note}</p>` : '';
}

function renderCard(r, cat, extraBody='', num='') {
  const wlBtn = `<button id="wl-${r.id}" class="cl cl-wl" onclick="copyWLLink('${cat}','${r.id}')"><i class="ti ti-link"></i> Copy link for Wanderlog</button>`;
  const webBtn = r.website ? `<a class="cl cl-web" href="${r.website}" target="_blank"><i class="ti ti-world"></i> Website</a>` : '';
  const tixBtn = r.tickets ? `<a class="cl cl-tix" href="${r.tickets}" target="_blank"><i class="ti ti-ticket"></i> Book tickets</a>` : '';
  const mapsBtn = r.maps ? `<a class="cl cl-maps" href="${r.maps}" target="_blank"><i class="ti ti-map-pin"></i> Google Maps</a>` : '';
  const atBtn = (cat==='walks' && r.alltrails) ? `<a class="cl cl-at" href="${r.alltrails}" target="_blank"><i class="ti ti-route"></i> AllTrails</a>` : '';

  return `<div class="card" id="${r.id}">
    <div class="card-hdr" onclick="toggleCard('${r.id}')">
      <div class="ex"><div class="ex-c">${num}</div><span class="ex-arr"></span></div>
      <div class="card-meta">
        <div class="card-top">
          <span class="card-name">${r.nm}</span>
        </div>
        <div class="card-sub">${r.sub||r.hrs||''}</div>
        ${(()=>{
          const bp = r.badge && !(r.pills||[]).some(p=>p.t.toLowerCase().includes(r.badge.t.toLowerCase())||r.badge.t.toLowerCase().includes(p.t.toLowerCase())) ? [{t:r.badge.t,c:r.badge.c==='g'?'free':r.badge.c==='w'?'warn':'info'}] : [];
          const ap = [...bp,...(r.pills||[])];
          const ORDER={price:0,warn:1,free:2,genre:3,time:4,info:5};
          ap.sort((a,b)=>(ORDER[a.c]??6)-(ORDER[b.c]??6));
          return ap.length ? `<div class="pills-row">${ap.map(p=>`<span class="pill pill-${p.c}">${p.t}</span>`).join('')}</div>` : '';
        })()}
      </div>
    </div>
    <div class="card-body" style="height:0;overflow:hidden;transition:height .32s ease">
      <div class="card-divider"></div>
      <div class="card-body-inner">
        ${extraBody}
        ${buildBody(r)}
        <div class="card-links">${mapsBtn}${atBtn}${webBtn}${tixBtn}${wlBtn}</div>
      </div>
    </div>
  </div>`;
}

function renderClubs() {

  CLUBS.forEach((r,i) => { h += renderCard(r, 'clubs', '', i+1); });
  document.getElementById('clubs-list').innerHTML = h;

const WALK_LEN_BANDS = [
  {id:'all',nm:'All'},
  {id:'short',nm:'Short (≤3km)'},
  {id:'medium',nm:'Medium (3–6km)'},
  {id:'long',nm:'Long (6km+)'},
];
const WALK_DIFFS = ['all','Easy','Moderate'];
function inWalkLenBand(km, band) {
  if (band==='all') return true;
  if (band==='short') return km <= 3;
  if (band==='medium') return km > 3 && km <= 6;
  if (band==='long') return km > 6;
  return true;
}
let walkLenFilter = 'all';
let walkDiffFilter = 'all';
function renderWalks(lenF, diffF) {
  walkLenFilter = lenF || walkLenFilter;
  walkDiffFilter = diffF || walkDiffFilter;
  const lenBtns = WALK_LEN_BANDS.map(b =>
    `<button class="sf-btn${walkLenFilter===b.id?' on':''}" onclick="renderWalks('${b.id}')">${b.nm}</button>`
  ).join('');
  const diffBtns = WALK_DIFFS.map(d =>
    `<button class="sf-btn${walkDiffFilter===d?' on':''}" onclick="renderWalks(null,'${d}')">${d==='all'?'All':d}</button>`
  ).join('');
  let h = `<div class="sf-group"><span class="sf-label">Length</span><div class="sf-row">${lenBtns}</div></div>
    <div class="sf-group"><span class="sf-label">Difficulty</span><div class="sf-row">${diffBtns}</div></div>`;
  WALKS.filter(r => inWalkLenBand(r.distKm, walkLenFilter) && (walkDiffFilter==='all' || r.diff===walkDiffFilter)).forEach((r,i) => {
    h += renderCard(r, 'walks', '', i+1);
  });
  document.getElementById('walks-list').innerHTML = h;
}

function renderShops() {
  let h = '';
  SHOPS.forEach((r,i) => { h += renderCard(r, 'shops', '', i+1); });
  document.getElementById('shops-list').innerHTML = h;
}

let sightFilter = 'all';
function renderSights(f) {
  sightFilter = f || sightFilter;
  const btns = SIGHT_CATS.map(c =>
    `<button class="sf-btn${sightFilter===c?' on':''}" onclick="renderSights('${c}')">${c==='all'?'All':c}</button>`
  ).join('');
  let h = `<div class="sf-row">${btns}</div>`;
  SIGHTS.filter(r => sightFilter==='all' || r.cat===sightFilter).forEach((r,i) => {
    const cc = r.cat.replace(/[\/\s]+/g,'-');
    const catBadge = `<span class="catb cat-${cc}" style="margin-bottom:4px;display:inline-block">${r.cat}</span>`;
    h += renderCard(r, 'sights', catBadge, i+1);

function renderPlan() {
  let h = `<div class="summary" style="margin-bottom:12px">Six suggested day shapes — tap any underlined item to jump to the full entry in the relevant tab. Mix and match freely; these are starting points.</div>`;
  ITINS.forEach((it, idx) => {
    const slotsHtml = it.slots.map((sl,i) => {
      const nm = sl.tab
        ? `<span class="slot-name slot-link" onclick="goTo('${sl.tab}','${sl.id}')">${sl.nm}</span>`

      return `<div class="slot" style="${border}"><div class="slot-time">${sl.time}</div><div>${nm}</div></div>`;
    }).join('');
    const wlBtn = `<button id="wl-itn-${it.id}" class="cl cl-wl" onclick="copyWLLink('plan','itn-${it.id}')"><i class="ti ti-link"></i> Copy link for Wanderlog</button>`;
    h += `<div class="card" id="itn-${it.id}">
      <div class="card-hdr" onclick="toggleCard('itn-${it.id}')">

        <div class="card-meta">
          <div class="card-name">${it.title}</div>
          <div class="card-sub">${it.theme}</div>

      <div class="card-body" style="height:0;overflow:hidden;transition:height .32s ease">

        <div style="padding:0 12px 14px 56px"><div class="card-links">${wlBtn}</div></div>
      </div>
    </div>`;

// ── Navigation ────────────────────────────────────────────────────────────────

function showTab(id, btn) {
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  btn.classList.add('on');
  window.scrollTo(0, 0);
  initTabMap(id);
}

// ── Tab overview maps ─────────────────────────────────────────────────────────

let gmapsReady = false;
let lastShownTab = 'clubs';
const tabMaps = {};
const MAP_DATA = {clubs:() => CLUBS, eat:() => EATS, walks:() => WALKS, shops:() => SHOPS, sights:() => SIGHTS};

function onGMapsReady() { gmapsReady = true; initTabMap(lastShownTab); }

function tabMarkerIcon(n) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30">
    <circle cx="15" cy="15" r="13" fill="#1870A8" stroke="#fff" stroke-width="2"/>
    <text x="15" y="15" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">${n}</text>
  </svg>`;
  return {
    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
    scaledSize: new google.maps.Size(30, 30),
    anchor: new google.maps.Point(15, 15),
  };
}

function openMapMarker(tab, id) {
  if (tab === 'walks' && (walkLenFilter !== 'all' || walkDiffFilter !== 'all')) {
    walkLenFilter = 'all'; walkDiffFilter = 'all';
    renderWalks('all', 'all');
  }
  if (tab === 'sights' && sightFilter !== 'all') {
    renderSights('all');
  }
  goTo(tab, id);
}

function initTabMap(tab) {
  lastShownTab = tab;
  if (!MAP_DATA[tab] || tabMaps[tab] || !gmapsReady) return;
  const el = document.getElementById(tab + '-map');
  if (!el) return;
  const map = new google.maps.Map(el, {
    center: {lat: 39.0, lng: 1.42},
    zoom: 10.3,
    streetViewControl: false,
    fullscreenControl: false,
    mapTypeControl: false,
    styles: [{featureType: 'poi', stylers: [{visibility: 'off'}]}],
  });
  tabMaps[tab] = map;
  MAP_DATA[tab]().forEach((r, i) => {
    if (r.lat == null || r.lng == null) return;
    const marker = new google.maps.Marker({
      position: {lat: r.lat, lng: r.lng},
      map: map,
      icon: tabMarkerIcon(i + 1),
      title: r.nm,
    });
    marker.addListener('click', () => openMapMarker(tab, r.id));
  });
}

function goTo(tab, id) {
  const btn = document.querySelector(`[data-tab="${tab}"]`);
  if (btn) showTab(tab, btn);
  setTimeout(() => {
    const el = document.getElementById(id);
    if (!el) return;
    expandCard(id);
    setTimeout(() => {
      const offset = el.getBoundingClientRect().top + window.pageYOffset - 52;
      window.scrollTo({top: offset, behavior: 'smooth'});
    }, 360);
  }, 80);
}

renderClubs();

renderSights('all');
renderPlan();
